        context_notes: |
          Versão grupo/conteúdo. 'Peace out' encerra de forma leve sem
          aderência.
    source_refs:
      - "Do_what_makes_you_HAPPY"
      - "How_far_would_you_drive_for_a_sneaky_link"

  - id: en_exit_kiss_on_cheek_bolivia
    situation: "exit_physical — quando você quer despedida com contato"
    variants:
      - tone: estrategico
        text: "Well, in my country — I'm from Bolivia — we kiss goodbye on the cheek. — That's a little much. — All right, like this then. [extends hand]"
        context_notes: |
          Usa background cultural pra propor contato físico. Se ela
