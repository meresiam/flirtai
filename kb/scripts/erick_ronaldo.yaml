  # ============= LANGUAGE/CULTURAL CONNECTIONS =============
  - id: en_cultural_que_bola_cuban
    situation: "rapport_cultural — quando ela diz que é cubana"
    variants:
      - tone: autentico
        text: "Cuban? Que bola hacer? Que bola es ese?"
        context_notes: |
          Cumprimento informal cubano = entry-pass pra cubana. Pronuncie
          relaxado, não tente sotaque perfeito. Se você não é cubano,
          ela vai rir do esforço — que é o objetivo.
    source_refs:
      - "Do_what_makes_you_HAPPY"
      - "HOW_CAN_A_GUY_TAKE_YOU_HOME"

  - id: en_cultural_pana_marico_venezuelan
    situation: "rapport_cultural — quando ela diz que é venezuelana"
    variants:
      - tone: autentico
        text: "Venezuela? Pana, marico, chama! Que mas?"
        context_notes: |
          Gírias venezuelanas. 'Marico' é informal entre amigos e
          quebra qualquer formalidade. Cuidado fora desse contexto —
          gíria forte.
    source_refs:
      - "HOW_CAN_A_GUY_TAKE_YOU_HOME"

  - id: en_cultural_paisa_arepa_colombian
    situation: "rapport_cultural — colombiana paisa de Medellín"
    variants:
      - tone: autentico
        text: "Que parte? Medellin? Que mas pues? Mas paisa que una arepa."
        context_notes: |
          'Mas paisa que una arepa' = 'mais paisa que uma arepa' —
          gíria que sinaliza você reconhece a identidade regional. Só
          funciona com paisa (Antioquia, Medellín).
    source_refs:
      - "Do_what_makes_you_HAPPY"

  - id: en_cultural_habibi_arab
    situation: "rapport_cultural — mulher árabe/saudita"
    variants:
      - tone: autentico
        text: "Habibi. That's all I know — you can teach me."
        context_notes: |
          'Habibi' é universal árabe. Admitir que só sabe uma palavra
          + convite pra ela ensinar gera engajamento futuro
          (conversação continuada).
    source_refs:
      - "I_m_6_feet_can_I_get_your_number"

  - id: en_cultural_je_taime_french
    situation: "rapport_cultural — mulher francesa"
    variants:
      - tone: autentico
        text: "France? Je t'aime beaucoup. That's all I know."
        context_notes: |
          'Je t'aime beaucoup' significa 'eu te amo muito' — over the
          top, mas funciona porque ele assume desde o início que é
          ignorância sincera.
    source_refs:
