  - id: memento_mori_interno
    situation: "automotivação_matinal_estoica"
    variants:
      - tone: estrategico
        text: "Memento mori. Hoje pode ser o seu último dia. Por que esse mau humor? Por que essa procrastinação?"
        context_notes: >
          Mantra/pergunta para uso interno em manhãs apáticas ou
          momentos de adiamento crônico. Frase estoica que Donadelli
          adota como combustível de presença/ação. Steve Jobs e Marco
          Aurélio usavam variações.
    source_refs:
      - "LifeHacker — 'memento mori. Lembre-se de sua mortalidade. Steve Jobs fez muitas outras pessoas, Michael Aurelio'"

# NOTA EXPLÍCITA PARA SYNTHESIS:
# Diferentemente de Greene (frases prontas de poder), Strauss (rotinas
# de abertura) e até Glover (declarações de necessidade), Donadelli é
# o mind que LITERALMENTE NÃO ENSINA scripts externos. Quando o FlirtAI
# encontrar pergunta tipo "que mensagem mando agora?" — Donadelli serve
# como CONTRAPONTO para perguntar antes "qual é o estado interno desse
# usuário?". Se o estado interno está podre, nenhum script salva.
