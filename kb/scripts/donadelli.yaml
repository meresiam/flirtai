          virada com pornografia aos 19. Vê-se de fora como se fosse
          terceiro observando — analisa a cena.
    source_refs:
      - "À Deriva — 'me vi naquela cena patética vendo um outro cara fazer um negócio que eu queria fazer'"

  - id: comunicacao_com_parceira_sobre_tantra
    situation: "explicar_para_parceira_a_escolha_de_nao_ejacular"
    variants:
      - tone: autentico
        text: "Eu preciso dessa energia pro meu trabalho/propósito. Vou ficar X dias sem ejacular — quero continuar transando, mas sem orgasmo da minha parte. Quer experimentar isso comigo?"
        context_notes: >
          Único 'script social' implícito no corpus. Donadelli relata
          conversa real com namorada. Tom é DIRETO, vulnerável, sem
          pedido de permissão tipo-Nice-Guy. Apresenta como decisão
