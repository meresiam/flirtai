# emerge de aura/presença, não de fala pré-planejada.
#
# O ÚNICO "script" extraível é o INTERNO — auto-comunicação, afirmações,
# visualizações. Documento aqui esses poucos exemplos para completude
# da KB, mas o arquivo é deliberadamente magro.

