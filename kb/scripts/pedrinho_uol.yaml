  # ============================================================
  # CANTADA_PESQUISA — frame "tô fazendo uma pesquisa"
  # Quebra-gelo clássico do Pedrinho: aborda com pretexto de pesquisa
  # ============================================================

  - id: cantada_pesquisa_um_ano
    situation: aborda mulher no shopping com frame de pesquisa neutra, depois vira cantada
    variants:
      - tone: comico
        text: |
          Opa moça! Tudo bem? Eu tô fazendo uma pesquisa com as meninas aqui do shopping.
          Posso fazer uma pesquisa com você? — O que você pretende estar fazendo daqui a um ano?
          [após resposta dela] O que você acha de estar completando um ano de namoro comigo?
          Pra gente começar pelo primeiro beijo hoje, daqui a um ano a gente tá fazendo um aninho.
        context_notes: "Setup neutro (pesquisa) → punchline romântica. Geralmente arranca riso e até selinho na reação."
    source_refs:
      - Oq_vc_acha_cantadas_cantadas

  - id: cantada_pesquisa_gato_de_botas
    situation: pesquisa absurda como quebra-gelo antes de cantada real
    variants:
      - tone: comico
        text: |
          Posso fazer uma pesquisa com você? Como que é seu nome? Você já viu o novo Gato de Botas?
          [após "não"] Obrigado. [vai embora, depois volta] Moço, e agora? Isso aqui foi só pra quebrar o gelo.
        context_notes: "Pesquisa idiota propositalmente — confessar que era só pretexto vira piada e abre conversa real."
    source_refs:
      - JA_VIU_O_NOVO_GATO_DE_BOTAS_cantadas_pedrinhuol

  - id: cantada_pesquisa_filmes
    situation: aborda como se fosse pesquisa de plataforma de streaming
    variants:
      - tone: comico
        text: |
          Uma pesquisa dos filmes que quer assistir. Aqui tem três: Cavaleiros do Zodíaco,
          Morte do Demônio, Guardiões das Galáxias. Qual desse é seu favorito?
        context_notes: "Pretexto longo de promoção de filme — eventualmente vira cantada disfarçada."
    source_refs:
      - O_FINAL_pedrinhuol_viral_cantadas_humor_xavecos

  # ============================================================
  # CANTADA_VISUAL — gatilho na aparência/roupa
  # ============================================================

  - id: cantada_beleza_toda
    situation: ela está produzida ou notavelmente bonita
    variants:
      - tone: comico
        text: |
          Deixa eu te falar, como que você arrumou isso aí? — O quê? — Essa beleza toda.
        context_notes: "Abertura padrão Pedrinho. Setup ambíguo (pode ser sobre objeto) → reveal sobre ela."
