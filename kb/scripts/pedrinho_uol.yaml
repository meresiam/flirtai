        context_notes: "Trocadilho 'linha' (costura/raciocínio). Reciclável em qualquer cenário."
    source_refs:
      - Voce_sabe_o_preco_de_um_cantadas_pedrinhuol
      - O_FINAL_cantadas_pedrinhuol_festajunina

  - id: cantada_neymar_sorriso
    situation: ela tem um sorriso bonito
    variants:
      - tone: comico
        text: |
          Parece que eu te conheço de algum lugar. [não é daqui?] Ah, então acho que é seu sorriso.
          Sabe o que ele parece? O Neymar no Santos. Que é impossível de esquecer.
        context_notes: "Comparação esportiva inesperada vira elogio. Boa pra audiência futebolística."
    source_refs:
      - Seu_sorriso_parece_o_Neymar_no_Santos_pedrinhuol_cantadas
      - UMA_PALAVRA_UMA_CANTADA_cantadas_pedrinhuol

  - id: cantada_dentista_boca_aberta
    situation: comentar sorriso bonito
    variants:
      - tone: comico
        text: |
          Nossa, teu sorriso é muito bonito. Você é dentista? — Não. — É que você me deixou de boca aberta.
        context_notes: "Setup pergunta inocente → punchline elogio. Padrão clássico Pedrinho."
    source_refs:
      - TUDO_PASSA_MENOS_A_VONTADE_DE_TE_PEGAR_cantadas_pedrinhuol

