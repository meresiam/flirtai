        text: |
          Quanto que tá esse ingresso? — Que ingresso? — Pra esse show de beleza que você tá dando.
        context_notes: "Funciona em ambiente público. Frame: ela como atração paga."
    source_refs:
      - O_FINAL_GRR_KK_cantadas_pedrinhuol
      - PAPO_DE_UNDAAIA_cantadas_pedrinhuol

  - id: cantada_costureira
