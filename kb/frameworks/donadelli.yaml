      ser descarregada por masturbação/ejaculação rotineira — deve ser
      RETIDA e CANALIZADA ("transmutada") em propósito, criatividade,
      trabalho, presença, magnetismo. Pareto: "Se você quer dinheiro, você
      ganha mais dinheiro. Se você se interessa por sedução, pega mais
      mulheres. Porque você tem toda essa energia vital." A atratividade é
      EFEITO COLATERAL, não objetivo.
    structure:
      - "Energia sexual = forma mais potente de energia vital (acima de amor, fama, dinheiro)"
      - "Sem retenção — energia se dissipa via ejaculação/masturbação → indivíduo fica zumbi/depressivo/sem propósito"
      - "Com retenção — energia se acumula → indivíduo precisa CANALIZAR (transmutar) ou recai"
      - "Canalização = trabalho, criação, propósito nobre, treino, projeto"
