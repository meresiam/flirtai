# ============================================================
# HEURISTICS — regras imperativas curtas
# ============================================================

heuristics:
  - id: "be_outer_directed"
    rule: "Mata o monólogo interno e foque 100% nela; seja esponja, não palco."
    rationale: "Atenção real é o luxo mais escasso. Quem oferece atenção plena ganha acesso emocional que rivais não têm."
    when:
      - "primeiro_encontro"
      - "ela_parece_distraída"
      - "voce_está_ansioso (cura ansiedade simultaneamente)"
    counter_example: "Quando você ainda não tem nada pra ouvir — primeira frase de cold approach exige você FALAR primeiro."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"

  - id: "create_polarity_via_absence"
    rule: "Quanto mais presente, menos desejado. Cultive escassez calibrada."
    rationale: "Recompensa variável vicia (mesma dinâmica de slot machine). Familiaridade satura. Sem espaço pra fantasia, não há desejo."
    when:
      - "match_demonstrou_interesse_inicial"
      - "relacionamento_esfriou_por_excesso_de_disponibilidade"
      - "ela_te_tratando_como_garantido"
    counter_example: "Se a presença é genuinamente escassa por geografia/agenda, FORÇAR mais ausência sinaliza desinteresse e ela some."
    source_refs:
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"

  - id: "judge_by_actions_not_words"
    rule: "Ignore o que ela DIZ; observe o que ela FAZ. Effective truth."
    rationale: "Palavras servem pra dar verniz moral. Ações revelam intenção. A pessoa que diz 'amo passar tempo com você' e cancela 3x não te ama; cancelou 3x."
    when:
      - "decifrar_intenção_real"
      - "detectar_frenemy"
      - "ler_se_ex_dela_está_realmente_fora"
    counter_example: "Em fases muito iniciais ela pode dizer pouco e agir pouco — não tem dados suficientes pra ler ainda."
    source_refs:
      - "raw/blog/the-power-breviary.md"

  - id: "vulnerability_not_insecurity"
    rule: "Mostre vulnerabilidade (ferida, abertura genuína); NUNCA insegurança (ansiedade auto-absorvida)."
    rationale: "Vulnerabilidade convida proteção, conexão, abre o outro. Insegurança espelha pra ela e a faz se sentir ansiosa — anti-sedutora. A diferença está no DIRECIONAMENTO: vulnerabilidade é aberta pro mundo; insegurança é ruminação interna."
    when:
      - "construir_intimidade"
      - "quebrar_frieza_dela"
      - "revelar_que_ela_te_afetou (deliberadamente)"
    counter_example: "Cold approach inicial: vulnerabilidade aí lê como fraqueza. Comece estável."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "never_moralize_in_seduction"
    rule: "Em terreno de prazer, NUNCA assuma superioridade moral. É veneno instantâneo."
    rationale: "Seduzir é construir cumplicidade transgressiva, não tribunal. Sermão mata o erotismo."
    when:
      - "ela_disse_algo_polêmico (resista a corrigir)"
      - "gostos_dela_diferem_dos_seus"
    counter_example: "Quando ela cruza uma linha ÉTICA séria sua (não estética), você precisa frear — mas reconheça que isso encerra a sedução."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"

  - id: "lean_into_what_makes_you_strange"
    rule: "O que te diferencia (esquisitice, manias, obsessões) é fonte de poder. Esconda e você vira commodity substituível."
    rationale: "Pessoas atraentes não são as 'normais'. Elon, Bowie, Jagger — todos abraçaram o estranho. Hoje o conformismo é o que mata desejo."
    when:
      - "perfil_de_app_genérico_demais"
      - "ele_está_imitando_outros_homens_pra_ser_aceito"
    counter_example: "Esquisitice ofensiva ou que cruza códigos sociais básicos (higiene, respeito) não é poder, é auto-sabotagem."
    source_refs:
      - "transcripts/How_to_Turn_Anxiety_into_Seductive_Charm_Robert_Greene.txt"
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"

  - id: "be_generous_with_spirit"
    rule: "Generosidade de atenção/tempo/energia é sedução de alto retorno. Avareza (mesmo monetária pequena) sinaliza tightness interna."
    rationale: "Spirit generosity é raro. Tightness lê como egoísmo e desinteresse. Cupom 2-por-1 no primeiro encontro virou case clássico de anti-sedução de Greene."
    when:
      - "primeiros_encontros"
      - "presente/gesto_que_personaliza"
      - "tempo_que_você_dedica_(não_é_'rápido')"
    counter_example: "Generosidade desesperada (gastos absurdos pra impressionar) lê como compra, vira anti-sedução também."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Modern_World_Is_In_Chaos_-_Win_The_Game_Of_Life_Outsmart_Everybody_Else_Robert_Greene.txt"

  - id: "confidence_must_be_based_on_real_skill"
    rule: "Confiança fake é detectada em segundos. Construa skill REAL primeiro; a confiança brota dela."
    rationale: "Mulheres têm 'sexto sentido' pra insegurança disfarçada. Bravado é micro-expressão traída. A única confiança que passa filtro é a baseada em ação concreta que você pode entregar."
    when:
      - "usuário_quer_'truque_de_confiança'_rápido"
      - "ele_está_em_modo_LARP_de_alpha"
    counter_example: "Em momento de palco breve (entrevista, abordagem), fingir até criar pode ajudar — mas sustentável só com skill real."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Modern_World_Is_In_Chaos_-_Win_The_Game_Of_Life_Outsmart_Everybody_Else_Robert_Greene.txt"

  - id: "mood_infects_more_than_words"
    rule: "Sua energia/mood/relaxamento corporal seduz MAIS que qualquer linha. Trabalhe o estado, não o roteiro."
    rationale: "Errol Flynn — não eram falas, era o animal relaxado. As pessoas se aproximam física e emocionalmente de quem irradia calma e segurança."
    when:
      - "antes_de_qualquer_approach"
      - "antes_de_responder_quando_emoção_alta"
    counter_example: "Quando o canal é só texto e ela nunca viu sua presença — aí a copy importa muito mais que o mood."
    source_refs:
      - "transcripts/The_KEY_TO_POWER_Lies_In_Mastering_These_LAWS_Robert_Greene_Lewis_Howes.txt"
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"

  - id: "never_chase_in_panic"
    rule: "Quando ela some/esfria, NUNCA mande a sequência de mensagens implorando. Sua próxima jogada é silêncio + vida própria."
    rationale: "Mensagem de pânico confirma seu baixo valor e mata o resto da fantasia que ela ainda tinha. Silêncio cria espaço pra ela sentir sua ausência (lei 16)."
    when:
      - "ela_não_respondeu_em_2-3_dias"
      - "encontro_marcado_foi_cancelado"
      - "vc_sente_urgência_de_'resolver'"
    counter_example: "Se você sabe que ela tá em crise real (família, saúde) o silêncio lê como frieza — vire warmth controlada."
    source_refs:
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"

  - id: "read_what_they_deny_strongest"
    rule: "O que a pessoa denuncia/critica com mais força é o que ela mais deseja secretamente."
    rationale: "Shadow theory: a intensidade da negação revela a intensidade da atração reprimida. Útil pra entender resistências do alvo."
    when:
      - "ela_disse_'eu_nunca_faria_X'"
      - "ela_critica_um_tipo_específico_de_homem"
      - "ela_julga_outra_mulher_específica"
    counter_example: "Algumas críticas são genuínas, não shadow. Só interprete como shadow quando o tom é desproporcional."
    source_refs:
      - "raw/blog/the-dark-side.md"
      - "raw/blog/in-praise-of-the-bad-guy.md"

  - id: "fortune_favors_the_bold"
    rule: "Quando em dúvida entre tímido e ousado, escolha ousado. Mensagem mais direta, convite mais audaz, beijo no momento exato."
    rationale: "Fortune is a woman — recompensa quem age. Timidez perde por padrão. A audácia tem benefício mesmo quando 'falha': aparece, ganha atenção, ela conta a amiga."
    when:
      - "momento_de_DTR_ou_proposta"
      - "ela_demonstrou_interesse_e_você_está_'esperando_o_momento_perfeito'"
      - "negociação_de_dinâmica"
    counter_example: "Ousadia ≠ idiotia. Não invada espaço físico de quem deu sinal claro de 'não'."
    source_refs:
      - "raw/blog/machiavelli-for-our-times.md"

# ============================================================
# TECHNIQUES — manobras táticas com script
# ============================================================

techniques:
  - id: "the_disinterest_calibrated"
    name: "Desinteresse Calibrado (Coquette pattern)"
    description: "Sopra quente e frio em ciclos. Demonstra interesse evidente, recua quando o alvo avança, volta a aquecer quando o alvo se retrai. Cria a oscilação 'ele/ela me quer? não me quer?' que vicia o sistema dopaminérgico."
    script_examples:
      - "QUENTE: 'Não consigo parar de pensar no jeito que você riu ontem.'"
      - "FRIO (24-48h depois): respostas curtas, demora 6h pra responder, sem flerte."
      - "QUENTE de novo: 'Estraguei a noite. Tinha que estar te beijando.'"
      - "Padrão visual: 3 mensagens longas e calorosas → 2 dias quase silêncio → 1 mensagem inesperada e específica → silêncio breve → encontro."
    when:
      - "fase_de_construção_de_desejo (pré-encontro confirmado)"
      - "match_morno_que_precisa_de_centelha"
      - "ela_está_te_tomando_como_garantido"
    risk: "Aplicado mal vira passive-aggressive ou ghosting. Se ela é muito ansiosa-evitativa, o frio empurra ela embora. Se você nunca fecha o ciclo no quente, ela desiste."
    mastery_signal: "Ela começa a iniciar a conversa, a perguntar 'sumiu?', a propor encontros. Você inverteu a polaridade de quem corre atrás."
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "the_angle_approach"
    name: "Abordagem em Ângulo (teste de micro-expressão)"
    description: "Pra testar se alguém é frenemy ou genuíno: ao invés de chegar direto pelo campo de visão, aproxime pelo lado. A pessoa não tem tempo de montar o sorriso falso, e por <1 segundo o rosto trai o sentimento real (desdém, irritação, alegria genuína)."
    script_examples:
      - "Físico: chegue numa festa pelo flanco dela em vez de frontal."
      - "Conversacional equivalente: introduza tópico sensível por via lateral ('uma amiga sua falou que...') ao invés de direto."
    when:
      - "testar_se_amizade_é_genuína_(antes_de_investir)"
      - "detectar_se_alguém_do_círculo_dela_te_aprova_ou_não"
      - "testar_se_o_'ex_acabado'_está_realmente_acabado"
    risk: "Se ela percebe que você tá testando, vira creep. Não falar sobre, só observar."
    mastery_signal: "Você passa a antecipar com precisão quem vai te apoiar/sabotar antes que façam."
    source_refs:
      - "transcripts/The_Manipulation_Expert_-_You_re_Being_Manipulated_Use_Jealousy_To_Manipulate_People_Robert_Greene.txt"

  - id: "the_personalized_callback_gift"
    name: "Presente/Callback Personalizado"
    description: "Captura um detalhe pequeno que ela mencionou en passant (música que adorava na infância, livro que tava lendo, comida do interior dela) e devolve dias depois como gesto/presente/mensagem específica. Devastador porque PROVA atenção real."
    script_examples:
      - "Ela: 'Meu pai me ensinou a fazer brigadeiro de colher e eu não como faz tempo.' → 3 dias depois: 'Achei essa marca de chocolate belga, tava pensando se ia funcionar pra brigadeiro de colher de pai.'"
      - "Ela: 'Sempre quis ver o pôr-do-sol da Pedra do Sal mas nunca fui.' → próximo encontro proposto: 'Sexta, 17h, Pedra do Sal. Já checado o horário do sol.'"
    when:
      - "depois_do_primeiro_ou_segundo_encontro"
      - "fase_de_construção_de_intimidade"
      - "ela_está_em_meio_a_outras_opções_e_você_quer_se_destacar"
    risk: "Se for cedo demais, vira stalker. Se for genérico, perde tudo. Se for caro demais, vira tentativa de compra."
    mastery_signal: "Ela diz 'caralho, ninguém nunca prestou atenção assim em mim'. Defesa cai."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "controlled_vulnerability_drop"
    name: "Drop de Vulnerabilidade Controlada"
    description: "No momento certo, revele uma ferida real (não uma falsa, não uma cosmética). Confessar que você caiu sob feitiço dela é, segundo Greene, das coisas mais sedutoras que existe — porque elas amam saber que afetam. Mas só funciona DEPOIS de você ter estabelecido base de força."
    script_examples:
      - "'Tô meio em pânico porque você ocupa muito mais espaço na minha cabeça do que eu planejava. E eu sou ruim com isso.'"
      - "'Tive que parar o que tava fazendo no trabalho porque lembrei do que você disse ontem. Tá me desconcentrando.'"
      - "'Tem coisa em mim que poucas pessoas viram. Acho que com você quero tentar.'"
    when:
      - "depois_da_2ª-4ª_interação_significativa"
      - "ela_está_meio_distante_e_você_quer_quebrar_muro"
      - "ela_já_confiou_em_você_com_algo_dela"
    risk: "Cedo demais = lê como insegurança e mata atração. Repetido demais = perde valor e vira drama. Falso = ela sente e o jogo acaba."
    mastery_signal: "Ela responde com vulnerabilidade equivalente (sintonia recíproca) ou age fisicamente (toque, aproximação)."
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "play_the_blank_screen"
    name: "Tela em Branco (Star pattern)"
    description: "Fale pouco, dê pouca informação demográfica/política/biográfica concreta. Deixe espaços vazios pra ela projetar suas próprias fantasias em você. Quietude > ruído. Ambiguidade controlada > clareza eufórica."
    script_examples:
      - "Quando ela perguntar 'o que você faz?' — resposta lacônica + redirecionar pra ela ('faço umas coisas com tecnologia. Mas conta — o que você ESTÁ EVITANDO fazer hoje?')"
      - "Não declarar opiniões fortes sobre política/comida/música cedo — deixar mistério, ela vai te encaixar em fantasia favorável."
      - "Em foto de perfil: enigmática, não obviamente explicativa."
    when:
      - "início_de_jornada (cold-message, primeiro_encontro)"
      - "ela_é_muito_inquisitiva_e_você_está_revelando_demais"
    risk: "Aplicado demais vira frio/snob/inacessível. Tem que ter momentos calorosos pra contrastar. E ATENÇÃO: não funciona se você quer relacionamento sério eventualmente — em algum momento tem que parar."
    mastery_signal: "Ela começa a te perguntar sobre você (curiosidade pull), inventa teorias, brinca 'quem é você na verdade?'"
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "friend_to_lover_reversal"
    name: "Reversão Amigo→Amante"
    description: "Quando ela te coloca na zona de amigo (deliberadamente ou não), Greene diz pra ACEITAR a categoria e usá-la como disfarce. Você fica próximo, observa profundo, espera o momento de virar (geralmente quando vulnerabilidade dela aparece). 'Eu escolho ser amigo dela e lentamente reverter a percepção.'"
    script_examples:
      - "Aceitar 'só amigos' sem protesto. Não cobrar."
      - "Estar presente em momentos vulneráveis (separação dela, crise no trabalho)."
      - "Em algum momento, uma noite, uma única quebra controlada: ('preciso te dizer uma coisa. Não vou esperar a hora perfeita porque ela não existe. Tô apaixonado por você há meses. Não preciso de resposta agora.') + sair de cena."
    when:
      - "ela_já_te_disse_'não_quero_nada_agora'_mas_química_existe"
      - "ela_tá_em_relacionamento_em_decadência"
      - "você_pode_esperar_e_observar_(prazo_longo)"
    risk: "Pode te custar meses-anos. Pode nunca virar. Pode reforçar friend-zone permanente se você nunca der o quebra. Greene mesmo admite que requer paciência (cojones para sair se for tarde demais)."
    mastery_signal: "Ela começa a procurar contato físico desnecessário, a abrir vulnerabilidade que não compartilhava antes, a 'testar' o que sua reação seria a flerte."
    source_refs:
      - "raw/blog/seduction-scenario-1-follow-up.md"

  - id: "death_ground_in_negotiation"
    name: "Death Ground Aplicado a DTR"
    description: "Em conversa de definir relação ou condições, entre disposto a perder. Ter plan B mata sua firmeza — ela sente. Se você decidiu que aceita o cenário 'ela diz não e eu saio', sua presença vira pesada de verdade."
    script_examples:
      - "'Eu quero exclusividade. Se não é o que você quer, é ok, mas a gente para por aqui. Não é ultimatum, é o que eu preciso pra continuar.' + de fato estar disposto a ir embora."
      - "Antes da conversa, internamente: 'minha vida fica completa se isso acabar hoje. Eu prefiro continuar mas não preciso.'"
    when:
      - "DTR_(define_the_relationship)"
      - "ela_te_trata_como_opção_secundária_há_meses"
      - "negociação_de_fim_de_relacionamento_ruim"
    risk: "Bluff descoberto destrói reputação dela com você pra sempre. Não use death ground se você não está realmente pronto pra perder."
    mastery_signal: "Ela cede com sinceridade OU você sai limpo e sem dúvida. Em ambos casos venceu."
    source_refs:
      - "raw/blog/the-50th-law.md"
      - "raw/blog/machiavelli-for-our-times.md"

  - id: "transgression_as_intimacy_signal"
    name: "Transgressão Calibrada"
    description: "Greene: 'sem feeling de transgressão não existe sedução'. Inserir, no momento certo, comentário/proposta/ação que cruza levemente a linha do convencional sinaliza intimidade exclusiva — 'isso é coisa nossa, ninguém mais sabe.'"
    script_examples:
      - "Brincadeira sexual sussurrada em ambiente formal."
      - "Saída espontânea do roteiro: 'vamos embora agora? Não tô a fim de mais ninguém hoje.'"
      - "Compartilhar segredo seu pra criar troca: 'vou te contar uma coisa que eu nunca contei pra ninguém da vida.'"
    when:
      - "ela_já_demonstrou_atração_(mas_segue_protocolar)"
      - "ambiente_socialmente_rígido_(precisa_de_quebra)"
      - "construção_de_'só_nós_dois'"
    risk: "Calibrar mal = invasivo, ofensivo, criep. Tem que ler bem o terreno. Se você é ainda estranho pra ela, transgressão lê como ameaça."
    mastery_signal: "Ela retorna a transgressão (escala junto) ou cria gestos próprios de cumplicidade."
    source_refs:
      - "raw/blog/the-dark-side.md"
      - "raw/blog/seduction-scenario-1-follow-up.md"

  - id: "play_indirect_long_game"
    name: "Jogo Indireto (Plantar Sementes)"
    description: "Pra alvos com defesas altas (em relacionamento, em luto, em fase de 'não quero nada'), o approach frontal queima. Greene recomenda: aparecer indiretamente, plantar pistas, deixar ela ouvir falar de você por terceiros, criar a impressão antes de criar a interação."
    script_examples:
      - "Saber por amiga em comum o que ela tá lendo → comentar sobre o mesmo livro num post → ela vê → curiosidade."
      - "Festa onde você está mas NÃO faz move nela → ela nota a anomalia (todos os homens fazem) → você vira interessante."
      - "Conversa breve no flagra do dog/supermercado, sem pedir contato, sem flerte explícito — só humanidade casual. Repete. Repete. Aí pede."
    when:
      - "alvo_em_relacionamento (você espera oportunidade ética)"
      - "alvo_com_defesas_explícitas_('não_quero_nada')"
      - "alvo_que_você_admira_e_quer_jogo_longo_em_vez_de_aposta_alta_curta"
    risk: "Pode ser confundido com inação. Greene avisa: indireto ≠ passivo. Você está estrategicamente posicionando, mas tem que ATACAR no momento certo."
    mastery_signal: "Ela é quem chega a perguntar de você, propõe encontro, vira agente ativo."
    source_refs:
      - "raw/blog/seduction-scenario-1-follow-up.md"
      - "raw/blog/seduction-scenario-1.md"

  - id: "use_jealousy_triangle"
    name: "Use o Triângulo (terceiros)"
    description: "Não significa 'fazer ciúme barato' (que é anti-sedutor). Significa: fazer com que ela perceba que OUTRAS pessoas te valorizam, te procuram, te elogiam. Validação social externa quebra resistência interna dela. Greene: pessoas querem o que outras pessoas querem (efeito viral)."
    script_examples:
      - "Foto/menção orgânica de evento em que você foi destaque (não posando)."
      - "Comentário casual: 'Ana me chamou pra esse evento, mas tô meio enrolado'. (Ana = real, existente, não invenção)"
      - "Em encontro: outra mulher cumprimenta você de modo caloroso ao passar. Você não comenta, não explica."
    when:
      - "ela_te_tomou_como_garantido"
      - "ela_é_'pick-me'_ou_competitiva_(efeito_amplifica)"
      - "early-stage_pra_demonstrar_social_proof"
    risk: "Ciúme inventado = mentira detectável + perda total de confiança. Ciúme óbvio demais = manipulação cafona. Tem que ser orgânico."
    mastery_signal: "Ela aumenta investimento (mais mensagem, mais iniciativa) ou pergunta sobre a outra (sinal vermelho de interesse)."
    source_refs:
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"
      - "transcripts/The_Manipulation_Expert_-_You_re_Being_Manipulated_Use_Jealousy_To_Manipulate_People_Robert_Greene.txt"

  - id: "reverse_psychology_for_resistant"
    name: "Psicologia Reversa (alvo resistente)"
    description: "Alguns alvos (perfil teimoso, contrário, defensivo) reagem AO CONTRÁRIO de quando você sugere algo. Em vez de pedir/sugerir, descreva como difícil/inacessível/impossível pra ela — ela vai querer provar que pode."
    script_examples:
      - "'Você não ia gostar do tipo de lugar que eu vou hoje. Muito intenso.' → ela quer ir."
      - "'Não te chamei porque achei que você não curtia esse tipo de coisa.' → ela cobra: 'mas eu adoro, por que você assumiu isso?'"
      - "'A maioria das pessoas não conseguiria fazer X.' → ela: 'eu consigo, me passa.'"
    when:
      - "alvo_é_rebelde/contrarian"
      - "alvo_diz_não_a_tudo_que_é_proposto_frontalmente"
      - "ela_resiste_a_marcar_encontro"
    risk: "Aplicado em alvo já interessado vira frio gratuito. Aplicado mal soa manipulador detectável. Não é pra usar todo dia."
    mastery_signal: "Ela 'ganha' a aposta interna dela e cobra entrega do que você 'duvidou'."
    source_refs:
      - "transcripts/The_KEY_TO_POWER_Lies_In_Mastering_These_LAWS_Robert_Greene_Lewis_Howes.txt"

  - id: "voice_calibration"
    name: "Calibração de Voz (slow + low)"
    description: "Greene: 'voz é o que ator não consegue fingir'. Voz rápida = ansioso, fraco. Voz lenta + tom mais grave + pausas = confiança. Trabalhar voz é maior alavanca que qualquer pickup line."
    script_examples:
      - "Antes de chamar/encontrar: respiração 4-7-8 pra abaixar diafragma."
      - "Treino: ler em voz alta 10 min/dia mais lento que natural."
      - "Em situação tensa: pausa de 2 segundos antes de responder. A pausa em si é status."
    when:
      - "qualquer_interação_face_a_face_ou_voz"
      - "primeira_ligação"
      - "abordagem_em_lugar_público"
    risk: "Falsamente lento vira teatral/forçado. Tem que treinar até ser natural."
    mastery_signal: "Pessoas começam a se inclinar pra te ouvir; você fala menos e elas escutam mais."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"

