frameworks:
  - id: "nine_seducer_archetypes"
    name: "9 Arquétipos do Sedutor"
    description: "Tipologia central de The Art of Seduction. Cada pessoa já tem UM tipo dominante por natureza/biografia. O trabalho é identificá-lo, exagerá-lo conscientemente e nunca tentar copiar um arquétipo que não é seu — vira teatro vazio."
    structure:
      - "Siren (Sirena) — energia sexual saturada em cada gesto/voz/movimento, sem precisar verbalizar. Ícones: Cleópatra, Marilyn Monroe."
      - "Rake (Devasso) — homem obcecado por mulheres, entende-as profundamente, dá tudo de si na fase inicial mas precisa de novas conquistas. Ícone: Errol Flynn, Lord Byron, Casanova, Clinton."
      - "Ideal Lover (Amante Ideal) — adapta-se ao fantasma íntimo do outro; reflete de volta o que a pessoa secretamente quer ser. Vive do entendimento profundo do alvo."
      - "Dandy — anda na borda andrógina; homem com leve borda feminina (Bowie, Jagger) ou mulher com leve borda masculina (Dietrich, Madonna). Quebra expectativa de gênero sem deixar de seduzir."
      - "Natural — preservou o impish/espontâneo da criança; parece nunca estar tentando. Ícones: Charlie Chaplin, Josephine Baker."
      - "Coquette — sopra quente e frio em ciclos. Demonstra interesse, recua quando o alvo avança, volta a atrair quando o alvo perde fé. 'Hard to get' alternado com lampejos de 'easy'."
      - "Charmer — sedução social não-sexual; encanta lendo o outro e devolvendo atenção total e útil."
      - "Star — aparência de tela em branco onde o outro projeta suas fantasias. Pouca fala, presença quieta, ambiguidade calculada. Ícone: Montgomery Clift, JFK."
      - "Charismatic — mistura de causa + voz + olhar que parece vir de algo maior. Ícones: Malcolm X, JFK."
    when_to_use:
      - "Diagnóstico inicial do estilo natural do usuário (não copiar Rake se ele é Charmer)"
      - "Mapear o tipo do alvo pra escolher contra-estratégia"
      - "Misturar: cada pessoa tem 1 dominante + 1 secundário"
      - "Trocar de modo dentro da mesma interação (autêntico-Natural pra abrir, Star-blank pra mistério na metade)"
    examples:
      - "Marilyn Monroe (Siren): 'fazia amor com a câmera' porque era órfã e precisava do olhar de todos — a carência virou hardware sedutor."
      - "Errol Flynn (Rake): conta-se que dormiu com ~3000 mulheres em 50 anos. Segredo: animal relaxado, não-defensivo. 'Sentar perto dele era como ter bebido dois martinis.'"
      - "JFK (Star): modelado em Montgomery Clift — silêncio + olhar permitindo projeção."
      - "Josephine Baker (Natural): mantinha o mundo de fantasia infantil enquanto dançava — autenticidade percebida vence técnica."
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/Robert_Greene_on_Power_Seduction_War_and_Human_Nature.txt"
      - "raw/blog/thoughts-on-seduction.md"

  - id: "cold_vs_warm_seducer"
    name: "Sedutor Frio vs Sedutor Quente"
    description: "Distinção ética/estratégica de Greene. O sedutor frio é dominador, instrumental, descartável — modelo cortesã clássica ou pickup-artist. O sedutor quente é bidirecional, joga o ritual de cortejo onde AMBOS estão seduzindo um ao outro. O ideal de Greene é o warm."
    structure:
      - "Cold: 'tirar' algo do alvo (sexo, dinheiro, validação). Mecânico, frio, descartável."
      - "Warm: criar campo de prazer mútuo onde o jogo é o produto. Reconhece humanidade do alvo."
    when_to_use:
      - "Toda vez que o usuário pedir script pra 'pegar' ou 'manipular' — testar se ele tá em modo cold (perigoso e ineficaz a longo prazo) ou warm"
      - "Pickup artist tracks normalmente são cold abortions na visão dele"
    examples:
      - "Pickup gimmicks que Greene chama de 'seductive abortions' = cold."
      - "Errol Flynn dando-se completamente nas primeiras semanas = warm, mesmo em série."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "raw/blog/thoughts-on-seduction.md"

  - id: "anti_seducer_profile"
    name: "Perfil do Anti-Sedutor"
    description: "O conjunto de traços que MATAM atração antes de começar. Greene tem capítulo inteiro disso em Art of Seduction."
    structure:
      - "Preaching/moralizing — assumir superioridade moral num campo que deveria ser de prazer"
      - "Stinginess (avareza de espírito, não só dinheiro) — cupom de desconto no primeiro encontro, ler como tightness interna"
      - "Inner-directedness — só pensar 'será que ele/ela gosta de mim?', 'tô bem vestido?'"
      - "Insecurity (≠ vulnerability) — auto-absorção ansiosa que infecta o outro"
      - "Pecking (cutucar/leaning-in no bar gritando no ouvido) — sinal de baixo status"
      - "Bravado (confiança falsa) — micro-expressões traem"
      - "Defensividade / muros — não permitir ser influenciado é não permitir química"
      - "Falta de esforço — não se arrumar, não pensar no programa, sinaliza 'você não vale o trabalho'"
    when_to_use:
      - "Diagnóstico — checar se o usuário tá emitindo um desses antes de mandar script"
      - "Edição de mensagem — varrer texto procurando sermão/justificativa/avareza"
    examples:
      - "Mulher reclama do primeiro date: 'ele usou cupom 2-por-1'. Greene chama isso de 'stinginess of spirit', anti-sedutor."
      - "Homem que fica fazendo 'pecking' (leaning in pra gritar no ouvido) sinaliza desespero e baixo valor."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"

  - id: "absence_presence_dynamic"
    name: "Lei da Ausência e Presença"
    description: "Lei 16 dos 48 Laws of Power. Recompensa variável: quem está sempre disponível vira commodity desvalorizada; quem ausenta calculadamente vira evento. Greene aplica diretamente a texting/dating moderno."
    structure:
      - "Excesso de presença → familiarização → desvalorização → 'tomado como certo'"
      - "Ausência calculada → fantasia → escassez percebida → status sobe"
      - "Frequência ótima é específica por contexto: não muito (sumiço, esquecimento) nem pouco (saturação)"
      - "Neurobiologicamente é o mesmo loop de variable reward de cassino/social media"
    when_to_use:
      - "Pós-primeiro encontro: timing de quando texto"
      - "Mid-relacionamento que esfriou: re-introduzir mistério via ausência breve"
      - "Match que ficou morno: silêncio calculado pode reverter"
    examples:
      - "Greene literal: 'se você manda texto na noite mesma do date, ela vai pensar — algo tá meio desesperado. Se você manda no dia seguinte, ainda meio cedo. Se você espera 2 dias (não 3), ela começa a pensar em você — talvez ele não gostou? Talvez sim? Não sei.'"
      - "Marilyn Monroe vs Cleópatra: ausência intermitente foi central pro mito de ambas."
    source_refs:
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"

  - id: "effective_truth"
    name: "Effective Truth (Machiavelli/Greene)"
    description: "Princípio diagnóstico: nunca julgue pelo que a pessoa DIZ; julgue pelo resultado das ações dela. Palavras servem pra dar verniz moral. O efeito real revela a intenção real."
    structure:
      - "Coletar AÇÕES e CONSEQUÊNCIAS, não declarações"
      - "Desconfiar especialmente quando há excesso de moralização ou autopromoção"
      - "A vida é um jogo — observe as JOGADAS dos outros jogadores"
    when_to_use:
      - "Decifrar se o match/match potencial é genuíno ou jogando game contrário"
      - "Detectar frenemy (ela diz 'amo você' mas as ações sabotam)"
      - "Ler se o ex dela realmente acabou ou ainda tem influência"
    examples:
      - "Em Hollywood: gente que faz discurso liberal e age como tirano. A ação revela; o discurso distrai."
      - "Frenemy: declara amizade mas faz comentários que abaixam — actions reveal."
    source_refs:
      - "raw/blog/the-power-breviary.md"
      - "transcripts/The_Manipulation_Expert_-_You_re_Being_Manipulated_Use_Jealousy_To_Manipulate_People_Robert_Greene.txt"

  - id: "shadow_theory"
    name: "Teoria do Shadow / Lado Sombrio"
    description: "Toda pessoa tem dois lados: o front-side iluminado que mostra ao social, e o back-side reprimido (carências, agressão, desejos transgressivos, sexualidade real). Quanto mais alguém esconde, mais força tem o shadow — e mais ele vaza em micro-comportamentos, gostos musicais, comentários ditos bêbados, body language."
    structure:
      - "Front-side: o que a pessoa quer mostrar (santo, ético, produtivo, em controle)"
      - "Shadow: o oposto exato — geralmente o que ela mais critica em outros"
      - "Sinais de leakage: tom de voz quando bebe, gostos musicais 'culposos', body language traindo a fala, intensidade da denúncia (= intensidade da atração reprimida)"
      - "Para sedução: o terreno mais fértil é o transgressivo, o tabu pessoal — onde o shadow quer respirar"
    when_to_use:
      - "Ler match: o que ela mais critica/julga é onde a curiosidade dela mora"
      - "Construir tensão: oferecer permissão simbólica pra ela acessar o que reprime"
      - "Decifrar mensagens defensivas: 'não sou esse tipo de garota' frequentemente significa 'sou exatamente esse tipo mas preciso de cobertura'"
    examples:
      - "Pessoa muito politicamente correta que dirige Prius — 'tem desejo poderoso de fazer o oposto, soltar, viver caos'."
      - "Pessoa que prega contra homossexualidade — clássico shadow vazando."
      - "'A força da denúncia é igual à força da atração' (in-praise-of-the-bad-guy)."
    source_refs:
      - "raw/blog/the-dark-side.md"
      - "raw/blog/in-praise-of-the-bad-guy.md"
      - "transcripts/The_Manipulation_Expert_-_You_re_Being_Manipulated_Use_Jealousy_To_Manipulate_People_Robert_Greene.txt"

  - id: "outer_directed_attention"
    name: "Atenção Outer-Directed"
    description: "O coração da sedução pra Greene. Inverter o reflexo natural (pensar em si mesmo: 'ela tá gostando? estou bem?') e investir 100% da atenção no outro — entrar no espírito dela, absorver detalhes, devolver dias depois algo personalizado. Outer-directed = você como esponja/sponge dentro do mundo psicológico dela."
    structure:
      - "Desligar o monólogo interno"
      - "Escutar com foco predatório por nuances: o que ela ama, o que falta, vulnerabilidades, traumas pequenos, gostos esquecidos"
      - "Memorizar e re-mobilizar — devolver dias depois com presente/comentário que prove 'eu prestei atenção fundo'"
      - "Esse é o luxo escasso no mundo moderno: praticamente ninguém faz isso"
    when_to_use:
      - "Sempre. Default mode em qualquer interação"
      - "Especialmente útil quando o usuário tem ansiedade — joga a atenção pra fora cura ansiedade E seduz simultaneamente"
    examples:
      - "Greene: 'a gente nunca recebe atenção real. Se você der esse sentimento, é incrivelmente poderoso porque todos querem validação.'"
      - "Errol Flynn: foco animal no momento e na mulher diante dele."
      - "Presente personalizado baseado em comentário en passant — devastador."
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"
      - "transcripts/Robert_Greene_on_Power_Seduction_War_and_Human_Nature.txt"

  - id: "fifty_law_fearlessness"
    name: "50ª Lei — Fearlessness"
    description: "A meta-lei abaixo das 48. Sem ausência de medo, todas as outras leis se aplicam tortas. Humanos lêem PRÉ-VERBALMENTE o nível de medo do outro (tom de voz, micro-postura, olhar). Quem tem menos medo é seguido OU evitado; quem tem mais é desprezado inconscientemente."
    structure:
      - "Death Ground: queimar a saída de escape pra obrigar-se a render 100%"
      - "Plano B é sabotador — pesquisa mostra que oferecer alternativa reduz performance"
      - "Adversidade vira normal — você joga relaxado num cenário que aterroriza outros"
      - "Confiança contagia; insegurança contagia — vc escolhe qual emite"
    when_to_use:
      - "Negociações (incluindo de dinâmica relacional)"
      - "Approach de cold no qual rejeição é possibilidade real"
      - "Sair de relacionamento ruim — ter que ser 'death ground', sem porta de volta"
    examples:
      - "Greene em negociação de livro: 'meu preço mínimo é 100k. Me oferecem 80, recuso, mesmo correndo risco de 0. Eles SENTEM essa firmeza e geralmente aceitam.'"
      - "50 Cent: depois de levar 9 tiros em 2000, o medo evaporou. Daí o calm que intimida."
      - "Estudo do snack: dois grupos resolvem puzzle pelo lanche; o grupo que sabe que tem lanche no vending machine performa pior."
    source_refs:
      - "raw/blog/the-50th-law.md"
      - "transcripts/The_Manipulation_Expert_-_You_re_Being_Manipulated_Use_Jealousy_To_Manipulate_People_Robert_Greene.txt"

  - id: "masculine_virtues_redefined"
    name: "Virtudes Masculinas Redefinidas"
    description: "Greene rejeita tanto Andrew Tate (toxic masculinity = boasting/bullying = sinal de FRAQUEZA) quanto o homem 'wimpy' (que tem vergonha de testosterona, ambição, assertividade). O caminho do meio: agressão CANALIZADA, ambição DISCIPLINADA, força sem precisar gritar."
    structure:
      - "Auto-controle (não falar à toa, dominar paixões)"
      - "Não precisar diminuir mulher pra se sentir homem (sinal de SEGURANÇA)"
