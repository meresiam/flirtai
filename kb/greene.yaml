      - tone: "autentico"
        text: "Eu não sou bom em mensagem de app. Então não vou tentar ser engraçado. Tua bio me pegou no [DETALHE ESPECÍFICO]. Te chamo pra um café qualquer dia dessa semana?"
        context_notes: "Vulnerability + direto. Funciona quando perfil dela já indicou que ela cansou de mensagem-roteiro. Risco: lê como básico se o detalhe é genérico."
      - tone: "comico"
        text: "Tô assumindo que se a gente combina aqui é porque o algoritmo do app finalmente parou de me sabotar. Antes de eu perceber que era erro de sistema — terça que vem, drink, ou eu já volto pro meu plano original de morrer só?"
