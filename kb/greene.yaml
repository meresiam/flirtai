      - tone: "direto"
        text: "Você é interessante demais pra eu fingir de morto aqui. [DIA], 20h, [LUGAR ESPECÍFICO]. Topa?"
        context_notes: "Death_ground aplicado. Confiança que não pede permissão. Funciona se foto/bio dela sugere que ela detesta enrolação."
