case_studies:
  - id: "errol_flynn_relaxed_animal"
    title: "Errol Flynn — O Animal Relaxado"
    narrative: "Astro de Hollywood dos anos 30-40, contam que dormiu com ~3000 mulheres e morreu aos 51 (alcoolismo). Greene tentou decifrar matematicamente o segredo. Uma mulher que escreveu sobre ele disse que sentar perto dele era 'como ter bebido dois martinis sem ter bebido nada'. O segredo não era beleza nem fama — era um RELAXAMENTO ANIMAL totalmente não-defensivo, presença pura. Greene presenciou algo análogo em 50 Cent: 'um amigo dele numa rua descobriu que ele tava com várias outras. Veio gritando. Ele respondeu com tamanha calma e abertura que ela acabou desarmando.' É o sedutor que NÃO se defende — porque não precisa."
    lessons:
      - "Confiança não-defensiva > qualquer linha"
      - "Energia/mood importa mais que copy"
      - "Relaxamento corporal real (não performado) é contagioso"
      - "Mesmo sendo pego em flagrante, abertura calma desativa o ataque"
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"
      - "transcripts/The_KEY_TO_POWER_Lies_In_Mastering_These_LAWS_Robert_Greene_Lewis_Howes.txt"
      - "raw/blog/thoughts-on-seduction.md"

  - id: "marilyn_monroe_camera_love"
    title: "Marilyn Monroe — Fazendo Amor com a Câmera"
    narrative: "Órfã, criada em orfanato, vida inteira foi 'preciso que TODOS me amem'. Aos 16 percebeu que com uma blusa apertada parava o trânsito masculino. Aprendeu a olhar pra câmera de um modo que ninguém tinha feito antes — como se fizesse amor com ela. Essa carência primária dela, ao invés de virar fraqueza, virou COMBUSTÍVEL — ela DESEJAVA tanto ser desejada que isso radiava. Cleópatra opera em mesma lógica."
    lessons:
      - "Necessidade real (não fingida) é hardware sedutor"
      - "Carências primárias canalizadas viram poder"
      - "O olhar dela DIRECIONADO E INTENCIONAL era a técnica — não só ser bonita"
      - "Siren = saturação de energia sexual em cada gesto"
    source_refs:
      - "transcripts/Robert_Greene_-_How_To_Seduce_Anyone_Build_Confidence_Become_Powerful_E232.txt"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "jfk_blank_screen"
    title: "JFK — Tela em Branco Modelada em Montgomery Clift"
    narrative: "Kennedy era obcecado por cinema clássico, em especial Montgomery Clift — ator com presença silenciosa, olhar que parecia esconder algo. JFK modelou sua persona pública na mesma quietude máscula. Resultado: pessoas projetavam fantasia. Esconderam a verdade de que ele tinha dor crônica nas costas, várias doenças, era frágil fisicamente. A tela em branco permitiu uma das maiores ondas de carisma político do século 20."
    lessons:
      - "Pouca informação concreta = mais espaço pra fantasia favorável"
      - "Quietude tem mais peso que verborragia"
      - "Pode-se esconder fraqueza física via presença emocional gerenciada"
      - "Star pattern: deixe o outro pintar quem você é"
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "louis_xiv_nicolas_fouquet"
    title: "Louis XIV e Fouquet — Lei 1 Em Carne"
    narrative: "Nicolas Fouquet, ministro das finanças de Louis XIV, joga festa lavish em honra do rei pra se cacifar como próximo primeiro-ministro. Festa foi tão magnífica que 'as pessoas escreviam sobre ela anos depois'. Resultado: Louis se sentiu OUTSHINED. Dia seguinte, Fouquet preso, passa resto da vida na prisão. Greene aplica diretamente: ego do superior é maior que resultado entregue. Em sedução: não tente outshinar quem você quer encantar — em vez de admirar você, ela vai sentir ameaça."
    lessons:
      - "Quem está acima de você tem MAIS insegurança, não menos"
      - "Outshining ativa reação destrutiva"
      - "Em sedução: não competir com ela em domínio dela; deixe-a brilhar onde brilha"
      - "Ego importa mais que resultado em hierarquias humanas"
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "casanova_lord_byron_rakes"
    title: "Casanova, Lord Byron, Duke Ellington — A Máquina de Apaixonar"
    narrative: "Lord Byron dormiu com a irmã, arruinou inúmeras garotas, tratou esposa de modo terrível, e mulheres continuavam atrás dele em ondas. Casanova nem precisa apresentação. Duke Ellington idem. Misconcepção: que eram frios e calculistas descartando alvos. Realidade: eram máquinas de SE APAIXONAR realmente. Cada mulher recebia tudo do homem por 1-3 meses — depois ele realmente se desapaixonava e ia pro próximo. A intensidade emocional da fase inicial era REAL, não performance — e essa autenticidade é o que devastava."
    lessons:
      - "Rake real (não fake) entrega-se completamente no início"
      - "Vulnerabilidade do homem em frente da mulher = devastador"
      - "Intensidade temporária real > moderação eterna calculada"
      - "Fragilidade pessoal (Byron quase chorava em paixões) ATRAÍA, não repelia"
    source_refs:
      - "raw/blog/thoughts-on-seduction.md"
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "fifty_cent_post_assassination_calm"
    title: "50 Cent — Calma Pós-Assassinato"
    narrative: "Em 2000, 50 levou 9 tiros e sobreviveu. Daí pra frente, o medo VAZOU dele. A calma absurda que ele tem em situações tensas (negociação, beef, ameaças) vem disso. Greene passou meses com ele e descreve: 'humanos lêem PRÉ-VERBALMENTE o nível de medo do outro. Se você tem menos, eles ou se intimidam ou te seguem.' 50 vive nesse modo. É a 50ª Lei encarnada."
    lessons:
      - "Trauma processado pode virar fearlessness real (não performada)"
      - "Calma autêntica é contagiosa e sobrepõe palavras"
      - "Pessoas lêem level de medo em segundos via tom de voz, olho, postura"
      - "Quem é mais calmo na sala tem mais poder, mesmo em silêncio"
    source_refs:
      - "raw/blog/the-50th-law.md"

  - id: "machiavelli_in_brothel"
    title: "Machiavelli no Bordel — A Vela e O Choque"
    narrative: "Machiavelli, em viagem, vai a bordel. Luz apagada, dorme com mulher. Resolve acender vela pra ver — descobre que era hideous. Tem traumão. Greene traz pra mostrar que Machiavelli era um sedutor de mulheres, dramaturgo, poeta, homem real — não o vilão frio do estereótipo. A 'virtù' dele é adaptabilidade, não maldade. Aplicado: o estereótipo do 'machiavélico' destrói a real lição (adaptar-se à fortuna sempre cambiante)."
    lessons:
      - "O sedutor estratégico real é também humano que tropeça"
      - "Estereótipo de 'frio calculista' = misreading"
      - "Adaptabilidade > rigidez moralista"
    source_refs:
      - "transcripts/The_Path_To_Power_-_Ambition_Status_Strength_Respect_-_Robert_Greene_4K.txt"

  - id: "josephine_baker_natural_dancer"
    title: "Josephine Baker — Naturalidade Como Sedução"
    narrative: "Dançarina afro-americana dos anos 20-30. Dançava de modos que pareciam selvagens em palco europeu (não tinha visto nada igual). Greene: o segredo era ter PRESERVADO o mundo de fantasia infantil que ela tinha. Dançava como criança brincando — autenticidade total, zero auto-monitoramento. Isso devastava plateia. Charlie Chaplin opera com mesma fórmula no cinema mudo."
    lessons:
      - "Naturalidade percebida vence técnica trabalhada"
      - "Quem mantém criança interna acessível tem charme não-replicável"
      - "Tentar não ser autêntico mata o efeito"
      - "Natural archetype: spontaneidade que parece não-construída"
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

  - id: "young_director_setup"
    title: "Diretor Hollywood Que Sabotou Subalterno"
    narrative: "Conta Greene: trabalhava pra diretor que tinha escrito roteiro e queria dirigir. Mas pra não 'parecer ambicioso demais', contratou outro diretor jovem 27a (sabidamente acima do nível dele), deliberadamente NÃO ajudou no que precisava, deixou cara fracassar em 2 dias de produção. Produtor demitiu o jovem; diretor original entrou como 'salvador'. Concealing your intentions em ação. Carreira do jovem foi destruída. Effective truth = ação, não palavra."
    lessons:
      - "Concealment de intenção é arma real (e ética complicada)"
      - "Ler ação acima da palavra (effective truth)"
      - "Bondade em hierarquia é frequentemente cover"
      - "Em sedução: cuidado com 'amigo' que parece ajudar de mais"
    source_refs:
      - "transcripts/The_Art_Of_Seduction_and_Human_Psychology_Robert_Greene_-_MP_Podcast_121.txt"

