    when_to_use:
      - "Coaching de usuário tentando 'virar alpha' via gritaria"
      - "Aterramento quando ele tá em modo apologético/auto-cancelado"
    examples:
      - "Greene: 'tratar mulher bem é VIRTUDE masculina, não fraqueza. Vem da segurança em si.'"
