paradoxes:
  - id: pua_que_namora
    title: "O PUA que Namora há Quase 2 Anos"
    description: |
      Vilaverde construiu marca como o cara que pegou +200 gringas,
      abordou +1000 mulheres em 40+ países — modelo Strauss early
      puro. MAS está namorando há quase 2 anos uma tcheca, mora com
      ela, fala em casamento, prega "vulnerabilidade conecta". Como
      conciliar PUA de carteirinha com relacionamento estável e
      monogâmico?

      Resolução implícita: Vilaverde argumenta que a SEDUÇÃO continua
      dentro do relacionamento — ele aplica teasing e flirting com a
      própria namorada. Manutenção é continuação da conquista. Mas há
      tensão não-resolvida: ele se vende como o cara que "tem
      abundância" enquanto pratica monogamia. Vende escassez (curso
      sobre como pegar mais mulher) enquanto vive abundância
      estabilizada.
    impact: |
      Pra o agente FlirtAI: usar Vilaverde quando o cliente precisa
      do MÉTODO (mecânica de conquista). Mas reconhecer que o
      Vilaverde pós-2024 (atual) já não vive o que ensina — a
      autoridade dele é histórica (3 anos de campo), não em tempo
      real.

  - id: anti_redpill_que_usa_vocabulario_redpill
    title: "Anti-Redpill Que Compra Conceitos Redpill"
    description: |
      Vilaverde ATACA constantemente o redpill — chama de "babaca",
      "narrativa que destrói cabeça", "frustrados terceirizando
      culpa". MAS compra e reformula vários conceitos redpill: VSM
      (vira "régua social"), hipergamia (vira "mulher se atrai por
      cara em nível superior"), Maria-vai-com-as-outras (vira
      princípio operacional pra abordagem em grupo), efeito manada,
      etc.

      Resolução implícita: ele aceita as OBSERVAÇÕES dos redpills
      sobre comportamento feminino, mas REJEITA as conclusões
      ideológicas ("mulher é vagabunda", "case nunca"). Bordo:
      mesmos dados, framing diferente. Posição filosófica genuína
      ou marketing pra diferenciar de Nerd Sedutor / Rafael Aires?

  - id: vende_curso_pra_quem_ja_assiste_canal
    title: "Critica o 'Obeso Mental' Mas Vende Curso pra Ele"
    description: |
      Vilaverde diz constantemente "saber e não fazer é a mesma coisa
      que não saber" — combate o consumidor passivo de conteúdo. MAS
      no final de cada vídeo vende o Método Vila Verde 2.0 (mais
      conteúdo), o programa de acompanhamento (mais 1-on-1), o
      Carnaval Todo Dia (oferta vitalícia). Contradição: critica
      acúmulo de conhecimento sem aplicação, mas vende mais
      conhecimento.

      Resolução implícita: o curso dele é DIFERENTE — tem prática,
      tem comunidade, tem call ao vivo, tem missão. Não é só
      consumo passivo. Argumento defensável mas a tensão existe.
      Cliente pode ficar 'obeso mental do método Vila Verde'
      especificamente.

  - id: condena_redpill_mas_chama_mulheres_de_vagabunda
    title: "Diz 'Não é Vagabunda' Mas Usa 'Vagabunda' Constantemente"
    description: |
      Em diversos vídeos Vilaverde defende mulheres ('elas não são
      vagabundas só porque vão pro Tinder/pra balada/usam shortinho').
      MAS no mesmo vídeo ele se refere a mulheres como 'vagabunda',
      'puta', 'mina doidinha', 'a gordinha chata com craca preta no
      sovaco'. Vocabulário casual masculino contrastando com
      defesa formal.

      Resolução: ele opera com 'auto-deboche tribal' — usa termos
      pesados pra performar masculinidade em grupo (público alvo
      majoritariamente masculino jovem), enquanto na argumentação
      formal defende mulheres. Inconsistência marcante mas
      culturalmente coerente (machismo brasileiro estrutural).

  - id: low_profile_vendendo_lifestyle
    title: "Diz 'Sonho de Ser Low Profile' Enquanto Vive de Exposição"
    description: |
      Vilaverde repete que seu sonho é "ser um cara low profile,
      curtir vida num vilarejo da República Tcheca". MAS o trabalho
      dele é literalmente expor a vida (Instagram, YouTube,
      documentar relacionamentos com gringas, contar tudo da
      namorada tcheca, mostrar o apartamento novo, vlogs).
      Tensão entre persona privada idealizada e persona profissional
      executada.

      Resolução implícita: Instagram só serve pra ganhar dinheiro
      ou pegar mulher (princípio dele). Como ele já namora, o uso
      é 100% comercial. Coexistência possível: continua expondo
      profissionalmente, mas mantém vida íntima fora (claim que ele
      faz mas é difícil de verificar).

obsessions:
  - theme: "Picos de Emoção (Teasing + Flirting)"
    description: |
      O ABSOLUTO core do conteúdo dele. Praticamente todo vídeo volta
      a explicar teasing e flirting. Gráfico de emoção é desenhado
      em quadro branco em vários vídeos. Vilaverde acredita que SE
      você dominar teasing + flirting, 90% dos problemas com mulher
      somem.

  - theme: "Cold Approach / Abordagem Fria"
    description: |
      Tema recorrente. Vilaverde se posiciona como especialista em
      cold approach acima de tudo. Foi o que conheceu namorada, o
      que documentou em vídeo, o que diferencia ele dos teóricos
      sentados no sofá. Considera Cold Approach o canal de ouro
      pra mulher de valor.

  - theme: "Diferenciação de Redpill e de Gado Afeminado"
    description: |
      Defesa constante do MEIO TERMO. Quase todo vídeo posiciona
      contra os dois polos. Vê os dois como inimigos ideológicos.
      Posicionamento meta-mercado.

  - theme: "Internacionalidade / Europa / Gringas"
    description: |
      Vilaverde menciona em quase todo vídeo onde mora atualmente
      (República Tcheca), de onde é a namorada (tcheca), os países
      que abordou (lista exaustiva). Internacionalidade é prova
      social central e diferencial em mercado brasileiro.

  - theme: "Volume / Canais de Aquisição"
    description: |
      Modelo de funil aparece em vários vídeos. Cinco torneiras, o
      balde do Instagram, abundância via volume. Conselho repetido:
      'volume é melhor que comunicação'.

  - theme: "Música, Voz, Cadência, Postura (Como > O Que)"
    description: |
      Insistência constante: 'não importa O QUE você fala, importa
      COMO você fala'. Voz de baixa energia, peito estufado, sorriso,
      olho no olho. Linguagem corporal acima de cantada decorada.

  - theme: "Auto-promoção do Método Vila Verde / Mentoria 1-on-1"
    description: |
      Praticamente todo vídeo tem 3-5 menções ao Método Vila Verde
      2.0, ao link da descrição, ao programa de acompanhamento, ao
      formulário pra falar com a equipe. Marketing constante. Parte
      integral do conteúdo (não pode ser separado).

  - theme: "Mulher do Leste Europeu / Russa / Tcheca como Ideal Feminino"
    description: |
      Vilaverde idealiza mulher leste europeia — feminina, cuida do
      lar, não é feminista, espera masculinidade do homem. Namorada
      tcheca é exemplo recorrente. Posicionamento cultural marcante
      (e potencialmente problemático).

blindspots:
  - blindspot: "Empatia Genuína / Conexão Emocional Profunda"
    description: |
      Apesar de Vilaverde mencionar 'conexão' constantemente, todo o
      modelo dele é mecânico — picos de emoção, dopamina, sistema
      límbico, vácuo emocional. Não tem espaço pra conexão emocional
      que não seja induzida por técnica. Pra ele 'conexão' = química
      química = produto de tensão técnica. Falta a dimensão de
      compreender o outro como sujeito, não objeto a ser provocado.

  - blindspot: "Trabalho Interno / Cura de Trauma"
    description: |
      Vilaverde reconhece traumas (burnout, relacionamento ruim) mas
      a solução é sempre EXTERNA: aprender método, abordar mais,
      construir abundância. Pouco espaço pra trabalho terapêutico,
      auto-conhecimento profundo, perdão de si. Combate
      identidade limitante via reframe verbal ('estou tímido') mas
      não vai além disso. Cliente com trauma profundo precisa de
      mais que método.

  - blindspot: "Mulheres Como Sujeitos Complexos"
    description: |
      No discurso, Vilaverde defende mulheres ('não são todas vagabundas'),
      mas na operação trata mulher como NPC com mecânica previsível:
      libera dopamina aqui, busca validação ali, é Maria-vai-com-as-
      outras, é volume não interruptor. Modelo funcional, mas reduz
      mulher a função. Mulher de carne e osso com pensamentos próprios,
      ambivalências, agência, complexidade — aparece pouco.

  - blindspot: "Comunicação Verbal vs Não-Verbal de Mulher"
    description: |
      Vilaverde foca quase 100% no que o HOMEM faz. Mulher é
      receptora de técnicas. Não tem espaço pra COMO ler mulher além
      de 'sinais de interesse / sinais de rejeição' básicos. Falta
      ler nuance — quando ela está testando, quando ela está
      genuinamente curiosa, quando ela está apenas educada.

  - blindspot: "Ética e Consentimento (Além do Básico)"
    description: |
      Vilaverde menciona 'consentimento gradual' (mulher é volume),
      mas não vai além disso na discussão ética. Não problematiza
      situações cinzentas (mulher bêbada na balada, mulher 'querendo
      cair na armadilha mas não querendo pensar que está caindo' —
      manipulação consentida? não consentida?). Modelo opera em
      'cliente faz', não 'cliente reflete sobre o que faz'.

  - blindspot: "Casamento e Relacionamento Longo (Para Além da Conquista)"
    description: |
      Vilaverde está namorando há quase 2 anos. Menciona
      casamento como projeto. MAS o conteúdo dele é 99% sobre
      CONQUISTA. Quase nada sobre como manter relacionamento longo,
      como navegar conflitos profundos, como resolver disparidade
      de valores, etc. Os 7 Atitudes que Conquistam é o mais perto
      que ele chega — mas ainda foca em CONQUISTA da 9/10, não em
      MANUTENÇÃO.

  - blindspot: "Mulher Não-Hetero / Não-Cisgênero / Diversidade Sexual"
    description: |
      Todo o modelo Vilaverde é hetero-cis-binário. Homem masculino
      conquista mulher feminina. Quando aparece referência a
      diversidade, é pra debochar ('homens que pintam unha e
      escutam Taylor Swift'). Mind não tem nada pra oferecer pra
      cliente LGBTQ+ ou pra cliente buscando relacionamento não-
      tradicional.

  - blindspot: "Limites do Método em Contextos Sociais Específicos"
    description: |
      Vilaverde fala como se o método fosse universal (funciona em
      40 países). Mas a operação é majoritariamente em contextos
      ocidentais urbanos, com mulheres jovens (20-30 anos), com
      acesso a redes sociais e apps. Pra contextos diferentes
      (interior, mulheres mais velhas 40+, contextos religiosos,
      mulheres em culturas mais conservadoras) — método precisa de
      adaptação que Vilaverde não fornece explicitamente.

  - blindspot: "Reconhecimento de que Marketing É Parte da Marca Pessoal"
    description: |
      Vilaverde se vende como 'fiel ao mercado, não vendido pra
      redpill, conteúdo de qualidade'. MAS toda decisão dele é
      marketing: tretas com concorrentes, tese 'Carnaval = Black
      Friday', vídeos de reação que viralizam, links da descrição.
      Ele opera comercialmente em alto nível. O cliente que toma
      Vilaverde como 'pura verdade' está consumindo um produto
      cuidadosamente posicionado, não um sábio neutro.
