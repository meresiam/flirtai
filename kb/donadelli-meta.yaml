# =================================================
# PARADOXES — Contradições aparentes / tensões internas
# =================================================
paradoxes:
  - id: defende_retencao_mas_namora_e_transa
    tension: >
      Donadelli é o pioneiro do NoFap no Brasil, prega abstinência radical,
      mas atualmente namora e tem sexo (Hard Mode com tantra/karezza).
      Como reconciliar 'evite estímulo sexual' com 'transo várias horas'?
    resolution: >
      Para Donadelli, o problema NÃO é sexo — é a EJACULAÇÃO mecânica
      como descarga. Sexo presente, sem orgasmo masculino, alimenta
      a energia (não drena). Tantra é sexo + retenção simultaneamente.
      A solução paradoxal expõe a sofisticação do framework além do
      meme 'NoFap = não transar'.

  - id: anti_pua_mas_promete_atratividade
    tension: >
      Donadelli critica abertamente quem busca técnica de campo,
      mas vende curso prometendo que NoFap traz mais mulheres, mais
      magnetismo, mais carisma. Não é o mesmo que PUA prometendo
      mulheres? Não está usando o desejo sexual como gancho de venda
      enquanto critica quem busca conquista?
    resolution: >
      A diferença é o MECANISMO. PUA promete via técnica (manipulação
      externa). Donadelli promete via substrato (transformação interna).
      O resultado pode ser similar (mais mulheres), mas o caminho e a
      qualidade da relação resultante são opostos. Ainda assim, há
      tensão genuína — usar 'pega mais mulher' como argumento de venda
      pode atrair o mesmo tipo de homem instrumental que critica.

  - id: defende_consciencia_mas_fuma_maconha
    tension: >
      Donadelli prega presença, consciência, propósito — mas confessa
      que ainda fuma cigarro e maconha. Como o coach espiritual pode
      ser usuário ativo de psicoativos?
    resolution: >
      Donadelli faz a confissão como demonstração de não-perfeição —
      'eu também sou humano, tenho meus vícios, mas não negligencio
      o resto da vida'. Vê isso como autenticidade > performance de
      pureza. Mas reconhece que é vulnerabilidade do discurso — pode
      ser explorada por críticos.

  - id: critica_conspiracao_mas_aceitou_anunnaki
    tension: >
      Donadelli faz auto-crítica de fase pró-conspiração (matrix,
      Bill Gates, COVID orquestrado) e diz que 'amadureceu'. Mas no
      mesmo episódio aceita teoria Anunnaki (semi-deuses extraterrestres
      criaram humanos, plantaram cogumelos como satélite intergaláctico)
      sem critério mais rigoroso. Onde traça a linha entre 'conspiração
      tóxica' e 'especulação espiritual válida'?
    resolution: >
      A linha implícita de Donadelli — conspiração POLÍTICA (que
      desemboca em descrédito de instituições democráticas) é
      problemática. Especulação METAFÍSICA (que apenas amplia mistério
      sem afetar comportamento social) é OK. Mas a fronteira é fluida
      e ele não articula completamente.

  - id: prega_pragmatismo_mas_místico
    tension: >
      O argumento central de Donadelli é PRAGMÁTICO ('teste por 7
      dias, veja o resultado'). Mas a fundamentação é altamente
      MÍSTICA (kundalini, energia etérica, frequências de Fibonacci,
      lei da atração). Como reconciliar 'só teste empírico' com
      'tradições milenares dizem isso'?
    resolution: >
      Donadelli não vê tensão — para ele, a tradição mística APONTA
      para o experimento pragmático ('os hindus já sabiam disso há
      3000 anos, agora você testa'). Mas isso significa que pessoas
      racionais-céticas têm que aceitar o pacote místico para tentar
      a prática. Pode afastar quem se beneficiaria do método.

  - id: humilde_mas_mestre
    tension: >
      Donadelli alterna entre humildade radical ('eu sou só um ser
      humano querendo ajudar outros', 'não sei a resposta', 'Sócrates
      tinha razão, só sei que nada sei') e tom de mestre que entrega
      verdade ('eu transformei vidas', 'eu tenho dois mil alunos',
      'eu sei que é real pra mim'). Qual versão é a real?
    resolution: >
      Ambas são genuínas em ciclos diferentes. Donadelli oscila —
      jovem coach que conquistou audiência mas ainda processa
      vulnerabilidades. A oscilação é parte do que torna ele
      autêntico mas também o que cria reatância em públicos que
      esperam uma persona consistente.

  - id: nofap_aos_19_mas_meditacao_aos_7
    tension: >
      O storytelling oficial de Donadelli é 'descobri NoFap aos 19
      e mudou minha vida'. Mas ele MEDITAVA desde os 7 anos no grupo
      de reabilitação na Alemanha. O substrato espiritual existia
      muito antes do NoFap. NoFap foi o gatilho, não a fundação.
    resolution: >
      Donadelli reconhece isso ('quando eu redescobri meditação aos
      20, foi voltar a algo que já estava lá'). Mas marketing simplifica
      em 'NoFap mudou minha vida'. Quem só vê o conteúdo recente pode
      acreditar que NoFap é A CHAVE — quando é mais provavelmente
      catalisador de um conjunto.

# =================================================
# OBSESSIONS — Temas que SEMPRE voltam
# =================================================
obsessions:
  - id: transmutacao_energetica
    description: >
      O conceito-pilar. Aparece em CADA podcast, em cada explicação,
      em cada framework. Tudo se reduz a 'a energia sexual não pode
      ser desperdiçada — tem que ser transmutada'. Cita Napoleon
      Hill compulsivamente.
    frequency: extrema

  - id: propósito_como_solução_universal
    description: >
      A descoberta TARDIA mas central — propósito é o que sustenta
      tudo. Sem propósito, recaída é inevitável. Tema cresceu na
      conversa do Donadelli a partir de 2022.
    frequency: alta

  - id: napoleon_hill_e_lei_da_atração
    description: >
      Cita 'Think and Grow Rich' como bíblia pessoal. Joseph Murphy,
      lei da atração, manifestação, pensamento + emoção. Aparece
      em qualquer conversa longa.
    frequency: alta

  - id: presença_e_mindfulness
    description: >
      Cada prática se resume a presença. Meditação, comer sem celular,
      sexo sem fantasia, tudo. Influência clara de budismo Zen e
      Sadhguru.
    frequency: alta

  - id: tradições_orientais_unificadas
    description: >
      Conecta constantemente taoísmo (chi), hinduísmo (kundalini),
      Tantra, budismo (mindfulness), com ocasional referência a
      cristianismo (Davi, Jesus como estado de consciência). Tudo
      seria a mesma sabedoria em vocabulários diferentes.
    frequency: alta

  - id: critica_estrutural_a_pornografia
    description: >
      Não trata pornografia como 'questão individual' — trata como
      indústria multibilionária explorando biologia masculina. Cita
      Gary Wilson, neurociência da dopamina, casos extremos.
    frequency: extrema

  - id: ritual_disciplina_estrutura
    description: >
      Ritual matinal, banho frio, meditação, 8h trabalho, dormir cedo,
      visualizar próximo dia. Disciplina externa como suporte de
      transformação interna. Volta com frequência.
    frequency: alta

  - id: estoicismo_e_memento_mori
    description: >
      Marco Aurélio, Sêneca, mortality salience. 'Memento mori' como
      mantra. Steve Jobs como ídolo (que usava a frase). Adiciona
      um tom de gravidade que contrasta com a parte mística.
    frequency: média

  - id: minimalismo_e_essencialismo
    description: >
      'Cortar todo bullshit'. Roupa, posses, agenda, relacionamentos.
      Inflência de minimalismo digital. Não gasta com coisas materiais.
    frequency: média

  - id: experiência_pessoal_como_argumento
    description: >
      Sempre retorna a 'eu vivi isso, eu sei'. Narrativa autobiográfica
      é a prova primária. 'Eu tive centenas de recaídas. Eu morei na
      Alemanha. Eu quase tive overdose.' Auto-revelação radical
      como ferramenta retórica.
    frequency: extrema

# =================================================
# BLINDSPOTS — O que ele IGNORA / NÃO vê
# =================================================
blindspots:
  - id: ausencia_total_de_tecnica_de_campo
    blindspot: >
      Donadelli NÃO ensina NADA sobre interação social com mulheres.
      Não fala em primeira mensagem, abordagem, escalada, leitura de
      sinais, como conduzir uma conversa. Como se o substrato resolvesse
      sozinho TODOS os problemas de habilidade interpessoal. Mas há
      claramente homens com substrato bom que ainda travam tecnicamente.
    consequence_for_flirtai: >
      Inutilizável como única fonte para qualquer questão de "como
      faço PARA falar/agir com ela". Precisa SEMPRE ser complementado
      por Greene/Strauss para questões de campo. Donadelli é o "antes
      e o depois", nunca o "durante" da interação.

  - id: nao_le_leitura_situacional
    blindspot: >
      Não articula que algumas situações exigem técnica MESMO com
      substrato pronto. Trata 'aura' como suficiente sempre. Mas
      mulher gostosa em balada lotada com 10 caras dando em cima
      às vezes precisa de pattern interrupt, frame strong, leitura
      do grupo — coisas técnicas. Donadelli ignora.
    consequence_for_flirtai: >
      Caminho D (predador com inteligência situacional) precisa CONFRONTAR
      Donadelli aqui — sua filosofia funcionária se todos os ambientes
      fossem 1-on-1 com tempo ilimitado. Não é o mundo real de mercados
      sexuais competitivos.

  - id: ignora_dinamica_de_classe_social
    blindspot: >
      Não fala em status, dinheiro, mercado social. Trata atração
      como puramente energética. Mas relacionamento humano envolve
      fatores como educação, classe, idade, contexto cultural,
      ambição compartilhada. Donadelli reduz tudo ao eixo presença/aura.
    consequence_for_flirtai: >
      Precisa ser balanceado com mind que considere realidade
      sociológica (Greene faz isso bem com poder, hierarquia, leitura
      de tribos).

  - id: silencio_sobre_mulheres_reais
    blindspot: >
      Donadelli fala MUITO de pornografia (mulher virtual) e de teoria
      ('a mulher é naturalmente submissa', citando Jordan Peterson),
      mas POUCO sobre como funcionar com mulher REAL específica.
      Tem namorada atualmente, mas conta pouco da dinâmica concreta
      — só o aspecto sexual (tantra). Não fala sobre conflito, sobre
      como ela é como pessoa, sobre escuta dela. A mulher aparece
      meio como categoria abstrata.
    consequence_for_flirtai: >
      Inadequado para questões relacionais complexas (briga, gestão
      de expectativas, ciúme, traição, etc.). Precisa de outros minds.

  - id: nao_questiona_premissa_masculinista
    blindspot: >
      Aceita acriticamente narrativas como 'mulher é naturalmente
      submissa' (citação Jordan Peterson), 'feminismo é antinatural',
      'mulher quer ser dominada na cama'. Não interroga essas
      premissas — apenas aceita como dado. Pode levar a aplicações
      problemáticas pelo usuário do FlirtAI.
    consequence_for_flirtai: >
      Filtrar com cuidado. Premissas masculinistas grosseiras
      precisam ser balanceadas. Não citar acriticamente.

  - id: relacao_complicada_com_evidencia
    blindspot: >
      Mistura ciência sólida (neurociência de dopamina, Gary Wilson)
      com pseudociência (Fibonacci, frequência 432 Hz, Anunnaki,
      kundalini como literal). Não tem critério claro de demarcação.
      Defende 'comunidade científica tem falhas' como geral, mas
      depois usa estudos científicos quando convém.
    consequence_for_flirtai: >
      Em RAG, evitar citar partes místicas/pseudo-científicas como
      autoritativas. Usar Donadelli para FILOSOFIA + PRÁTICA, não
      para FATOS factualmente verificáveis.

  - id: nao_aborda_diferencas_individuais
    blindspot: >
      Trata NoFap como universalmente aplicável. Mas há evidência de
      que diferentes pessoas respondem diferente — alguns têm pico
      do dia 7, outros não. Alguns precisam de medicação. Alguns
      têm trauma sexual que requer terapia, não meditação. Donadelli
      tem um único protocolo para todos.
    consequence_for_flirtai: >
      Não recomendar NoFap como receita universal. Usuário com
      histórico psiquiátrico ou trauma precisa de profissional, não
      só de método AlphaSpirit.

  - id: ausencia_de_dinamica_de_longo_prazo
    blindspot: >
      Donadelli foca em 'tornar-se atraente' / 'atrair mulher'. Não
      fala em CASAR, ter filhos, sustentar relacionamento de 20 anos,
      lidar com crise conjugal de meia-idade, etc. Tudo é tom de
      'rapaz se transformando', não 'homem maduro vivendo'.
    consequence_for_flirtai: >
      Útil para faixa 18-35. Para 35+ com relacionamento estável e
      questões de meia-idade, precisa de outras fontes.

  - id: pouca_consideracao_pelo_lado_dela
    blindspot: >
      Todo o framework é centrado no DESENVOLVIMENTO MASCULINO. Mulher
      aparece como objetivo (atrair) ou como complicação (parceira do
      tantra). Não fala muito sobre o que ela quer, o que ela sente,
      como construir mutualidade. Não é misógino — é apenas
      monocular masculino.
    consequence_for_flirtai: >
      Precisa de complemento sobre dinâmicas relacionais reais (Glover
      tem mais sobre isso, e qualquer literatura de relacionamento
      saudável). Para conexão e construção de longo prazo, Donadelli
      é insuficiente.

  - id: nao_distingue_recusa_legitima
    blindspot: >
      Por focar em 'sua aura atrai', Donadelli não fala em rejeição
      legítima. E se ela simplesmente não está afim, por motivos dela,
      não por defeito do homem? A filosofia 'se você fizer o trabalho
      interno todas vão querer' tem perigo de não-aceitação de
      preferência feminina.
    consequence_for_flirtai: >
      Importante balancear — substrato bom AUMENTA chance de atração,
      mas não a garante com qualquer mulher. Saber sair com graça
      de 'não' é parte da maturidade que Donadelli pouco aborda.
