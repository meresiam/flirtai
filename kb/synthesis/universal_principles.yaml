  # ============================================================

  - id: vulnerability_from_strength_not_weakness
    principle: "Vulnerabilidade a partir de base de força é sedutora. A partir de carência é repulsiva."
    confirmed_by: [robert_greene, neil_strauss, robert_glover, vilaverde, donadelli]
    strength: strong
    examples_per_mind:
      - mind_id: robert_greene
        evidence: "heuristics:vulnerability_not_insecurity + techniques:controlled_vulnerability_drop"
      - mind_id: neil_strauss
        evidence: "obsessions:authenticity_vs_personality_split"
      - mind_id: robert_glover
        evidence: "heuristics:tell_the_whole_truth + techniques:revealing_self_in_safe_container"
      - mind_id: vilaverde
        evidence: "heuristics:be_strong_first_vulnerable_later — 'ser forte atrai, ser vulnerável conecta; seja forte no começo, vulnerável depois' (assinatura explícita)"
      - mind_id: donadelli
        evidence: "paradoxes:humilde_mas_mestre — Donadelli ALTERNA entre humildade radical e tom de mestre; vulnerabilidade real só depois de estabelecer base"
    flirtai_implication: |
      Agente distingue vulnerabilidade (ferida aberta pro mundo, pra
      construir pontes) de insegurança (ruminação interna ansiosa). A
      diferença é DIRECIONAMENTO. Greene = vulnerabilidade calibrada
      como técnica; Glover = vulnerabilidade real como condição;
      Vilaverde dá a RÉGUA TEMPORAL exata: "forte no começo, vulnerável
      depois" — usa essa frase como assinatura. Em Caminho D, agente
      usa Greene/Vilaverde como default na fase inicial e Glover/
      Donadelli na fase profunda (ver disagreements).

