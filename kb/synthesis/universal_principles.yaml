    confirmed_by: [robert_greene, neil_strauss, robert_glover, krausche, vilaverde, donadelli, erick_ronaldo]
    strength: strong
    examples_per_mind:
      - mind_id: robert_greene
        evidence: "heuristics:confidence_must_be_based_on_real_skill + anti_patterns:bravado_fake_confidence"
      - mind_id: neil_strauss
        evidence: "case_studies:post_game_callers (caras que aprenderam técnica sem substrato — burnout)"
      - mind_id: robert_glover
        evidence: "heuristics:challenge_self_limiting_beliefs + case_studies:glover_dating_in_late_40s"
      - mind_id: krausche
        evidence: "frameworks:metodo_desenrolado (7 pilares: corpo, estilo, perfil, conhecimento, financeiro ANTES de abordagem) + anti_patterns:dependencia_de_alcool"
      - mind_id: vilaverde
        evidence: "frameworks:confidence_two_pillars — Confiança = Conhecimento + EXPERIÊNCIA; sem prática, é pose que quebra"
      - mind_id: donadelli
        evidence: "heuristics:aura_emerge_nao_se_finge — 'não tente PARECER alpha, VIRE' + heuristics:trabalho_interno_antes_de_tecnica"
      - mind_id: erick_ronaldo
        evidence: "frameworks:modern_man_90day_transformation — 6/10 em TODAS as áreas (fitness, style, social, mental) como base"
    flirtai_implication: |
      Agente recusa entregar "trucos de confiança rápida" sem endereçar
      o substrato. Se usuário pede "como pareço confiante?", agente
      reframe: "Confiança não se parece — se constrói. Que skill/área
      da sua vida você está em débito agora?" Em janela curta (entrevista,
      primeira abordagem) performar pode ajudar — mas sustentado só com
      base real. 7/8 minds confirmam (única ausência é Pedrinho UOL —
      que não articula teoria). Os 4 BR depth/flavor reforçam fortemente.

  # ============================================================
