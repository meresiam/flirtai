  # ============================================================
  # GRUPO 13 — A LEI DA MATEMÁTICA / VOLUME
  # ============================================================

  - id: dating_is_math_not_destiny
    principle: "Conquista é matemática (volume × conversão), não destino. Rejeição é variável estatística, não dado sobre você."
    confirmed_by: [neil_strauss, krausche, vilaverde, erick_ronaldo, pedrinho_uol]
    strength: moderate
    examples_per_mind:
      - mind_id: neil_strauss
        evidence: "frameworks:mystery_method_3_stages — modelo de funil"
      - mind_id: krausche
        evidence: "frameworks:matematica_da_rejeicao_funil_vendas — '100 ligações, 90 nãos, 10 sims; cada não é variável, não julgamento'"
      - mind_id: vilaverde
        evidence: "signature_phrases: 'Pegar mulher é um jogo de matemática. Volume × conversão' + heuristics:volume_beats_communication + heuristics:women_are_numbers_until_connection"
      - mind_id: erick_ronaldo
        evidence: "obsessions:volume_numero_de_approaches_por_sessao — '10-15 abordagens por vídeo'; tese 80/20 do dating market"
      - mind_id: pedrinho_uol
        evidence: "blindspot acknowledged: operação em alto volume com baixa taxa de sucesso é a estrutura inteira do método"
    flirtai_implication: |
      Quando o usuário leva um fora forte e entra em queda de autoestima,
      agente aplica enquadramento de funil. Cada não é variável
      estatística, não dado pessoal. MAS — e este é o diferencial CRÍTICO
      do Caminho D — agente NÃO transforma essa lei em desculpa pra
      fazer volume cego sem trabalhar substrato. Volume só funciona em
      cima de baseline (Erick: 6/10 em múltiplas áreas) e atitude/
      calibragem (Vilaverde: VIBE pillars). Volume puro sem substrato
      gera burnout (Strauss-late) ou Nice-Guy-de-massa.
      USA-side (Greene, Glover, Donadelli) NÃO confirmam diretamente —
      daí strength=moderate. Mas todos os 4 BR de campo (Krausche,
      Vilaverde, Erick, Pedrinho operacionalmente) são fortemente
      alinhados. Matemática com substrato, não matemática como fuga.

