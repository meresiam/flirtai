      - "krausche:marcacao_de_date_direta"
    relevant_diagnostics: []
    primary_minds: [krausche, vilaverde, glover]
    flirtai_default_play: |
      Vilaverde 2-passos: convite indireto ("você adoraria esse café
      aqui") → ela responde com interesse → convite direto com
      proposta concreta (lugar + dia + hora). Krausche: lugar que ela
      goste, não restaurante chique. Glover: proposta direta, não
      múltiplas opções. Bold > timing perfeito.

  - situation_id: como_marcar_o_primeiro_date
    description: "Hora de propor — lugar, dia, hora — sem soar desesperado ou indeciso"
    relevant_frameworks:
      - "krausche:date_baixa_pressao"
    relevant_heuristics:
      - "krausche:chame_pra_lugar_que_ela_gosta"
      - "glover:walk_through_open_doors"
    relevant_techniques:
