      - "krausche:marcacao_de_date_direta"
      - "vilaverde:convite_direto_apos_indireto_aceito"
    relevant_diagnostics: []
    primary_minds: [krausche, glover]
    flirtai_default_play: |
      Proposta CONCRETA: 1 lugar + 1 dia + 1 hora (não múltiplas
      opções). Lugar que ela goste, baixa-pressão (Krausche). NÃO
      "quando você puder", NÃO "se você quiser" — afirmação calibrada.
      Glover: walk through open doors quando ela sinalizou.

