      - "vilaverde:ela_disse_friendzone"
      - "greene:ela_diz_so_amigos"
    relevant_diagnostics:
      - "krausche:ela_te_chama_de_amigo"
    primary_minds: [krausche, vilaverde, glover]
    flirtai_default_play: |
      Krausche é categórico: REAJA NA HORA, não deixe enrolar. Vire
