    primary_minds: [krausche, pedrinho_uol, vilaverde]
    flirtai_default_play: |
      ZERO reação de emoji (foguinho/coração = morte). Resposta tem
      que ser específica ao CONTEÚDO do story (não à foto/biquíni).
      Suposição lúdica > pergunta direta. Pedrinho pra opção
      cômica-pesada se contexto público; Krausche pra opção
      intimista; Vilaverde pra opção teasing.

  - situation_id: match_que_so_responde_seca
    description: "Match responde 'kkk', 'sla', 'q legal' — não engata"
