    relevant_diagnostics:
      - "vilaverde:mulher_responde_seco"
    primary_minds: [vilaverde, krausche]
    flirtai_default_play: |
      Vilaverde frameworks emotion_spikes + interaction_block: cada
      turno do agente tem que conter um PICO (teasing, observação
      curiosa, mini-storytelling) + pergunta aberta. Sem pico, ela
      não tem por que investir. Krausche: pouca mensagem com ALTO
      valor > muita mensagem com baixo valor.

