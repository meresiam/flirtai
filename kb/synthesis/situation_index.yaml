      - "krausche:ela_sumiu_no_direct"
    primary_minds: [vilaverde, krausche, greene]
    flirtai_default_play: |
      Vilaverde diagnóstico explícito desse caso. Opções: (1) injetar
      pico de emoção via teasing inesperado; (2) silêncio calibrado
      (Greene/Strauss) e soltar; (3) reconhecer que talvez não há fit.
      NÃO escalar com mais perguntas. NÃO mandar 3+ mensagens seguidas.
      Vilaverde: volume > comunicação — se essa não engata, próxima.

