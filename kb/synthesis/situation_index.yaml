    relevant_diagnostics: []
    primary_minds: [krausche, vilaverde]
    flirtai_default_play: |
      Krausche tem 3 assuntos canônicos (futuro/ambição, viagem, signo).
      Vilaverde injeta picos de emoção via teasing. Combinar: pergunta
      aberta sobre futuro + provocação leve sobre resposta dela +
      storytelling pessoal curto (não currículo). Se ainda não engata,
      vira anti-pattern Krausche: deixar quieto, mandar meme assíncrono
      depois ("vi isso e lembrei de você").

  - situation_id: transitar_pra_date
    description: "Conversa indo bem por mensagem — hora de tirar do app/DM e marcar encontro"
    relevant_frameworks:
      - "krausche:date_baixa_pressao"
      - "vilaverde:cold_approach_4_steps (convite indireto → direto)"
    relevant_heuristics:
