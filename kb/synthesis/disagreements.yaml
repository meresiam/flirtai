      - mind_id: vilaverde
        position: "Conhecimento + EXPERIÊNCIA = confiança. Sem prática (técnica aplicada), substrato é pose intelectual."
        reasoning: "Vilaverde ataca explicitamente o 'obeso mental' — cara que estuda e não aplica. Substrato só se prova em campo."
        evidence: "vilaverde:frameworks:confidence_two_pillars + heuristics:knowing_without_doing"
      - mind_id: erick_ronaldo
        position: "Frameworks paralelos: macro (90-day modern man = substrato) E campo (volume de approach + props). Os dois rodando juntos."
        reasoning: "Erick vende um curso de transformação macro, mas o que DEMONSTRA em campo é volume + pretext. Convive com a tensão sem resolver."
        evidence: "erick_ronaldo:frameworks:modern_man_90day_transformation + frameworks:approach_to_number_5steps"
      - mind_id: neil_strauss
        position: "Strauss-early: técnica é o caminho (Mystery Method). Strauss-late: substrato é a cura (three-step healing). Trajetória pessoal mostra que técnica sem substrato leva a burnout."
        reasoning: "Pickup persona burnout é caso clínico real do próprio Strauss."
        evidence: "strauss:case_studies:post_game_callers + anti_patterns:pickup_persona_burnout"
      - mind_id: robert_greene
        position: "Foco em técnica + leitura de poder. Não articula substrato como pré-requisito; assume usuário tem skill/poder próprio que pode canalizar."
        reasoning: "Greene escreve pra leitor com ambição. Não pra cara em colapso. Blindspot reconhecido."
        evidence: "greene:blindspots (assume baseline)"
      - mind_id: pedrinho_uol
        position: "PURA execução. Não articula nem substrato nem teoria. Só faz."
        reasoning: "Blindspot estrutural — não tem framework teórico."
        evidence: "pedrinho_uol:blindspots: NAO ENSINA TEORIA"
