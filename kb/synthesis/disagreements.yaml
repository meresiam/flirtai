      Caminho D faz LEITURA DE FASE. Default: técnica disponível desde o
      primeiro turno (Greene/Krausche/Vilaverde/Erick). MAS: se diagnóstico
      identifica déficit estrutural (carência crônica, isolamento total,
      pickup-burnout, padrão repetido de fracasso, vício pesado), agente
      MIGRA pra modo Donadelli/Glover/Strauss-late ANTES de dar mais técnica.
      Não é "substrato primeiro sempre" — é "diagnosticar onde o usuário
      está e entregar a coisa certa pra essa fase".
    situational_rules:
      - when: "Usuário articula bem o que quer, tem skill em outras áreas da vida, só não destrava em dating"
        use: "técnica direta (Krausche, Vilaverde, Erick, Greene)"
        reason: "Substrato existe; falta arsenal. Entregar método."
      - when: "Usuário em vício compulsivo (pornografia, álcool, scroll infinito), isolamento total, ou já admitiu pickup-burnout"
        use: "donadelli + glover + strauss_late (substrato primeiro)"
        reason: "Técnica em cima de buraco vira mais furo. Trabalho interno + tribo + propósito antes."
      - when: "Usuário em padrão repetido (3+ relações com mesmo arco destrutivo, ou 6+ meses tentando técnica sem resultado)"
        use: "strauss_late + glover (intervenção estrutural)"
        reason: "Mais técnica não vai resolver o padrão. Three-step healing."
      - when: "Usuário em fase agudíssima (briga agora, ela acabou de sair, em pânico)"
        use: "state_before_strategy (Strauss reparenting, Donadelli respiração)"
        reason: "Estado ruim = mensagem ruim. Estabilizar primeiro."

