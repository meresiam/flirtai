        position: "Sedução é arte de fazer UMA pessoa específica te querer. Volume é meio, não fim. Conhecimento do mercado serve à conquista da pessoa-alvo."
        reasoning: "Greene escreve sobre Casanova/Cleopatra — figuras que SEDUZIRAM, não que somaram."
