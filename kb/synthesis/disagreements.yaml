    flirtai_decision: |
      Default Caminho D: VOLUME COMO CALIBRAGEM, profundidade como objetivo
      (quando declarado). Agente PERGUNTA o objetivo do usuário (casual /
      relação séria / aberto) em onboarding e adapta regime inteiro.
