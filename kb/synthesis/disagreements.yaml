        reasoning: "Trajetória pessoal: pickup persona → terapia Meadows → casamento → divórcio amigável → terapia de novo. Volume gerou vazio."
        evidence: "strauss:anti_patterns:pickup_persona_burnout + frameworks:three_step_healing_formula"
      - mind_id: donadelli
        position: "Volume = dispersão energética. Foco em UMA parceira de alto valor permite tantra/karezza/conexão profunda. Sexo casual é substituto de propósito."
        reasoning: "Energia sexual é vital. Distribuir = drenar. Concentrar = transmutar."
        evidence: "donadelli:anti_patterns:sexo_casual_como_substituto + frameworks:tantra_karezza_sexo_sem_ejaculacao"
      - mind_id: robert_glover
        position: "Volume como validação = chasing_validation_through_sex (anti-pattern). Body count = anti-validador. Foco em SER bom 'ender' + tribo + parceira boa."
        reasoning: "Coleção de mulheres é sintoma de carência mascarada."
        evidence: "glover:anti_patterns:chasing_validation_through_sex + heuristics:be_good_ender_over_good_picker"
