case_studies:
  - id: francesa_buckingham_palace
    title: "A Francesa que Virou o Rosto em Londres (Origin Story do Método)"
    narrative: |
      Em Londres, recém-mudado pra Europa, Vilaverde tava em um
      grupo social de imigrantes. Conheceu uma francesa "muito de
      boa", criou conexão real, brincou que toda francesa era
      grossa, prometeu comprar croissant pra ela, vários jogos
      lúdicos. Conseguiu marcar encontro num restaurante italiano
      (parte do teasing — comida italiana é melhor que francesa).
      Date foi bom — conversa, brincadeira, conexão profunda. No
      final, levou ela pra dar uma volta num parque. Foi sentar
      num banco, puxou ela e tentou beijar. Ela virou o rosto.
      Tentou de novo. Ficou clima de merda. Forçou: "por que você
      não quer me beijar?" (Vilaverde chama isso de "nível da
      cafonice"). Ela falou que preferia ir mais devagar, ser
      mais amiga. Cara, missão falha.

      A partir desse dia, ele decidiu estudar sedução — não pra
      passar mais por esse problema, e pra evitar que outros homens
      passem. É a origin story explícita do Método Vila Verde.
    lessons:
      - "Date inteiro no zero da barrinha + tentativa de pular pro 100% no final = mulher vira o rosto"
      - "Sem CVC (Contato Visual + Voz e Ritmo + Contato Físico) durante o date, beijo não acontece"
      - "Forçar 'por que você não quer me beijar?' é o ÁPICE do gado — destrói qualquer chance"
      - "Conexão emocional sem escalonamento físico vira friendzone"
      - "Esse fracasso virou MÉTODO — toda dor pode virar produto se você categoriza"
    source_refs:
      - "3_coisas_que_voce_DEVE_fazer_no_1_encontro"

  - id: russa_em_londres_esfriou
    title: "A Russa que Esfriou Após Eu Me Vulnerabilizar (Caso Anti-Vulnerabilidade)"
    narrative: |
      Em Londres, durante a guerra Ucrânia-Rússia, fluxo grande de
      mulheres russas e ucranianas chegou na cidade. Vilaverde
      conheceu uma russa no bairro Alto em Lisboa (não foi Londres
      — corrigir narrativa: foi em Lisboa). Cold approach
      tradicional, ela foi difícil no início, ele insistiu com
      paciência, pegou Instagram, depois saíram. Beijo, 6-7 dates
      bons. Vilaverde tava em fase difícil — método ainda não
      vendia bem, ele tava inseguro com trabalho.

      Ganhou intimidade com a russa, achou que podia se abrir.
      Começou a falar das inseguranças dele com o trabalho, das
      frustrações de não vender mais o método Vila Verde. Praticamente
      "entrou em posição fetal" emocionalmente. A russa MUDOU. Do
      dia pra noite começou a esfriar — sumir, demorar pra
      responder, postar stories sozinha (chamada de atenção dela),
      espaçamento entre dates. Eventualmente acabou.

      Lição central: mulher feminina (especialmente leste europeia)
      busca SEGURANÇA. Já tem inseguranças próprias. Não vai
      adicionar as dele. Quem cuida da vulnerabilidade do homem é
      OUTRO HOMEM (amigo, pai, terapeuta), não a mulher que ele
      tá conquistando.
    lessons:
      - "Ser vulnerável CEDO no relacionamento destrói atração"
      - "Mulher feminina busca segurança — quer 'o homem do tá tudo bem'"
      - "'Ser forte atrai, ser vulnerável conecta — mas DEPOIS, não no começo'"
      - "Mulher do leste europeu / russa é especialmente sensível a falta de masculinidade"
      - "Os 3 NUNCA: nunca fale mal da ex / nunca conte inseguranças / nunca conte medos no início"
    source_refs:
      - "NUNCA_conte_esses_3_Segredos_sobre_voce_pra_uma_mulher"

  - id: alema_em_lisboa_10_minutos
    title: "A Alemã em Lisboa em 10 Minutos (Modelo de Cold Approach Completo)"
    narrative: |
      Vilaverde tava em Lisboa com seu cameraman e um amigo
      (wingman). Viu uma alemã turista andando. Abordagem dupla:
      ultrapassaram ela, viraram de frente, ele foi no alvo,
      amigo distraiu a amiga. Linguagem corporal — peito estufado,
      sorriso, contato visual forte.

      "Hi! Say hi!" → "Where are you from?" → "Germany" → "What's
      your name?" → "Lula." → ele não conseguiu falar o nome
      direito. Em vez de se desculpar (gado), fez teasing-
      desvalidação: "Lula? Difícil né? Você tem cara de quem não
      consegue falar nome estrangeiro." Ela riu e se defendeu.

      "When did you arrive?" → "Four days ago." → ele jogou
      flirting clássico: "Well, I have good news. You just found
      the best tour guide in Lisbon. A Brazilian one." Convite
      indireto embutido (guia turístico). Trocaram Instagram.

      No fim, quando ela tentou convidar pra sair AQUELA noite, ele
      fez push: "Ah, hoje eu vou sair com uns amigos." Ela
      respondeu surpresa "mas no meio de uma quarta?" Ele jogou
      teasing de volta: "agora você tá me julgando? kkk" E
      terminou educadamente, beijinho na bochecha.

      ~10 minutos. Cold approach do oi ao Instagram, com push
      final. Modelo MASTER do método.
    lessons:
      - "Abordagem dupla com wingman = neutraliza amiga 'cock blocker'"
      - "Provar não-ameaça via educação no início ABAIXA a guarda"
      - "Erro do nome dela vira teasing (transforma cagada em pico de emoção)"
      - "Convite indireto disfarça intenção ('guia turístico')"
      - "Push no final maximiza pico de emoção, faz mulher viciar (não é só pegar — é fazer ela ficar louca por você)"
      - "Sai antes de exaurir — 10min é suficiente"
    source_refs:
      - "COMO_ABORDAR_UMA_MULHER_NA_RUA_-_Mostrei_na_pratica"

  - id: sueca_do_tinder_basquete
    title: "A Sueca da Foto de Basquete (Tinder Master Class)"
    narrative: |
      Vilaverde deu match com uma sueca super gata no Tinder em
      Lisboa. Loiríssima, olho azul, modelo de basquete. As fotos
      dela eram quase todas em estúdio/no quarto/de espelho —
      perfil "vazio" pra fazer teasing. Difícil achar hook.

      Numa das fotos, ela tentava acertar uma cesta de basquete.
      Era a foto MENOS bonita do perfil dela. Vilaverde pegou ela.

      Pensou: como diferenciar dos outros 50 caras que mandaram
      "you're so beautiful"? Decidiu desvalidar. Mandou (em inglês):
      "Quantas vezes você tentou fazer essa cesta antes de tirar
      essa foto? 😂"

      Resposta dela imediata, longa, se justificando: "Não, é
      porque eu jogo basquete. Dessa vez eu acertei na primeira."
      Já estava se VALIDANDO pra ele. Jogo invertido nos primeiros
      30 segundos. Ela perguntou sobre ele. Eles conversaram,
      saíram, ele saiu com ela.

      Lição: nas primeiras mensagens com mulher 9/10, a meta NÃO é
      agradar — é DIFERENCIAR. Mulher 9/10 recebe validação
      infinita desde criança. Tirar a validação cria vácuo
      emocional que ela busca preencher.
    lessons:
      - "Primeira mensagem com mulher gata tem que diferenciar dos 50 gados que mandaram 'gata'"
      - "Teasing-desvalidação em algo específico do perfil > cantada genérica"
      - "Mulher 9/10 acostumada a validação infinita — choque negativo é o que destaca"
      - "Quando ela se justifica, frame invertido — agora ela busca SUA validação"
      - "Mesmo com sueca top, frame consciente vence beleza/dinheiro/fama"
    source_refs:
      - "Aprenda_COMO_DESPERTAR_INTERESSE_em_uma_mulher"
      - "Como_Conquistar_Mulheres_Extremamente_Bonitas_Faca_Parte_Dos_1"

  - id: namorada_tcheca_via_cold_approach
    title: "A Namorada Tcheca (Cold Approach que Virou Relacionamento)"
    narrative: |
      Em Lisboa, Vilaverde abordou uma turista da República Tcheca
      que tava de passagem. Cold approach na rua. Ela era reservada,
      loira, feminina, mulher de valor. Vilaverde menciona
      explicitamente que ela JAMAIS daria moral pra ele em outros
      canais — não usava Tinder, no Instagram receberia DM de 100
      caras e ignoraria todos.

      Mas no Cold Approach, era 1v1: ele, a comunicação dele, e ela.
      Sem competição. Aplicou o método completo (gancho + interação +
      convite indireto). Trocaram contato. Saíram depois. Conexão
      real. Namoraram (à distância no começo, ela em Praga, ele em
      Lisboa). Ele eventualmente se mudou pra Praga (República
      Tcheca) pra morar com ela.

      Casal cita exemplo de "mulher wife material" (feminina,
      cuida, cozinha, não é feminista). Ela espera masculinidade
      dele (irrita se ele procrastinar, espera ele prover, decisão
      em casa). Ele cita ela como prova viva de que mulher de valor
      EXISTE e o canal certo de aquisição é Cold Approach + Ciclo
      Social.
    lessons:
      - "Cold Approach é o ouro pra acessar mulher de valor que outros canais não dão"
      - "Mulher de valor não usa Tinder, não fica em balada, não responde DM aleatória"
      - "1v1 (sem competição) é o ambiente onde a comunicação ganha"
      - "Mulher feminina exige homem masculino — não é estereótipo, é dinâmica funcional"
      - "Casal feminina + masculino funciona melhor que casal andrógino"
    source_refs:
      - "Como_Achar_uma_Mulher_de_Valor_na_era_da_PUT4RIA"
      - "Como_Retomar_Sua_S3xual_Depois_de_Anos_em_um_Relacionamento_passo_a_passo"
      - "Como_Sair_Do_ZERO_e_Marcar_1-2_Encontros_Toda_Semana_Depois_De_Um_Termino_Guia_Definitivo"

  - id: aluno_lucas_transformacao
    title: "O Aluno Lucas — De Magrelo Tímido a Casanova"
    narrative: |
      Lucas é exemplo recorrente nos vídeos de venda. Cara descrito
      como "magrelo, óculos de tia Cleide, óculo maior que a cara,
      franzino". Saiu do Brasil sem se relacionar com mulher,
      achando que problema era "as brasileiras". Rodou Europa
      inteira tentando — não conseguia.

      Procurou Vilaverde. Aprendeu o método completo (VIBE — Value
      Interaction Behavior Execution). Aplicou teasing, flirting,
      cold approach, ciclo social. Resultado: passou a se relacionar
      com mulheres do Brasil, Europa, Ásia. Vilaverde mostra os
      vídeos do Lucas pra provar que o método funciona PRA QUALQUER
      UM — não só pro Vilaverde que tem traço "bonito".
    lessons:
      - "Método funciona pra cara médio/feio — não depende de beleza, shape, dinheiro"
      - "Pegar mulher é matemática (volume x conversão) + técnica"
      - "Antes do método: cara culpa 'as brasileiras', 'as gringas', a sorte"
      - "Após método: cara entende que a culpa era da própria comunicação"
      - "Caso usado como prova social anti-genética/anti-VSM"
    source_refs:
      - "Como_Conquistar_Mulheres_Extremamente_Bonitas_Faca_Parte_Dos_1"
      - "Isso_Define_Se_Uma_Mulher_Vai_TR4NS4R_Com_Voce_Ou_Nao_baseado_na_psicologia_feminina"

  - id: cliente_bom_comunicador_mas_sem_volume
    title: "O Mentorado Bom de Papo Mas Sem Volume (Caso da Onboarding Call)"
    narrative: |
      Vilaverde atendeu cliente recente. Cliente pagou mentoria.
      Em 15 minutos de call, Vilaverde percebeu: cara conversava
      muito bem com ele. Voz cadenciada, perguntas inteligentes,
      teasing leve com o próprio Vilaverde. Cara era um excelente
      comunicador.

      Vilaverde perguntou: "Qual é o seu problema, cara?" Cliente
      reconheceu que sabia ser bom em papo — todas as mulheres que
      ele conversava ele "conseguia flertar". Vilaverde pensou:
      "Então qual é o problema?"

      Descobriu: o cara não tinha Tinder (achava Tinder coisa "pra
      puta"), Instagram dele era praticamente inexistente (ele se
      considerava "low profile"), só pensava em trabalho/faculdade
      como ciclo social, e tinha vergonha de Cold Approach. Tinha
      ALTA conversão mas ZERO volume.

      Ajustes simples: arrumar Instagram, tirar boas fotos pro
      Tinder, entrar em ciclo social (boxe). Em menos de um mês,
      passou a ter pelo menos 1 encontro por semana. Em 5 meses,
      tava namorando.
    lessons:
      - "Volume > Conversão. Cara ótimo de papo sem volume = nada"
      - "Cliente médio acha que precisa MELHORAR conversação — mas o gap é VOLUME"
      - "Ajustes infraestruturais (Instagram, Tinder, ciclo social) são quick wins"
      - "Diagnóstico errado de cliente avançado: ele pensa que é problema de comunicação, é volume"
    source_refs:
      - "O_que_eu_aprendi_abordando_1000_mulheres"

  - id: nerd_sedutor_treta
    title: "A Treta com Nerd Sedutor (Posicionamento Crítico do Mercado)"
    narrative: |
      Rafael Albano, conhecido como Nerd Sedutor, é um produtor de
      conteúdo de sedução brasileiro mais velho (10+ anos de
      mercado), casado há 9-10 anos. Em um vídeo, Nerd Sedutor
      criticou indiretamente Vilaverde (chamando ele de "Sedutor
      Zinho", borrando rosto em vídeo de venda, falando de "coaches
      fuleiros"). Vilaverde reagiu fazendo análise vídeo a vídeo
      (40+ minutos).

      Posicionamento de Vilaverde: ele admira Rafael, reconhece que
      Nerd Sedutor é exímio em TEORIA, casado há anos (respeitável).
      Mas crítica: Nerd Sedutor "nunca saiu pra rua pra aplicar". Só
      ensina sentado no sofá. Vilaverde se posiciona como o cara que
      foi pra prática, gravou tudo, documentou 1000+ abordagens em
      vários países.

      Posicionamento meta-mercado: existem "produtores de teoria"
      (Nerd Sedutor, gurus de redpill) e "produtores de prática"
      (Vilaverde, Gustavo Gambit, Fê Alves, Coach Caio). Os dois têm
      papel — o teórico ensina o feijão com arroz, o prático prova
      que funciona. Mas o prático tem autoridade que o teórico não
      tem.
    lessons:
      - "Diferenciação no mercado: teórico vs aplicado"
      - "Vilaverde se posiciona como 'cara que provou na prática'"
      - "Tretas com concorrentes maiores podem gerar visualização (estratégia consciente)"
      - "Manter respeito pessoal (Rafael como pessoa) mas atacar a posição (Nerd Sedutor como classe)"
      - "Don't hate the player, hate the game: Vilaverde admite que ele também usa estratégia comercial"
    source_refs:
      - "Nerd_Sedutor_falou_mal_de_mim_REAGINDO_AO_EXPOSED"

  - id: hater_no_instagram_e_o_clube_do_livro
    title: "O Hater 'Cristino Diego' (Manifesto Anti-Crença Limitante)"
    narrative: |
      Um cara chamado Cristino Diego fez um vídeo viral no
      Instagram zoando Vilaverde — chamou ele de "nerd", "jogador
      de League of Legends", "dono de clube do livro", disse que
      "ele nunca viu uma buceta na vida". Vídeo viralizou.

      Vilaverde reagiu publicamente. Ponto a ponto: (1) admitiu que
      ele jogava LoL e era nerd; (2) admitiu que não nasceu pra
      isso; (3) MAS — argumentou que se TIVESSE aceitado seu
      "lugar" (como o Diego sugeria), nunca teria saído do Brasil
      aos 17, nunca teria abordado +1000 mulheres, nunca teria
      construído empresa, nunca teria 20k+ alunos.

      Frase-chave: "Saber o seu lugar é covardia. O fato de eu não
      saber meu lugar é o que me trouxe aqui." Posicionamento contra
      identidade limitante. "Você não é tímido, você ESTÁ tímido."
      Estado vs essência.
    lessons:
      - "Identidade limitante ('eu sou X') trava potencial"
      - "Mudar 'ser' pra 'estar' libera psicologia de mudança"
      - "Crença limitante mais comum: 'sou tímido pra sempre'"
      - "Combate ao 'saber o seu lugar' — frase usada por gente acomodada"
      - "Origens humildes não são limite — são prova social"
    source_refs:
      - "MASSACR_ANDO_UM_HATER_QUE_DISSE_QUE_SEDUCAO_NAO_FUNCIONA"
      - "Me_de_13_minutos_e_eu_vou_APAGAR_seu_medo_de_chegar_em_mulher"

  - id: 200_gringas_em_londres_portugal
    title: "Os +200 Encontros e +1000 Abordagens (Prova Social Mestre)"
    narrative: |
      Vilaverde se posiciona como "único brasileiro que rodou o
      mundo e pegou gringa de tudo que é país". Lista os países
      onde se relacionou com mulheres: Polônia, Rússia, República
      Tcheca, Alemanha, Itália, Espanha, França, Inglaterra, Ucrânia,
      Turquia, Suíça, Suécia, Hungria, Argentina, Estados Unidos,
      Canadá, e mais.

      Estrutura cronológica: 17 anos saiu do Brasil pós-burnout. Em
      Londres, trabalhou como bartender. Conheceu cara em balada que
      "passava o rodo" — esse cara virou mentor informal. Vilaverde
      começou a estudar e aplicar sedução. Documentou TUDO no
      Instagram e YouTube (vídeos com mulheres reais, abordagens,
      pegação, etc).

      Cláim de volume: 1000+ abordagens em 3 anos, 300+ dates, 200+
      mulheres relacionadas. Tudo gravado pra prova social.
      Atualmente mora em Praga (República Tcheca), namora há quase 2
      anos com uma tcheca.

      Usa esse histórico como autoridade central — não é só teórico
      (como Nerd Sedutor), é cara de campo provado.
    lessons:
      - "Documentação massiva (Instagram + YouTube) = autoridade"
      - "Volume gera dados pra encontrar padrões (1000 abordagens identificam o que funciona)"
      - "Internacionalidade (mulheres de 20+ países) prova que método não depende de cultura"
      - "Origin story 'burnout aos 17 → Londres → rodar mundo → método' é narrativa de marca"
      - "Vilaverde vende 'eu fiz isso, posso te ensinar' (vs Nerd Sedutor que vende 'eu estudei isso')"
    source_refs:
      - "4_Habitos_que_me_fizeram_pegar_+200_GRINGAS"
      - "O_que_eu_aprendi_abordando_1000_mulheres"
      - "Como_Sair_Do_ZERO_e_Marcar_1-2_Encontros_Toda_Semana_Depois_De_Um_Termino_Guia_Definitivo"

  - id: relacionamento_brasileiro_passado
    title: "O Relacionamento Brasileiro do Gado (Antes da Transformação)"
    narrative: |
      Antes de sair do Brasil, Vilaverde tinha 17-18 anos e namorava
      há 2 anos. Dentro desse relacionamento, ele era "o cara
      bonzinho demais" — dava tudo financeiramente (era muito novo
      mas tocava empresa grande), dava amor, afeto, segurança, e não
      recebia em troca. Era o gado clássico.

      Resultado: burnout. Mente parou, ficou de cama, não conseguia
      nem levantar pra ir no banheiro. Família foi buscar — propôs
      3 meses em Londres com eles. Aceitou. Lá começou tudo.

      Depois de Londres, foi pego pelo discurso redpill. Quando se
      mudou pra Europa, chegou em modo redpill puro — não elogiava
      mulher, tratava mal, "VSM, mulheres são tudo igual". MAS lá
      ele descobriu que essa narrativa também não funcionava — as
      gringas (especialmente britânicas, francesas) buscam
      gentleman, não bruto. Precisava de algo no MEIO.

      Esse meio termo se tornou o Método Vila Verde: teasing +
      flirting como pico de emoção balanceado.
    lessons:
      - "Vilaverde já FOI gado E já foi redpill — método é antítese de ambos"
      - "Burnout do gado: dar tudo sem receber gera colapso físico"
      - "Redpill puro também não funciona — extremos perdem"
      - "Método é equilíbrio: 2T 1F, ser forte + ter vulnerabilidade no momento certo"
      - "Origem pessoal vira credibilidade — 'já passei por isso'"
    source_refs:
      - "4_Habitos_que_me_fizeram_pegar_+200_GRINGAS"
      - "O_SEGREDO_pra_flertar_sem_colocar_ela_no_PEDESTAL_Na_pratica"
