case_studies:
  - id: case_australia_solo_trip
    title: "Aproximações na Austrália — Volume Game em Idioma Próprio"
    narrative: |
      Erick viaja sozinho pra Austrália (vídeo mais longo do canal, ~29min)
      e roda o jogo de aproximação dele em country novo. Aborda mulheres
      australianas com o mesmo script de Miami: 'I'm reporting live in
      Sydney with...', 'question of the night', number close. Particular
      desse caso: Austrália tem ambiente cultural MENOS receptivo a cold
      approach que Miami (australianos têm menos contato com persona
      reporter-style), mas ele ainda fecha números — porque o frame de
      câmera + persistência supera o filtro cultural local. O ROI é
      menor por interação, mas conversão existe.
    lessons:
      - "Frame Erick é exportável — funciona fora de Miami mesmo com cultura diferente"
      - "Volume + câmera = converte em qualquer lugar com mulheres caminhando em público"
      - "Em ambiente menos receptivo, aceitar taxa de conversão menor é o trade-off válido"
      - "Cara que viaja sozinho atrás de aproximação tem confiança que SE projeta no jogo"
    source_refs:
      - "PICKING_UP_GIRLS_IN_AUSTRALIA"

  - id: case_3000_dollar_batman_costume
    title: "Fantasia Batman de $3000 — Persona-Prop em Halloween Miami"
    narrative: |
      Halloween 2024, Erick veste uma fantasia oficial de Batman comprada
      pelo pai (motorcycle leather suit + máscara + cape, custou
      ~$3000). Calor brutal, ele sua dentro da fantasia, mas ABORDA com a
      persona full ('I'm Batman, where is she, where's Rachel?'). Vai
      pra ambientes de festa noturna em Miami (Wynwood, Brickell). O
      prop carrega o approach todo — mulheres engajam com Batman antes
      de processar que tem um cara real por trás. Ele consegue múltiplos
      números, IGs, fotos, e uma 'date pra back to the Batcave'. Cada
      interação dura <60s porque o costume gera engajamento instantâneo
      em todo lugar.
    lessons:
      - "Investimento sério em prop ($3000) sinaliza commitment cômico — mulheres respondem ao commit"
      - "Persona absurda dá licença pra ser intenso ('I'm Batman') que cara comum não tem"
      - "Halloween/eventos temáticos são MUDANÇA DE FRAME — comportamento aceitável muda"
      - "Quebrar a persona (mostrar o rosto sem máscara) é uma escalada — usa só quando ela pede"
    source_refs:
      - "PICKING_UP_GIRL_S_IN_MY_3_000_DOLLAR_COSTUME"

  - id: case_calendar_pencil_asu
    title: "Calendário + Lápis Gigante em ASU — Prop Comprometimento"
    narrative: |
      Arizona State University, Erick chega com calendário gigante de
      parede + lápis tamanho braço (do TikTok shop). Aborda mulheres no
      campus dizendo 'I had to ask, what are you doing on Friday the
      13th?'. Tira o calendário, pede pra ela segurar (envolvimento
      físico), e propõe marcar uma date. O prop faz 3 coisas
      simultâneas: (1) gera curiosidade visual a 10m de distância, (2)
      dá pretext lúdico pra approach, (3) embute o ask de número/date
      DENTRO do prop. Mulheres seguram o calendário, escrevem nome
      próprio nele, perguntam detalhes da date — engajamento total.
      Conversion rate aparente: 70%+ das mulheres abordadas dão número
      ou Instagram.
    lessons:
      - "Prop ridículo + commit ridículo = conversão alta em campus universitário"
      - "Passar o objeto pra ela segurar cria cooperação física (yes-set kinesthetic)"
      - "O ask de número fica DISFARÇADO dentro da mecânica do prop"
      - "Justificativa do prop ('my sister gave me this') é importante — sem ela, parece psicopata"
    source_refs:
      - "PICKING_UP_GIRLS_WITH_MY_BIG_A_CALENDER_PENCIL"

  - id: case_fake_tickets_too_sexy
    title: "Tickets Falsos na Praia — Frame de Autoridade Lúdica"
    narrative: |
      Colab com Crew Aesthetics + Language Lord. Erick e equipe imprimem
      tickets falsos com cara de oficial (logo de praia, $150/$250 fine)
      e abordam mulheres dizendo 'I just got a call from my supervisor,
      I have to issue you a ticket for being too sexy on the beach'.
      Quando ela pergunta o motivo: 'you're making everyone look bad, you
      can't be doing that'. Termina com 'the ticket can be revoked if
      you text me, my number's on the back'. Várias mulheres entram na
      brincadeira, pegam o ticket, riem, escrevem número, guardam pra
      'memórias'. Algumas saem com namorado e ainda assim aceitam a
      brincadeira ('this is hilarious, I'm keeping this'). Material
      físico (ticket) fica com elas = recall maior. Erick também usa
      pra friend-zone reverse — quando ela coloca ele na friendzone, ele
      brinca 'friend zone, let's do it, but once you're in the friend
      zone you're always in the friend zone'.
    lessons:
      - "Frame de autoridade falsa = pretext absurdo que dá licença pra ser direto"
      - "Material físico (ticket) cria object permanence — ela leva pra casa = lembrança"
      - "Grupos = efeito coletivo amplifica engajamento (uma ri, todas riem)"
      - "Quando ela friendzona, brinca de volta sem desistir — pode reabrir"
    source_refs:
      - "Giving_girls_TICKETS_for_being_too_sexy_on_the_beach"

  - id: case_astrology_reverse_rejection
    title: "Rejeitar pela Astrologia — Inversão de Frame como Treino"
    narrative: |
      Vídeo conceitual: em vez de tentar fechar números, Erick aborda
      mulheres e propositalmente REJEITA elas via signo astrológico. Pede
      o número, pergunta o signo, e responde 'Virgo? Oh hell no, we
      would not be compatible, I'm sorry, bye'. Algumas ficam abismadas
      ('was this a TikTok?'), outras riem, outras MUDAM DE POSTURA e
      tentam continuar a conversa ('but wait, what if I'm high?'). O
      objetivo não é converter (e ele admite isso) — é treinar o
      músculo de SAIR ANTES de ser saído. E paradoxalmente, algumas
      mulheres que ele 'rejeitou' demonstraram mais interesse depois da
      rejeição do que demonstrariam se ele fechasse normal. Lesson: a
      pessoa que tem o poder de SAIR é a pessoa de alto valor. Mostrar
      que você sai = elevação automática de status.
    lessons:
      - "Sair antes de ser saído é treinamento de músculo de alto valor"
      - "Inversão de frame ('eu rejeito você') gera curiosidade pós-interação"
      - "Mulher de alto valor é acostumada a aprovar/rejeitar — quando o jogo inverte, ela engaja"
      - "Use como TREINO, não como técnica primária de conversão"
    source_refs:
      - "Rejecting_girls_because_of_their_ASTROLOGY_SIGN"

  - id: case_dc_university_revenge_tour
    title: "George Washington University — Voltando Pro Berço da Carreira"
    narrative: |
      Erick volta a Washington DC, onde 'tudo começou' (ele é da Virginia,
      Nova). Aborda mulheres na GWU com a linha 'I'm 6 feet, can I get
      your number?' como pretext-survey. Em ~15 abordagens filmadas: 5
      passam número (~33% conversão), 4 dizem 'tenho namorado', 6 dão
      Instagram ou negam. O ponto narrativo: ele faz isso por
      nostalgia, mas a técnica continua funcionando. Particular: ele
      menciona em voiceover que 'eu também tinha braces, cabelo ruim,
      sem skills sociais — vi um YouTuber fazendo isso e tentei. Mudou
      tudo'. Caso prova: técnica não depende de looks pré-existentes,
      depende de exposição + reps.
    lessons:
      - "Cold approach é skill ensinável — não precisa de aparência prévia"
      - "Volume + script simples = conversão estável (~30% em ambiente friendly)"
      - "Repetir abordagem treina baseline emocional pra rejeição"
      - "Cara que começou tímido + ugly conseguiu — não há barreira de entrada real"
    source_refs:
      - "I_m_6_feet_can_I_get_your_number"
      - "How_to_transform_your_dating_life_in_just_90_days"
