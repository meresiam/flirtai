case_studies:
  - id: pao_de_queijo_uberlandia
    title: "O Date Tinder em Uberlândia (Caso da Mineira)"
    narrative: |
      Krausche viajou pra Uberlândia pra um evento, sem conhecer
      ninguém. Foi desafiado pelos amigos a abrir conversa no Tinder
      com 'oi tudo bem' — o opener que ele mais critica. Mesmo assim,
      ela respondeu. Em vez de cantada genérica, ele analisou o
      perfil: bio dizia 'goiabada com queijo é melhor que Nutella',
      ela era Libriana, ensino superior completo, gostava de viajar,
      gastronomia e Netflix.

      Quando ela puxou conversa brincando que 'pão de queijo de SP
      pode ser arma branca', ele entrou no jogo: contou que pediu pão
      de queijo na padaria Vila Carioca (lugar específico, conhecido
      na cidade), declarou que 'nunca mais como o de SP' e plantou
      'vou ter que voltar aqui sempre' — gatilho de antecipação.

      Adicionou 'goiabada com queijo é bom também, com um vinhozinho'
      (chamada de date implícita). Quando ela mencionou queijo de
      trança e empada, ele subiu pra 'tem três coisas que eu quero
      experimentar aqui: queijo, trança e empada' (gatilho de
      curiosidade — não falou a terceira). Quando ela perguntou qual
      a terceira: 'você gosta de escrever? Porque a nossa história
      não vai terminar nunca' — virou pra cantada lúdica.

      Fechou: ela mencionou 'tudo tem início, meio e fim' e ele
      reescreveu: 'no nosso caso a gente vive o início, planeja o
      meio e não pensa no fim'. Pediu WhatsApp depois de 30 min de
      conversa. Saiu com ela no dia seguinte.
    lessons:
      - "Análise prévia de perfil > improviso cego — biografia, destaques e localização viraram munição"
      - "Gatilhos mentais (antecipação + curiosidade) plantados em diferentes turnos da conversa, não amontoados"
      - "Mesmo opener ruim ('oi tudo bem') pode ser recuperado se os próximos turnos forem específicos e provocativos"
      - "Cantada como pivô (não como produto): ele sai pra cantada nos momentos certos, sempre dentro do contexto"
      - "Pedir WhatsApp DEPOIS de calor estabelecido — não em conversa fria"
    source_refs:
      - "CONHECI_A_MENINA_MAIS_LEGAL_DO_MUNDO_PELO_TINDER_-_MARQUEI_UM_ENCONTRO_USANDO_O_METODO_DESENROLADO"

  - id: balao_em_floripa_namorada
    title: "Bora Andar de Balão? (Primeiro Date com a Luana)"
    narrative: |
      A Luana (que viria a ser namorada dele) era seguidora do
      Instagram dele. Vivia em cidade diferente de Floripa,
      'sei lá, uma hora e meia' de distância. Os dois conversavam só
      por Instagram, sem trocar número.

      Numa quinta-feira normal, Krausche mandou pra ela: 'bora andar
      de balão?'. Ela: 'ah, não tô fazendo nada, vou'. Ele estabeleceu
      janela: 'você tem que estar aqui até tal horário'. Ela topou,
      foi pra Floripa.

      Só passaram contato (WhatsApp) na HORA do encontro, porque o
      celular dele estava acabando bateria e precisava enviar
      contato. Depois do balão, foram pra house (festa). 'A gente
      criou uma conexão muito forte porque a gente é muito parecido
      em muitas coisas. Parecia que a gente já se conhecia há muito
      tempo.'
    lessons:
      - "Você não precisa pedir WhatsApp pra desenrolar — direct funciona"
      - "Atividade inusitada (balão > restaurante) é convite-pivô que quebra padrão e gera resposta"
      - "Mensagem de chamada CURTA + direta funciona quando há conexão prévia (mesmo só via stories)"
      - "Distância geográfica não é obstáculo se a proposta é boa o suficiente"
      - "Similaridade real ('a gente é parecido') consolida — calibrar dates pra atividades onde você é genuinamente bom/curte"
    source_refs:
      - "O_SEGREDO_COMPLETO_PARA_DESENROLAR_POR_MENSAGEM"

  - id: robo_desenrolado_arena_pos_jogos
    title: "Robô Desenrolado na Festa Universitária (Aluno João Grilo)"
    narrative: |
      Krausche lançou o 'Robô Desenrolado' — automação de IA via
      WhatsApp que dá sugestões de abordagem em tempo real. Pra
      demonstrar, levou um seguidor (João Grilo) pra festa
      universitária da Arena Pós-Jogos. Desafio: João tinha que
      usar o robô pra abordar mulheres sem beber álcool.

      O Grilo perguntava ao robô coisas como 'como me soltar na
      balada' e 'cantada pra mina'. O robô respondia com sugestões
      de abertura, e o Grilo experimentava ao vivo. Durante a noite,
      ele beijou múltiplas mulheres ('nível de aproveitamento 100%,
      não tomou nenhum fora') sem ter bebido um gole de álcool.

      Em paralelo, Krausche abordava também. Em alguns momentos
      Grilo aplicou cantadas situacionais (tatuagem de árvore →
      'árvore genealógica') e Krausche usou variações da própria
      ('cuidar do meu coração' pra médica, 'resolver nosso caso' pra
      cara de advogada).

      Em uma das interações, mulher apresentou Krausche como
      cunhado (a irmã tinha ficado com ele antes) — ele recuperou
      a interação fazendo brincadeira, sem perder o frame.
    lessons:
      - "Método > álcool: prova ao vivo que reps com framework substituem coragem química"
      - "Cantada situacional > cantada decorada — usar elemento real do alvo (tatuagem, profissão aparente, look) vira leve"
      - "Quem tem ferramentas (no caso, o robô) tem confiança pra agir — confiança vem do PREPARO, não da personalidade"
      - "Frame recuperável: situações estranhas (cunhado, mulher já conhecida) podem virar piada se você não congela"
      - "Volume + leitura de sinais = altas conversões. Não é skin, é skill aplicada com método"
    source_refs:
      - "LANCEI_O_ROBO_DESENROLADO_E_LEVEI_UM_SEGUIDOR_PARA_TESTAR_NA_FESTA_UNIVERSITARIA_-_ARENA_POS_JOGOS"

  - id: ex_namorada_descartei_a_outra
    title: "Voltei Com a Ex, Quebrei o Coração da Outra (Auto-Crítica)"
    narrative: |
      Krausche conta caso pessoal: tinha terminado relacionamento
      com ex-namorada que ele amava. No intervalo, conheceu outra
      menina, 'maravilhosa, casaria com ela a qualquer momento se ela
      ainda me quisesse'. Ela o tratava bem, gostava dele.

      Mas Krausche estava usando a nova como tapa-buraco — sentia
      ainda muito pela ex. Quando a ex mandou 'vamos voltar?', ele
      voltou no automático. 'Descartei a menina que era maravilhosa,
      que me tratava super bem, pra voltar pra minha ex que eu sabia
      que não ia dar certo'. Terminou de novo com a ex seis meses
      depois.

      Lição que ele tirou: 'se você se envolver com uma pessoa que
      ainda gosta do ex, sua única função vai ser tapar o buraco e
      ser descartado a qualquer momento. E como a pessoa fez isso
      comigo, eu fiz com outra'.
    lessons:
      - "Quem usa o outro como tapa-buraco vira tapa-buraco eventualmente — espelhamento ético"
      - "Pós-término exige período de reconstrução solo antes de envolver alguém. Pular essa fase machuca ambas as partes"
      - "Procurar parceira que esteja BEM consigo mesma > parceira que precisa de você. Necessidade não é amor."
      - "Krausche tem auto-crítica visível aqui — admite ter sido o vilão da história. Raro no corpus dele"
      - "Sinal de RED FLAG estrutural: mulher que precisa muito demais (carente, recém-terminada, ainda gostando do ex) vai te descartar quando a 'crise dela' passar"
    source_refs:
      - "ELA_ACABOU_DE_TERMINAR_COM_O_EX_O_QUE_FAZER_-_SE_LIVRE_DA_DEPENDENCIA_EMOCIONAL"

  - id: rejeicao_no_corinthians_aos_7_anos
    title: "Cortado do Corinthians aos 7 Anos (Construção de Resiliência)"
    narrative: |
      Antes de virar 'Desenrolado', Krausche era jogador de futebol.
      Clube do coração era o Corinthians. Aos 7 anos, fez primeiro
      teste profissional no clube — e foi cortado no primeiro dia
      ('você não serve pra jogar aqui'). 'Chorava, chorava, chorava'.

      Depois fez teste em 30+ clubes diferentes, fui rejeitado em
      todos. Em vez de desistir, deu passo atrás: foi pra clube
      amador, ganhou bagagem, até finalmente um clube profissional
      chamar.

      Quando parou com futebol, foi pra vendas. Aprendeu a matemática
      da rejeição: de 100 ligações, 90 nãos, 10 sims. 'Estagiário
      ligando pra CEO' — frase chave de mentor dele: 'a outra pessoa
      caga, tem problemas, ela já esteve no seu lugar. Tudo depende
      da forma em que você liga'.

      Essa virada virou base filosófica dele pra conquistar:
      rejeição é variável estatística do jogo, não veredito sobre
      seu valor.
    lessons:
      - "Resiliência é construída ANTES de você precisar dela — viver rejeição em jovem dá fundação"
      - "Rebaixar expectativa (Corinthians → clube amador → profissional) > parar — caminho indireto chega lá"
      - "Vendas é escola de rejeição — quem vende muito treina o emocional como ninguém"
      - "Frame de 'a outra pessoa também caga' = humanização do alvo intimidador, libera autenticidade"
      - "Auto-narrativa importa: você é 'estagiário ligando pra CEO' OU 'futuro CEO conversando com par'? A diferença está no tom"
    source_refs:
      - "APRENDA_A_LIDAR_COM_A_REJEICAO_E_AUMENTE_8X_SUA_AUTOESTIMA"

  - id: batidinha_no_vidro
    title: "A Batida no Vidro (Empatia Como Abordagem)"
    narrative: |
      Krausche tava na balada. Uma menina muito bonita atravessou
      uma porta de vidro sem ver — bateu a cara, ficou
      constrangida, galera ria. Ela tava lá apavorada de vergonha.

      Em vez de ignorar ou debochar como todo mundo, Krausche
      caminhou até a mesma porta de vidro e bateu a própria cabeça
      de propósito. Começou a rir alto, virou o foco da galera pra
      ele.

      Ela: 'cara, você é incrível, você é muito engraçado. Ninguém
      tinha chegado em mim assim de uma forma tão diferente e
      inusitada'. Acabaram ficando no rolê.
    lessons:
      - "Empatia gestual > empatia verbal — fazer A MESMA vergonha vale mais que dizer 'imagino como você se sente'"
      - "Mulher constrangida em público quer ser RESGATADA do constrangimento, não comentada sobre ele"
      - "Quebrar padrão social (todo mundo zoa, você não zoa) cria efeito heroico sem afetação"
      - "Cantada é desnecessária quando ação fala mais alto — gesto pode ser o opener completo"
      - "Princípio universal: 'os seres humanos precisam ser pertencentes a algum grupo'. Quando você sinaliza 'tô junto contigo', cria pertencimento imediato"
    source_refs:
      - "4_COISAS_QUE_VOCE_NUNCA_DEVE_FAZER_AO_CHEGAR_EM_UMA_MULHER"

  - id: brinco_de_cobra_colar_de_cobra
    title: "Brinco de Cobra (Conexão Por Acessório)"
    narrative: |
      Krausche conta de uma mulher muito bonita ('uma das mais
      lindas que eu já fiquei na minha vida') com quem ficou. Ela
      tava com brinco de cobrinha. Ele tava com colar de cobra (que
      ele costumava usar exatamente por isso — várias mulheres
      tinham tatuagem de cobra, então funcionava como gancho
      recorrente).

      Opener dele: 'Não é possível que você colocou esse brinco só
      pra combinar com o meu colar'.

      Ela: 'nossa, você é o primeiro cara que vi usando esse tipo
      de acessório'. Ele: 'alguém tem que ser estiloso, né?
      Inclusive, adorei o seu estilo. Aonde você se trocou? Não
      tinha luz, não?' (provocação imediata — quebra o elogio do 8
      ao 80).

      Ela: 'por quê? você não gostou do meu look?' (ela pedindo
      validação dele). Por coincidência, ela tava com tênis Nike
      Jordan, ele tava com Nike Jordan. 'Olha que louco, criei uma
      conexão imediata com ela.'
    lessons:
      - "Estilo identificável funciona como antena — atrai mulheres com gostos similares"
      - "Coincidência visual real (não inventada) é o melhor opener possível — conexão imediata sem esforço"
      - "Sequência opener: elogio do estilo (sem ser de beleza) + provocação imediata pra não virar paquera açucarada"
      - "Quando ela pede sua validação ('você não gostou?'), o jogo virou — agora ela está conquistando você"
      - "Acessório/peça pessoal não é vaidade, é dispositivo estratégico — 'o que eu uso atrai conversa'"
    source_refs:
      - "PERCA_O_MEDO_DE_CHEGAR_EM_MULHER_BONITA"
      - "AS_3_MELHORES_FORMAS_DE_ELOGIAR_UMA_MULHER"

  - id: bar_em_floripa_olhar_sustentado
    title: "Bar em Floripa (Olhar Sustentado)"
    narrative: |
      Final de semana, num barzinho (não era balada, era ambiente
      tranquilo). Uma menina muito bonita começou a olhar pra
      Krausche. Muito mesmo. 'Era linda. Tipo, uma das meninas que
      eu já queria ficar.'

      Em vez de desviar (instinto natural), ele sustentou. Ela
      sustentou também. Uns 3 segundos sem nenhum desviar. Pra não
      ficar sem graça, ele deu um sorrisinho. Ela sorriu de volta.

      Sem hesitar, ele foi falar com ela imediatamente. Opener:
      'você não vai ficar me olhando de longe e não vir falar
      comigo, né? Eu que tive que vir aqui falar com você?'

      Ela: 'eu sou tímida'. Ele: 'com esse sorrisão nem parece que
      você tem tanta vergonha. Mas sei lá, é bom que você já começou
      sorrindo, porque se você ficar comigo, sua vida inteira vai
      ser sorrindo.'
    lessons:
      - "Sustentar olhar = poder, desviar = inseguraça. A primeira reação é a mais difícil de treinar"
      - "Sorriso é o segundo nível de validação — depois de olhar sustentado, sorrir convida a fala"
      - "Velocidade importa: 'eu nem esperei ela terminar de dar o sorriso e já fui falar com ela'. Janelas de calor fecham rápido"
      - "Inverter frame: 'EU é que tive que vir' coloca ela na posição de quem fez você se mover (ela 'puxou' a interação)"
      - "Quando ela admite vergonha/timidez, NÃO trate como obstáculo — incorpore na conversa ('com esse sorrisão nem parece')"
    source_refs:
      - "OS_PRINCIPAIS_SINAIS_DE_ATRACAO_QUE_A_MULHER_DEMONSTRA_Linguagem_Corporal"

  - id: amigo_descobre_como_chega_em_mulher
    title: "Os Amigos Tímidos da Matinê (Origem do Método)"
    narrative: |
      Krausche conta: desde molequinho, ele 'desenrolava' nas
      matinês (baladas de menor com open bar de açaí). Amigos
      tímidos pediam pra ele ir falar com as meninas que eles
      queriam. Krausche ia, conversava, brincava — e descobria que
      no fim ELE virava o de interesse das meninas.

      'Pô, mas você é tão legal, você é tão bonito. Seu amigo também
      é bonito, mas eu queria ficar com você porque a gente já
      conversou. Se ele vier conversar comigo, vou ter que falar
      tudo de novo'. Ou seja: investimento de conversa criava
      preferência.

      Krausche começou a perceber padrão e a ensinar pros amigos
      'COMO chegar'. Em vez de fazer por eles, virou guia. Foi a
      semente do que viraria 'Método Desenrolado' anos depois.
    lessons:
      - "Conversação é investimento — a pessoa em que ela INVESTE conversa, ela quer (sunk cost emocional)"
      - "Beleza atrai, conversa converte. Cara bonito que não fala perde pra cara médio que tem assunto"
      - "Tempo + atenção criam preferência. Por isso 'ela ficou com seu amigo feio depois de você não ter coragem' — ele desenrolou enquanto você travava"
      - "Origem honesta de método: alguém que naturalmente sabia tentando explicar o que fazia inconscientemente"
      - "Cada cara tímido tem um amigo desenrolado — se você não tem, vire seu próprio (ou pague pra aprender o framework)"
    source_refs:
      - "PERCA_SUA_TIMIDEZ_DE_UMA_VEZ_POR_TODAS..._-_Aula_do_curso_Alem_da_Conquista"
