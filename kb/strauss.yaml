# ============================================================
# BLINDSPOTS
# ============================================================
blindspots:
  - "Estética/fitness/biohacking — Strauss não fala quase nada sobre construção de presença FÍSICA (corpo, voz, postura). Para FlirtAI complementar com material de quem cobre essa dimensão."
  - "Hierarquia de status masculina entre homens — Strauss é todo sobre dinâmica homem-mulher, mas pouco sobre dinâmica homem-homem (Greene cobre isso melhor)."
  - "Dinheiro como vetor — Strauss minimiza 'money/status' como entry ticket, mas em mercado de mating real (especialmente BR top-tier), capital e capacidade financeira pesam mais do que ele admite."
  - "Aplicabilidade fora do contexto americano/coastal — Mystery Method foi calibrado pra bar/balada urbana USA dos anos 2000. Validade pra Brasil 2026 (cultura, religião, jeitinho) precisa adaptação."
  - "Manipulação consciente entre 2 jogadores informados — Strauss declara isso 'spiritually wrong'. Mas relações reais em mercado de seleção feminina BRASILEIRO 2026 têm jogo de ambos os lados. Tratar como 'errado' é ingenuidade."
  - "Casos onde a mulher ESTÁ jogando — Strauss tende a interpretar comportamento feminino como autêntico/ferido, raramente como estratégico. FlirtAI precisa balanço (Greene's seductress archetypes complementa)."
  - "Curto prazo vs longo prazo — Strauss late phase é todo sobre relacionamento longo. Para usuário FlirtAI focado em hookup/casual, princípios late phase podem soar morais demais. Manter separation."
  - "Dating apps modernos (Tinder/Bumble/Hinge/apps brasileiros) — Strauss menciona en passant, sem playbook específico de mensagem. Gap a ser preenchido por outros minds."
  - "Geração Z digital natives — Strauss é Gen X. Linguagem, refs e dinâmicas TikTok/OnlyFans/parasocial só entram superficialmente. Outro mind precisa cobrir."
  - "Espiritualidade aplicada — embora cite 'connected detachment' e 'spiritually wrong', Strauss não desenvolve framework espiritual robusto. Filosofia ocidental + alguns nudges budistas, sem profundidade."
