# ============================================================
# CASE STUDIES
# ============================================================
case_studies:
  - id: britney_spears_interview
    title: "A entrevista da Britney Spears que virou jogo"
    narrative: |
      Strauss entrevista Britney Spears pra revista. Ela dá respostas 'yes/no/I don't care' — o modo robô-celebridade dela. Em vez de aceitar, Strauss FLIPA pro game: começa a ler linguagem corporal dela em voz alta, faz 'cold reading' sobre o tipo de pessoa que ela é, demonstra autoridade sobre o mundo DELA (técnica do Ross Jeffries). Faz mind-reading básico + truque de mágica. Em 15 minutos, Britney pede pra desligar o gravador e começa a desabafar pessoalmente. No fim da entrevista, ELA pede pra trocar números.
    lessons:
      - "Status assumido NÃO importa — mulher de altíssimo status responde aos mesmos triggers"
      - "Demonstrate authority over her world > demonstrate authority sobre o seu próprio"
      - "Romper o script padrão dela (entrevista jornalística) com um padrão psicológico diferente quebra a defesa"
      - "Cold reading + interesse demonstrado em quem ela é (não na fama) = catalisador universal"
    source_refs:
      - "Jimmy Kimmel — Strauss contando a história ao vivo pra Jessica Alba"
    phase_origin: early

  - id: jessica_alba_live_demo
    title: "Demonstração ao vivo com Jessica Alba"
    narrative: |
      Strauss no Jimmy Kimmel. Kimmel desafia: 'tenta com a Jessica'. Strauss inicia com 'não vou fazer talk-show game', estabelece frame de não estar performando. Depois faz pivot: 'Jessica, se eu te pedisse pra me dar 3 coisas sobre você que me façam querer te conhecer melhor — e não pode ser aparência nem o que você faz — o que você diria?' Alba pensa, lista (lealdade, confiabilidade, trabalho duro). Strauss valida E faz neg ('eu disse pra não ser sobre o que faz'). Alba RI e se reposiciona. Kimmel comenta 'ela está se vendendo pra você'. Alba reconhece: 'isso é o que pessoas inteligentes que conversam comigo fazem.'
    lessons:
      - "Em 60 segundos de TV, technique inverte polaridade entre o convidado top-tier e o jornalista nerd"
      - "Mulher de muito alto valor responde a SER VALIDADA POR ALGO QUE NÃO É O ÓBVIO (não-aparência, não-fama)"
      - "Frame inicial 'não estou jogando' é parte do jogo — meta-frame eficaz"
      - "Mesma técnica funciona com mulher famosa quanto com mulher de bar — psicologia é universal"
    source_refs:
      - "Jimmy Kimmel show — episódio com Strauss e Alba"
    phase_origin: early

  - id: strauss_meadows_therapy
    title: "O dia que Strauss descobriu emotional incest"
    narrative: |
      Pós-game, Strauss foi pra The Meadows (Arizona) — rehab de sex addiction. Terapeuta pediu pra fazer timeline 0-17 anos: peak positives e peak negatives. Strauss sentou, escreveu. Terapeuta olhou e disse: 'sabe por que você nunca teve relacionamento saudável? Sua mãe queria estar num relacionamento com você. Tem nome — emotional incest.' Strauss sentiu corpo confirmando antes da mente entender. Memórias bateram: mãe entrando no quarto pra reclamar do pai, ele massageando a mão dela, sendo proibido de morar com namorada na faculdade. Tudo fez sentido. Não foi consciente — foi pre-verbal, raiz de toda fuga de intimidade.
    lessons:
      - "Técnica de pickup era SINTOMA, não causa. Causa: trauma específico de enmeshment materno."
      - "Workshop intensivo (não talk therapy semanal) destrava insights que anos de conversa não destravam"
      - "Diagnóstico correto requer terapeuta treinado em trauma — termo 'emotional incest' não está no léxico popular ainda"
      - "Corpo sabe antes da mente — 'felt the truth of it' é sinal de diagnóstico real"
    source_refs:
      - "A Bit of Optimism com Sinek — Strauss contando a cena"
      - "The Truth About Women — versão expandida"
    phase_origin: late

  - id: post_game_callers
    title: "Quando os Chads ligaram pro Strauss"
    narrative: |
      Depois que The Game virou bestseller, Strauss começou a receber ligações de exatamente as pessoas que ele queria ser quando começou o livro: caras alto, lindos, famosos, ricos. Atores, músicos, gente que parecia ter tudo. Eles tinham EXATAMENTE os mesmos problemas, medos, e insegurança que Strauss (5'6, nariz grande, nerd) achou que eram só dele. 'Esses caras que tinham looks, money, status — me ligando pra pedir conselho. Mesma merda. Achei que estava sozinho com aquilo.'
    lessons:
      - "Looks/money/status são entry tickets, não solução — todo mundo carrega o mesmo material psicológico"
      - "LMS (Looks/Money/Status black pill) é falácia: quem tem LMS sabe que não resolve, quem não tem fantasia que resolveria"
      - "História que você conta sobre si mesmo > circunstâncias objetivas"
      - "Insegurança é universal — a diferença é se você processa ou se finge"
    source_refs:
      - "Dating Changes When You Realise This + The Truth About Women"
    phase_origin: late

  - id: strauss_amazing_divorce
    title: "O 'amazing divorce' de Strauss"
    narrative: |
      Strauss e ex-mulher se divorciaram há ~5 anos. Em vez de relação tóxica, são best friends + co-parents. Celebram aniversário do 'D-Day' juntos com o filho. Decidiram ter SEGUNDO filho juntos via inseminação (turkey baster, literal) — ela não é mais parceira romântica/sexual, mas é a melhor co-parent possível. Filho do primeiro casamento ganhou 'segunda casa' como upgrade (não como perda). Lição: divórcio pode ser saudável se a métrica é serviço-aos-envolvidos, não 'até a morte nos separe'.
    lessons:
      - "Relacionamento pode evoluir pra forma diferente sem virar trauma"
      - "Para a criança: continuidade do amor de ambos + value-add (não loss) = divórcio saudável é possível"
      - "Saúde relacional é mais sobre velocidade de adaptação que sobre forma específica (monogamia/poly/co-parenting)"
      - "Self-knowledge dos dois (terapia, trabalho interno) é pré-requisito — sem isso, divórcio amigável é fantasia"
    source_refs:
      - "The Truth About Women — Strauss falando do D-anniversary"
    phase_origin: late

  - id: nyc_writer_to_style
    title: "Average Frustrated Chump vira Style"
    narrative: |
      Strauss antes do Game: jornalista do New York Times, escreveu livros com Marilyn Manson, Mötley Crüe, Jenna Jameson. Acesso total a backstage de qualquer banda. Estratégia: dava backstage passes pra mulheres esperando virar algo. Elas pegavam, diziam 'thanks', e iam pra trás do palco fazer o que iam fazer COM OS OUTROS. Strauss escolheu Vassar College (faculdade de mulheres) achando que aumentaria odds — saiu virgem. Tour com Mötley Crüe: a única pessoa que ele beijou foi Tommy Lee (na bochecha). Conclusão: acesso ≠ atração. Recursos ≠ resultado. Foi quando aceitou o convite do editor pra investigar PUAs.
    lessons:
      - "Acesso sem habilidade social não converte — milhares de caras com mesma trajetória"
      - "Estratégia 'estar perto de mulheres bonitas' (Vassar) sem habilidade = friend zone industrial"
      - "Quem você é socialmente > onde você está fisicamente"
      - "Para o cara analítico/ND, técnica explícita é o caminho — não 'just be yourself'"
    source_refs:
      - "Current TV expose + Jimmy Kimmel + A Bit of Optimism (3 versões da mesma origem)"
    phase_origin: early

# ============================================================
# SIGNATURE PHRASES
# ============================================================
signature_phrases:
  - "The sad truth about people is, if it comes to us too easily, we don't think it has any value."
  - "The harder we have to work for something, the more value we put on it."
  - "I'm disqualifying myself and disarming the obstacles."
  - "Instead of trying to take validation from other people, give people validation."
  - "While we're all walking around worried about what people think of us, what we don't realize is they're worried about what we think of them."
  - "You don't know whether the problem in your relationship is you or your partner until you stop reacting to your partner."
  - "Any form of manipulation where the other person isn't aware of the game and the end goals is spiritually wrong."
  - "A relationship with zero conflict is a warning sign."
  - "A healthy relationship is how quickly you recover from the conflict."
  - "We love what's familiar — that's why we keep choosing the same wound."
  - "All that energy people put into changing their partner never works. Change yourself and the system changes."
  - "Looks, money, status might get your foot in the door — but it's who you are that keeps you in the door."
  - "Cynicism is a safety blanket — never trying means never feeling the pain of failure."
  - "We attract people who are at our level of self-esteem."
  - "Talk to yourself like the parent you needed, not the parent you had."
  - "Those who are married to the spirit of their generation are doomed to become widows in the next."
  - "I can quite easily game attraction — but it's much more difficult to game connection."
  - "Connected detachment — care fully, hold lightly."
  - "What would tomorrow-you want today-you to do?"

# ============================================================
# PARADOXES
# ============================================================
paradoxes:
  - "Atração precisa de técnica MANIPULATIVA pra abrir; mas relacionamento real precisa de TRANSPARÊNCIA total. O cara desenrolado opera nos dois modos sem virar hipócrita."
  - "Quanto MAIS você quer ser visto/validado, MENOS você é. Quanto MAIS você dá validação aos outros, MAIS você é visto."
  - "Você precisa de auto-estima pra atrair alguém de auto-estima — mas auto-estima se constrói também através de atrair alguém. Paradoxo de partida que se resolve via incremento mútuo."
  - "Strauss é o cara que ESCREVEU o livro de pickup que validou neurodivergentes E o cara que depois disse que tudo aquilo era sintoma de trauma. Ambas verdades coexistem."
  - "Insegurança é universal entre caras (incluindo Chads). Mas COMPARTILHAR insegurança no momento errado mata atração. Calibration paradox."
  - "O cara mais 'autêntico' pós-Truth ainda usa técnica — só que a técnica agora é VULNERABILIDADE CALIBRADA, que é tecnicamente outra forma de jogo."
  - "Divórcio pode ser ato de amor mais saudável que continuar casado. Continuar casado pode ser ato de medo disfarçado de virtude."
  - "Você só conhece sua auto-imagem real quando alguém te ama de verdade — e aí o trauma de enmeshment dispara fuga. Intimidade revela e ameaça simultaneamente."

