# ============================================================
# FRAMEWORKS
# ============================================================
frameworks:
  - id: mystery_method_3_stages
    name: "Mystery Method — 3 Stages (Attraction → Comfort → Seduction)"
    description: "Toda interação progride por 3 estágios sequenciais. Pular um (ou apressar) quebra o set. Modelo backward-engineered do que naturais fazem inconsciente."
    structure:
      - "ATTRACTION — gerar interesse via negs, disinterest, push-pull. Status flip: você precisa não ser percebido como 'lower status' default."
      - "COMFORT — sentar, fazer perguntas reais, achar pontos em comum, criar bonding emocional. Antes disso ela não vai pra cama com você."
      - "SEDUCTION — escalar fisicamente. Counterintuitive pra cara analítico, mas funciona se as duas fases anteriores estão sólidas."
    when_to_use:
      - "Interação cold (não conhece a mulher, sem contexto prévio)"
      - "Cara que sempre cai na friend zone — precisa do mapa explícito"
      - "Quando há grupo (set) envolvido — ordem é: opener pro grupo → atrair → isolar → conforto → escalar"
    examples:
      - "Las Vegas boot camp Mystery: aluno abre grupo de 5, faz neg na target, cria atração por 5min, isola pro lado pra conforto, e só depois fecha número."
      - "Style com Jessica Alba: opener desafiador ('me diga 3 coisas que não sejam aparência'), comfort via ela vender ela mesma, seduction implícita via demonstração de domínio."
    source_refs:
      - "ASK MYSTERY Current TV expose (Mystery + Strauss demonstrando em Vegas)"
      - "Jimmy Kimmel — Strauss explicando 'broad strokes' pra Alba"
    phase_origin: early

  - id: opener_indirect_approach
    name: "Indirect Opener (não-hitting-on)"
    description: "Você NUNCA abre admitindo interesse romântico. Abre como se fosse uma opinião casual, fato curioso ou pergunta. O objetivo do opener é só fazer ela falar — não vender, não impressionar."
    structure:
      - "Frame: 'preciso de uma opinião rápida sobre algo'"
      - "Conteúdo: pergunta de relacionamento de terceiros, fato esquisito, polêmica leve"
      - "Time limit implícito: 'preciso voltar pros meus amigos em 30 segundos'"
      - "Inclui o grupo todo (se for set) — nunca isola a target no opener"
    when_to_use:
      - "Aproximação em ambiente social (bar, balada, evento)"
      - "DMs frias no Instagram quando ela não te segue"
      - "Quando ela é claramente acima da média e já é abordada o tempo todo"
    examples:
      - "'Preciso de uma opinião feminina rápida — minha amiga descobriu que o namorado dela mente sobre a idade. Termina ou não?'"
      - "'Vocês acreditam em fantasma? Acabei de ter uma discussão idiota com meus amigos.'"
    source_refs:
      - "Current TV — Mystery explicando: 'A ideia do opener não é fazer ela gostar de você. É só fazer ela falar.'"
    phase_origin: early

  - id: three_step_healing_formula
    name: "Three-Step Healing Formula (rewire your patterns)"
    description: "Quem repete os mesmos padrões em relacionamentos precisa de 3 camadas combinadas. Uma sozinha não resolve."
    structure:
      - "DEEP INTENSIVE — 1-2x por ano um workshop emocional pesado (The Meadows Survivors Program, Hoffman Process). 'Exorcismo de feridas de infância'. Sai do ambiente, rasga o band-aid."
      - "WEEKLY MAINTENANCE — men's group ou terapia em grupo (5-6 caras no mesmo nível + 1 terapeuta dividido). Mais barato que individual, mais eficaz, sem onde se esconder."
      - "IN-THE-MOMENT TOOLS — ferramentas de bolso pra crise (reparenting, widen-the-gap stimulus-response, NVC, name-the-trigger)."
    when_to_use:
      - "Cara que continua atraindo o mesmo tipo de mulher tóxica"
      - "Padrão de reação repetida em qualquer relação (ciúme, controle, abandono, suffocation)"
      - "Pós-divórcio ou pós-término doloroso, antes de voltar a 'gamificar'"
    examples:
      - "Strauss: Meadows program → exorcismo dos padrões da mãe enmeshing → men's group semanal → reparenting toolkit no dia-a-dia."
    source_refs:
      - "The Truth About Women & Relationships — Modern Wisdom full"
    phase_origin: late

  - id: enmeshment_vs_abandonment
    name: "Enmeshment vs Abandonment (the invisible wound)"
    description: "Trauma parental tem 2 formas, não 1. Abandonment todo mundo reconhece. Enmeshment é o oposto invisível: o pai/mãe SE APOIA no filho emocionalmente. Falsamente empoderador, por isso quase ninguém vê."
    structure:
      - "ABANDONMENT: pai não está presente (física ou emocionalmente). Criança aprende 'meus needs não importam, ninguém vem'."
      - "ENMESHMENT: pai está hiperpresente, mas USA o filho como terapeuta/parceiro emocional. Criança aprende 'meu papel é cuidar/consertar/aliviar o outro'."
      - "Sintoma adulto enmesh: escolhe parceiros-projeto pra consertar, sente sufocado por afeto real, foge quando relacionamento fica intenso."
      - "Sintoma adulto abandon: não pede ajuda, evita vulnerabilidade, anestesia."
    when_to_use:
      - "Diagnóstico em homem que 'não sabe por que sempre foge quando fica sério'"
      - "Cara que data damaged women pra consertar e depois fica ressentido"
      - "Validar histórico: 'sua mãe te ligava chorando do casamento dela? te fazia massagear o pescoço dela? não te deixou morar com sua namorada na faculdade?' = enmeshment provável"
    examples:
      - "Strauss em terapia: terapeuta listou timeline 0-17, identificou que mãe queria 'estar num relacionamento com ele' = emotional incest. Explicou todo padrão de fuga de intimidade dele."
      - "Mulher com tattoo 'daddy's little girl' — clássico marcador de enmeshment paterno."
    source_refs:
      - "The Truth About Women & Relationships — bloco sobre attachment e enmeshment"
      - "A Bit of Optimism com Simon Sinek — Strauss falando 'emotional incest'"
    phase_origin: late
    conflict_with:
      - "robert_greene (Art of Seduction — não considera trauma como variável central)"

  - id: locus_of_control_internal
    name: "Internal Locus of Control (the only lever)"
    description: "Você só controla suas reações. Tudo que você gasta tentando mudar a mulher / o mundo / a cultura é energia desperdiçada. Mudar você muda o sistema (porque relação é sistema)."
    structure:
      - "External locus: 'mulheres são assim, por isso desisto' / 'a culpa é dela' / 'a cultura é tóxica'"
      - "Internal locus: 'estou reagindo a isso. Por quê? Que pensamento isso gerou? Como mudo minha resposta?'"
      - "Trabalho: parar de reagir → conseguir avaliar se o problema é você ou ela. Antes disso, impossível diagnosticar."
    when_to_use:
      - "Cara cínico que blames mulheres/feminismo/apps"
      - "Antes de terminar — você não pode julgar a relação enquanto está reativo"
      - "Quando quer mudar parceira — substitui pela única coisa que funciona: mudar você, sistema reorganiza"
    examples:
      - "Strauss: 'Não dá pra saber se o problema na relação é você ou ela até você parar de reagir a ela.'"
    source_refs:
      - "The Truth About Women & Relationships"
    phase_origin: late

# ============================================================
# HEURISTICS
# ============================================================
heuristics:
  - id: scarcity_creates_value
    rule: "Se vem fácil demais, perde valor — torne-se mais difícil de conseguir."
    rationale: "Cat string theory (Mystery): humanos atribuem valor proporcional ao esforço gasto. Mulher bonita é abordada o tempo todo por caras suplicando — vira ruído. Quem se mostra indisponível vira sinal."
    when:
      - "Toda primeira interação com mulher acostumada a ser perseguida"
      - "Quando você sente impulso de elogiar/agradar/responder rápido"
      - "Resposta a mensagens — não responder em 30 segundos é heurística básica"
    counter_example: "NÃO aplicar quando ela já demonstrou interesse genuíno claro e está num momento vulnerável — virar 'difícil' aí queima goodwill. Usar só na fase de calibração inicial."
    source_refs:
      - "Jimmy Kimmel — Strauss: 'The best way to get someone is to pretend like you don't want it.'"
    phase_origin: early

  - id: flip_the_selling
    rule: "Faça ELA se vender pra você — não você se vender pra ela."
    rationale: "Default masculino é exibir conquistas/trabalho/qualidades = baixa status, comportamento de candidato. Inversão (pedir pra ela listar o que ela tem de interessante além da aparência) muda o frame inteiro: você vira o avaliador."
    when:
      - "Primeiro encontro / primeiras mensagens"
      - "Quando ela é objetivamente mais desejada que você (looks, status)"
      - "Sempre que sentir vontade de mencionar seu trabalho legal/realização"
    counter_example: "Não usar na fase de conforto avançada — aí já não é display, é conexão. Manter o flip eternamente vira teatro vazio (lição da fase late)."
    source_refs:
      - "Jimmy Kimmel — Strauss com Jessica Alba: 'Me diga 3 coisas sobre você que me façam querer te conhecer — e não pode ser aparência nem o que você faz.'"
    phase_origin: early

  - id: validate_dont_extract
    rule: "Dê validação. Não tente extrair validação."
    rationale: "Todo mundo está andando preocupado com o que VOCÊ está pensando deles. Você acha que estão te julgando — eles acham que você está julgando eles. Inverter isso (você dá validação, não pede) destrava conexão imediata e elimina ansiedade social."
    when:
      - "Aproximação cold (você ansioso achando que vai ser julgado)"
      - "Quando perceber que está performando pra impressionar"
      - "Em qualquer interação — incluindo balconistas, motorista, garçom (treino)"
    counter_example: "Validação ≠ bajulação. Não vire o cara que elogia tudo — vira chato. Validação é fazer o outro se sentir visto/ouvido/entendido, não 'que vestido lindo'."
    source_refs:
      - "A Bit of Optimism com Sinek — Strauss: 'Most freeing insight: instead of taking validation, give validation.'"
    phase_origin: late

  - id: dont_chase_the_surface
    rule: "Não busque o que ela diz que quer — busque o que está POR BAIXO."
    rationale: "Mulher diz 'quero alguém 1,80m' = ela quer segurança. Diz 'com dinheiro' = quer competência. Diz 'com status' = quer não-vergonha social. Strauss 1,68m e nariz grande virou guru — porque entregava o substrato (competência social, presença, segurança emocional) sem ter a superfície."
    when:
      - "Quando deficiências físicas/financeiras te paralisam"
      - "Lendo um perfil de app com 'lista' explícita"
      - "Coach de cara que diz 'sou baixinho então não tenho chance'"
    counter_example: "Não é desculpa pra negligenciar a superfície quando dá pra trabalhar nela (roupa, corpo, higiene, voz). É 'também treine o substrato' — não 'só treine o substrato'."
    source_refs:
      - "Dating Changes When You Realise This — Modern Wisdom"
      - "The Truth About Women — LMS reframe"
    phase_origin: both

  - id: model_naturals_dont_invent
    rule: "Tudo é engenharia reversa do que naturais fazem inconsciente — você não está inventando, está copiando."
    rationale: "PUA não criou seduction do zero. Observou quem nasce bom com mulher e codificou. Isso libera o neurodivergente: você pode APRENDER o que outros têm de fábrica. Strauss explícito: 'Eu precisava de alguém me dizendo onde colocar o corpo, o que falar.'"
    when:
      - "Cara analítico/ND paralisado por 'não me sinto natural'"
      - "Quando o aluno se julga por precisar de script"
      - "No onboarding do FlirtAI — desestigmatizar usar técnica"
    counter_example: "Eventualmente você precisa internalizar e 'jogar fora as regras'. Strauss: 'Aprende as regras e depois joga elas fora.' Se ficar décadas no script, vira robô (Lord of the Flies do fim do livro Game)."
    source_refs:
      - "The Truth About Women — Strauss: 'I see it as a lot of neurodivergent people trying to learn how to socially interact, including myself.'"
    phase_origin: both

  - id: you_attract_your_level
    rule: "Você atrai gente no seu nível de auto-estima — sempre."
    rationale: "Nathaniel Branden (Strauss cita): we attract people at our level of self-esteem. Quando alguém reclama do parceiro, a pergunta é: 'em que aspecto você É equivalente?'. Você pode ser flip side da mesma moeda — ainda é a mesma moeda."
    when:
      - "Cara que reclama de mulher tóxica recorrente"
      - "Cara que diz 'só atraio louca' = você está no nível das loucas, ponto"
      - "Antes de gastar grana em coach de pickup — primeiro elevar baseline interno"
    counter_example: "Não usar pra culpar vítimas de relacionamento abusivo. Aqui falamos de padrão recorrente, não evento isolado."
    source_refs:
      - "The Truth About Women — Strauss citando Branden 'we attract our level'"
    phase_origin: late

  - id: cynicism_is_safety_blanket
    rule: "Cinismo é o cobertor de segurança — quem nunca tenta nunca sente dor de falhar."
    rationale: "Black pill, MGTOW, 'mulher só quer Chad' = todos racionalizações pra não tentar e não machucar. Sour grapes existencial. Identificar o cinismo em si é pré-requisito pra ação."
    when:
      - "Cara que ataca quem está tendo sucesso com mulher"
      - "Cara que justifica não tentar com teoria evolutiva pessimista"
      - "Quando você se pega comparando seu trabalho pra baixo com o de alguém melhor"
    counter_example: "Cuidado: nem todo skepticism é cinismo. Saudável duvidar de gurus, dating advice ruim, AI hype. Diferença: cinismo trava ação, skepticism informa ação."
    source_refs:
      - "Dating Changes When You Realise This — 'cynicism safety blanket'"
    phase_origin: late

  - id: conflict_recovery_is_health
    rule: "Relacionamento saudável NÃO é zero conflito. É a velocidade de recuperação do conflito."
    rationale: "Casal sem conflito = parallel relationship (duas vidas separadas no mesmo teto). Tóxico de outro jeito. Métrica real: depois da briga, quanto tempo até voltar ao baseline de afeto?"
    when:
      - "Diagnosticar saúde de relação atual"
      - "Quando o cara romantiza ex que 'nunca brigava'"
      - "Pré-compromisso — testar capacidade de reparação"
    counter_example: "Não vale pra abuso emocional/físico. Aí não é conflito saudável, é dano."
    source_refs:
      - "The Truth About Women — Strauss: 'A healthy relationship is how quickly you recover from conflict.'"
    phase_origin: late

  - id: dont_argue_to_change_her_mind
    rule: "Nunca brigue pra convencer ela do seu ponto — honre o que está vivo NELA."
    rationale: "Tentar convencer ativa defesa. Mesmo se você 'ganhar', perde. A realidade dela é o pensamento+sentimento dela. Você pode honrar sem concordar."
    when:
      - "Briga que loopa sem resolver"
      - "Quando ela está magoada e você quer 'explicar' que está errada"
      - "Crítica pública sobre você que vc quer rebater"
    counter_example: "Não vale pra mentira ou manipulação ativa contra você. Aí defende. Mas distingue: a percepção dela vs ataque contra você."
    source_refs:
      - "The Truth About Women — bloco NVC e 'perspective is her truth'"
    phase_origin: late

  - id: spiritually_wrong_to_manipulate
    rule: "Manipulação em relacionamento sério (não na fase de aproximação) é espiritualmente errado."
    rationale: "Strauss explícito: técnica pra abrir conversa = neutra. Técnica continuada DENTRO da relação sem o outro saber = split em você. Você vira o vegan que come carne escondido. Não sustenta."
    when:
      - "Decisão de continuar gameficando depois de namorar"
      - "Quando aluno pergunta 'uso negs na minha mulher?'"
      - "Tentação de aplicar push-pull pra resolver crise"
    counter_example: "Auto-manipulação (reframe interno tipo 'estou no comando da manipulação') é OK e útil — é diferente de manipular o outro."
    source_refs:
      - "The Truth About Women — 'any form of manipulation where the other isn't aware is spiritually wrong'"
    phase_origin: late
    conflict_with:
      - "robert_greene (Art of Seduction trata manipulação como neutra/desejável)"

  - id: tomorrow_you_test
    rule: "Antes de decidir: pergunte 'o que o você-amanhã ia querer que o você-hoje fizesse?'"
    rationale: "Regret minimization em horizonte curto. Pergunta clássica 'no leito de morte' é abstrata demais — amanhã é tangível. Funciona pra comida, álcool, mensagem impulsiva, sexo casual."
    when:
      - "Vontade de mandar mensagem rancorosa"
      - "Decisão de transar com alguém errado"
      - "Stalking ex no Instagram às 2h da manhã"
    counter_example: "Não usar como muleta pra evitar TODA ação espontânea. Amanhã-você também ia querer ter beijado quando deu certo."
    source_refs:
      - "The Truth About Women — Modern Wisdom"
    phase_origin: late

# ============================================================
# TECHNIQUES
# ============================================================
techniques:
  - id: the_neg
    name: "Neg (backhanded micro-disqualifier)"
    description: "Comentário ambíguo, levemente ofensivo OU desinteressado, dirigido à target de alto valor, pra QUEBRAR o status default dela (ela está acostumada com elogio). NÃO é insulto — é micro-disqualifier que dispara curiosidade ('por que ele não me achou perfeita?')."
    script_examples:
      - "'Que unhas legais. São postiças?' (dito casualmente, sem hostilidade)"
      - "'Você é fofa, mas tem cara de quem dá trabalho.' (sorriso)"
      - "'Eu ia te dar minha mão, mas mudei de ideia. Isso é nojento. Você lambeu a palma da mão ou o quê, sua tarada?' (cita Mystery)"
      - "'Você é a versão menos exibida da sua amiga, né?' (em set)"
    when:
      - "Mulher claramente above-average acostumada a ser abordada"
      - "Aproximação cold em ambiente social"
      - "Quando ela testa você esperando que você se renda"
    risk: "Tom errado vira insulto real = ela vai embora e/ou amigo dela te dá um soco. Não funciona em mulher de auto-estima muito baixa (interpreta literal e fecha). Não funciona via texto se ela não te conhece (sem tom de voz, vira agressão)."
    mastery_signal: "Ela ri E pergunta o que você quis dizer / começa a se justificar / começa a flertar de volta tipo 'sério, você é babaca'. Quando ela tenta provar que NÃO é o que você insinuou, o neg funcionou."
    source_refs:
      - "Current TV — Mystery demonstrando 'que tal hand thing' com target"
      - "Jimmy Kimmel — Strauss: 'sometimes 'I think you're absolutely disgusting' is better than a generic compliment'"
    phase_origin: early

  - id: peacocking
    name: "Peacocking (visual hook)"
    description: "Usar item visual distintivo (chapéu, colar, pulseira excêntrica) que serve de gancho de conversa orgânico — outras pessoas iniciam contato comentando. Inverte direção de abordagem."
    script_examples:
      - "Mystery: chapéu de pelúcia preto, óculos escuros à noite, unha pintada"
      - "Versão moderna sutil: anel grande conversation-starter, tatuagem visível com história, jaqueta com patches"
    when:
      - "Ambiente noturno onde competir por atenção visual é viável"
      - "Cara que quer ser abordado em vez de abordar"
      - "Festivais, baladas, eventos lifestyle"
    risk: "Overdose vira ridículo (Mystery virou meme). Calibre por ambiente — jantar fino não pede chapéu peludo. Brasil 2026: tom muito mais sutil que original."
    mastery_signal: "Pessoas (incluindo mulheres) comentam o item espontaneamente sem você puxar."
    source_refs:
      - "Current TV expose + Jimmy Kimmel (Strauss explicando peacocking pra Jessica Alba)"
    phase_origin: early

  - id: open_the_group_not_the_target
    name: "Open the Group, Not the Target"
    description: "Mulher bonita raramente está sozinha. Abrir direto na target = você é só mais um. Abrir o GRUPO INTEIRO (incluindo amigas e até amigos homens), ganhar o grupo, e SÓ DEPOIS se voltar pra target — ela quer sua atenção porque você não deu de cara."
    script_examples:
      - "Chega no grupo de 4: 'Pessoal, preciso de uma opinião rápida, vocês são meu júri popular...'"
      - "Dirige opener pras AMIGAS primeiro, faz neg na target sem olhar direto pra ela"
      - "Conquista a amiga mais 'obstáculo' (geralmente a amiga ciumenta) cedo — ela vira sua aliada"
    when:
      - "Set de 2+ mulheres"
      - "Set misto (homens + mulheres) — ganhar os caras é crítico ou eles te bloqueiam"
      - "Ambiente onde target está com 'protetores'"
    risk: "Demora muito no grupo e perde a janela. Target pode ir embora. Calibre: 5-10 min no grupo, depois isola via 'vamos ali ver isso rapidinho'."
    mastery_signal: "Amiga da target começa a 'wingar' por você — pergunta tipo 'mas você é solteiro?'. Sinal verde pra escalar com target."
    source_refs:
      - "Current TV — Mihow explicando set work em Vegas"
    phase_origin: early

  - id: cat_string_theory
    name: "Cat-String Theory (push-pull)"
    description: "Gato persegue cordinha que se MOVE pra longe — se você joga na cara dele, ele ignora. Mesma psicologia humana: interesse abertamente declarado mata desejo. Alternar puxar/empurrar mantém ela engajada."
    script_examples:
      - "Conversa boa fluindo → você de repente: 'Espera, preciso voltar pros meus amigos.' (push) Volta 20 min depois com algo pra ela. (pull)"
      - "Ela manda mensagem longa → você responde curto e some 4h → volta com algo personalizado."
      - "Beija ela → para → continua conversando normalmente como se nada → ela busca de novo"
    when:
      - "Sentir que você está chasing mais do que ela"
      - "Conversa indo bem demais cedo demais (red flag de desinteresse futuro)"
      - "Depois de você ter dado um 'sim' grande (encontro confirmado), criar uma micro-incerteza"
    risk: "Push exagerado vira hot-cold abusivo. Cara ansioso usa push pra autoboicotar. Diferença: você puxa por estratégia consciente, não por medo de intimidade."
    mastery_signal: "Ela começa a perguntar 'cadê você?', 'sumiu', 'tava esperando sua mensagem'. Inverteu-se a polaridade."
    source_refs:
      - "Jimmy Kimmel — Strauss explicando Mystery's cat string theory"
    phase_origin: early

  - id: demonstrate_authority_over_her_world
    name: "Demonstrate Authority Over Her World"
    description: "Em vez de falar de você, FALAR DELA — ler linguagem corporal dela, ler micro-expressões, fazer 'cold reading' sobre o tipo de pessoa que ela é. Cria sensação de 'ele me VÊ'. Técnica do Ross Jeffries."
    script_examples:
      - "'Pelo jeito que você está sentada e como ajeitou o cabelo agora, aposto que você é mais introvertida do que aparenta.'"
      - "'Você tem a expressão de quem foi a filha responsável da família, né?'"
      - "'Posso ver pelo seu olho que você decide rápido — eu hein, perigoso isso.'"
    when:
      - "Conversa morna que precisa de tensão"
      - "Quando ela está dando respostas sim/não/'não sei' (Britney Spears mode)"
      - "Mulher acostumada a ser elogiada — chocante quando você analisa em vez de bajular"
    risk: "Errar grosseiramente o cold reading queima. Treine com leituras genéricas-mas-direcionadas (Forer effect). Não vire 'cigano da feira'. Tom: observador casual, não vidente."
    mastery_signal: "Ela pede pra desligar o gravador (literal — Britney Spears com Strauss) e começa a se abrir / contar coisa pessoal espontaneamente."
    source_refs:
      - "Jimmy Kimmel — Strauss explicando técnica de Ross Jeffries, caso Britney Spears"
    phase_origin: early

  - id: name_three_things_flip
    name: "Name 3 Things (sell-flip opener)"
    description: "Pergunta direta que força a mulher a se vender pra você, eliminando aparência/profissão. Inverte o jogo de display."
    script_examples:
      - "'Me diga 3 coisas sobre você que me façam querer te conhecer melhor — e não pode ser nada sobre aparência nem sobre o que você faz.'"
      - "Variante BR: 'Esquece o trabalho e o look. Me convence em 3 frases por que você é interessante.'"
    when:
      - "Mulher above-average / muito assediada / celebridade"
      - "Primeira mensagem em app quando ela respondeu 'oi' seco"
      - "Conversa boring no primeiro encontro"
    risk: "Pode soar arrogante se entregue com tom errado — entregue com SORRISO e curiosidade real, não desafio agressivo. Mulher de baixa auto-estima pode travar."
    mastery_signal: "Ela ri, pensa, responde com 3 coisas — e DEPOIS te pergunta pra você responder igual. Selo de qualidade: ela quer se VENDER pra você."
    source_refs:
      - "Jimmy Kimmel — Strauss aplicando em Jessica Alba ao vivo"
    phase_origin: early

  - id: time_constraint_opener
    name: "Time Constraint (built-in escape)"
    description: "No opener, deixar claro que você TEM que sair logo. Reduz pressão dela ('ele não vai colar a noite inteira'), reduz pressão sua ('se der errado, eu já tinha que ir mesmo'), aumenta seu valor (você tem outras coisas)."
    script_examples:
      - "'Oi, tenho 30 segundos antes de voltar pros meus amigos, mas preciso saber sua opinião sobre...'"
      - "'Tenho que ir daqui a pouco mas vendo você aqui pensei que valia perguntar isso...'"
    when:
      - "Sempre na primeira aproximação"
      - "DMs frias de Instagram (versão: 'tô passando rápido por aqui...')"
      - "Ela parece desconfiada da sua intenção"
    risk: "Esquecer de QUEBRAR o time constraint depois. Se a conversa engatou, em algum momento você precisa sinalizar 'mudei de ideia, vou ficar mais um pouco' — caso contrário você some e perde."
    mastery_signal: "Ela é quem te puxa pra continuar: 'já tem que ir mesmo?' = inversão de polaridade ocorreu."
    source_refs:
      - "Current TV — Mystery method opener structure"
    phase_origin: early

  - id: reparenting
    name: "Reparenting (in-the-moment trigger fix)"
    description: "Quando você reage emocionalmente a algo que sua parceira faz (ela te abraça e você se sufoca, ela cobra e você quer fugir) — pausa, identifica que essa reação é do seu pai/mãe, e fala com você mesmo como o pai/mãe que você PRECISAVA, não o que teve."
    script_examples:
      - "Trigger: ela te abraça e você sente sufocado. Reparenting: 'Ela não é sua mãe. Isso é afeto, não é demanda. Você pode receber. Está seguro.'"
      - "Trigger: ela diz 'você nunca tá presente'. Reparenting: 'Ela não é seu pai criticando. É uma pessoa pedindo conexão. Você pode ouvir sem se defender.'"
    when:
      - "Reação emocional desproporcional ao estímulo"
      - "Repetição de padrão de fuga ou explosão"
      - "Quando o corpo dispara antes do cérebro entender"
    risk: "Sem terapia base, fica difícil identificar o trigger. Precisa de prática. Não substitui workshop intensivo (etapa 1 do 3-step healing)."
    mastery_signal: "Espaço entre estímulo e resposta começa a alargar. Você nota a tensão chegando ANTES de explodir."
    source_refs:
      - "The Truth About Women — bloco detalhado de tools"
    phase_origin: late

  - id: widen_stimulus_response_gap
    name: "Widen Stimulus-Response Gap"
    description: "Quando emoção sobe (raiva, ansiedade, vergonha) — você FÍSICA-mente pausa. Pede pra ir ao banheiro, levanta da cadeira, troca de posição. Quebra o loop reativo."
    script_examples:
      - "Brigando ao telefone, sentindo aperto no peito: 'Espera um segundo, já volto.' Larga, anda 30s, respira, retorna."
      - "Numa conversa presencial difícil: levanta, troca de lugar, fala consigo 'novo momento, nova pessoa', volta."
      - "Shinzen Young see-hear-feel: limpa pra-brisas mental antes de responder."
    when:
      - "Ansiedade física antes da fala impulsiva"
      - "Sensação de tightness no peito ou eletricidade nos pulsos (sinais do corpo)"
      - "Discussão escalando"
    risk: "Pode ser interpretada como desligamento/fuga se você desaparece sem explicar. Comunique: 'preciso de 1 minuto pra eu não falar besteira'."
    mastery_signal: "Você consegue responder em vez de reagir 80%+ do tempo em conversas tensas."
    source_refs:
      - "The Truth About Women — Strauss + Williamson trocando técnicas"
    phase_origin: late

  - id: nonviolent_communication
    name: "Nonviolent Communication (NVC) — honor what's alive"
    description: "Em vez de criticar/julgar/diagnosticar/punir/recompensar, você nomeia O QUE ESTÁ VIVO NO OUTRO (emoção + necessidade) e abre pergunta colaborativa. Marshall Rosenberg."
    script_examples:
      - "Ela: 'Você não me dá atenção.' Você (NVC): 'Parece que você tá chateada. Tá precisando de mais conexão?' Ela: 'É.' Você: 'O que faria você sentir mais conectada esse mês?'"
      - "Ela: 'Você ficou no celular 20 min.' Você (NVC, NÃO defensivo): 'Você sentiu falta da minha presença, né? Quer fazer algo agora só nós dois?'"
    when:
      - "Crítica vinda dela que normalmente disparava defensiva"
      - "Briga loopando sem resolução"
      - "Qualquer momento que você ia 'explicar por que ela está errada'"
    risk: "Soar terapêutico/falso se mecanizar. Tem que vir de curiosidade real. Não usar como técnica pra calar ela ('honrar o que está vivo' não é gaslighting elegante)."
    mastery_signal: "Briga que ia durar 2h dissolve em 10 minutos. Ela diz 'obrigada por ouvir'."
    source_refs:
      - "The Truth About Women — exemplo do casal sobre 'você não me dá atenção'"
    phase_origin: late

  - id: turnaround_self_accusation
    name: "Turnaround (Byron Katie)"
    description: "Toda acusação que você faz mentalmente sobre outro = aplica em você primeiro. 'Ela é chata' → 'Em que momento EU sou chato?'. Sempre acha. Quebra projeção."
    script_examples:
      - "Pensamento: 'Ela nunca está presente.' Turnaround: 'Em que momento EU não estou presente pra ela?' (lista 3 exemplos reais)"
      - "Pensamento: 'Ela é egoísta.' Turnaround: 'Em que situações EU sou egoísta com ela?'"
    when:
      - "Spiral de pensamento negativo sobre parceira"
      - "Antes de mandar mensagem rancorosa"
      - "Antes de terminar uma relação por 'culpa dela'"
    risk: "Não é pra anular crítica legítima. Se ela ESTÁ realmente sendo abusiva, turnaround vira auto-flagelação. Use quando você reconhece que está reativo, não quando há ameaça real."
    mastery_signal: "Você admite 70%+ das acusações como aplicáveis a você também. Frustração baixa antes mesmo da conversa."
    source_refs:
      - "The Truth About Women — Strauss citando Byron Katie's 4 questions + turnaround"
    phase_origin: late

  - id: third_party_compliments_training
    name: "Three-Strangers Validation Drill"
    description: "Pra curar ansiedade social: meta diária de fazer 3-4 pessoas se sentirem MELHOR sobre si mesmas via comentário kind. Inverte foco de 'estou sendo julgado' pra 'estou observando o que dá pra elogiar'."
    script_examples:
      - "Barista: 'Você tem uma energia muito boa de manhã, isso é raro.'"
      - "Pessoa no elevador com look interessante: 'Curti seu jeito de combinar isso.'"
      - "Motorista de Uber: 'Você dirige super bem, dá uma calma.'"
    when:
      - "Cara com fobia social"
      - "Cara que se acha 'invisível' pras mulheres"
      - "Período de cura pós-rejeição"
    risk: "NÃO pode ser elogio com agenda de extrair algo. Se você espera retorno, vira creepy. Se for genuíno e o outro não retribuir — TUDO BEM. Não é troca."
    mastery_signal: "Você sai de casa sem ansiar pelo julgamento dos outros. Foca em quem MERECE seu validation."
    source_refs:
      - "A Bit of Optimism — Strauss: exercise to give 3-4 people validation per day"
    phase_origin: late

  - id: dont_ask_outcomes_chain
    name: "Don't Be Right, Ask 'Who?' Disarm"
    description: "Resposta a crítica antagônica que neutraliza via curiosidade colaborativa em vez de defesa."
    script_examples:
      - "Critica: 'Você não chama X tipo de pessoa no seu pod.' Resposta: 'Interessante. Quem você sugeriria?'"
      - "Aplicação relacional: 'Você nunca planeja nada.' Resposta: 'Tem razão, mereço a crítica. O que você queria fazer esse mês?'"
    when:
      - "Crítica online ou em grupo"
      - "Crítica de parceira que normalmente te coloca defensivo"
      - "Quando reconhece que vai entrar em loop de 'estar certo'"
    risk: "Não é pra concordar com bullshit. É pra abrir colaboração genuína. Se a pessoa não tem nada construtivo a oferecer, ela cala — o que também resolve."
    mastery_signal: "Críticas viram conversas. Parceira fala 'gostei que você ouviu sem se defender'."
    source_refs:
      - "The Truth About Women — Williamson ensinando técnica, Strauss validando"
    phase_origin: late

# ============================================================
# ANTI-PATTERNS
# ============================================================
anti_patterns:
  - id: supplication
    name: "Supplication (puppy dog)"
    description: "Comportamento de candidato suplicante: elogios excessivos, disponibilidade total, sacrifício de planos pra ela, validation-seeking constante."
    symptoms:
      - "Responde mensagem em <30s sempre"
      - "Cancela planos próprios pra encaixar ela"
      - "Elogia 5+ vezes na primeira interação"
      - "Pergunta 'tudo bem?' várias vezes"
      - "Justifica decisões dele pra ela"
    consequence: "Ela perde atração imediata. Vira amigo (LJBF — let's just be friends speech). Mesmo se ela ficar, você vira projeto de pena dela — ressentimento de ambos os lados."
    antidote: "scarcity_creates_value + flip_the_selling + time_constraint_opener"
    source_refs:
      - "Current TV — Strauss descrevendo 'a guy who always got the LJBF speech'"
    phase_origin: early

  - id: trying_to_impress_logically
    name: "Logical Impressing (smart-guy trap)"
    description: "Cara analítico que tenta vencer atração via demonstração intelectual: fala de trabalho, conquistas, conhecimento, opinião informada."
    symptoms:
      - "Conta o que faz no primeiro encontro com detalhes"
      - "Cita livros / cita IQ implícito"
      - "Discorda dela em política/filosofia pra mostrar pensamento crítico"
      - "Resolve problemas dela em vez de só ouvir"
    consequence: "Atração não responde a lógica. Você se torna 'inteligente mas sem química'. Ela vai pra cama com o burro carismático e te chama pra desabafar depois."
    antidote: "model_naturals_dont_invent (atração é pré-verbal) + validate_dont_extract"
    source_refs:
      - "Current TV — 'New York Times writer, engineering student, intelligent guys whose logic isn't helping them meet women'"
    phase_origin: both

  - id: trying_to_change_partner
    name: "Trying to Change Your Partner"
    description: "Energia gasta em fazer ela mudar (parar de ciumar, vestir diferente, conversar mais) — sempre falha, sempre gera ressentimento."
    symptoms:
      - "Lista mental de 'se ela só mudasse X...'"
      - "Sugestões disfarçadas de feedback"
      - "Comparação com outras mulheres"
      - "Discussões recorrentes sobre o mesmo tema dela"
    consequence: "Você vira o pai/mãe crítico que ela teve na infância. Ela se defende, escala, ou se cala e te despreza. Relacionamento entra em modo guerra fria."
    antidote: "locus_of_control_internal — você muda, sistema muda. Ela vai notar e se ajustar SEM você pedir."
    source_refs:
      - "The Truth About Women — 'all that energy people put into changing their partner never works'"
    phase_origin: late

  - id: dating_a_project
    name: "Dating a Project (enmesh trap)"
    description: "Escolha consistente de parceiras 'que precisam ser consertadas'. Sintoma de enmeshment infantil — você só sabe amar consertando."
    symptoms:
      - "Padrão de atrair mulher em crise (vício, depressão, situação financeira ruim, ex tóxico)"
      - "Empolgação alta no início ('eu posso ajudar ela')"
      - "Ressentimento crescente quando ela não 'evolui'"
      - "Sentir-se vazio quando ela está bem (não precisa de você)"
    consequence: "Você não se relaciona — você terapeutiza. Ela ou nunca melhora (você é cúmplice da estagnação dela) ou melhora e te deixa (porque o vínculo era a doença, não vocês)."
    antidote: "enmeshment_vs_abandonment (diagnóstico) + three_step_healing_formula (cura) + reparenting (no momento)"
    source_refs:
      - "The Truth About Women — Strauss falando sobre padrão enmeshed → date projects"
    phase_origin: late

  - id: pickup_persona_burnout
    name: "Pickup Persona Burnout"
    description: "Cara fica anos jogando perfeitamente, dorme com muitas mulheres, e percebe: 'consigo o que quero, mas o que quero não me vê'. Vazio existencial pós-validação. Lord of the Flies do fim do livro Game."
    symptoms:
      - "Sucesso medido em conquistas numericamente"
      - "Sente-se ator entre uma conquista e outra"
      - "Mulheres atraídas amam o personagem, não você"
      - "Vergonha íntima cresce mesmo com 'vitórias' externas"
      - "Vício em validação que nunca sacia"
    consequence: "Strauss foi pra rehab de sex addiction. Outros desenvolvem cinismo, depressão, ou se tornam coaches tóxicos de outros caras. Em qualquer trajetória: distância entre quem você é e quem você performa = unhappiness garantida."
    antidote: "three_step_healing_formula + spiritually_wrong_to_manipulate + transition pra autenticidade gradual (NÃO largar tudo de uma vez — perde a base social que a técnica deu)"
    source_refs:
      - "Why The World's #1 Pickup Artist Left The Game Behind — sex addiction rehab"
      - "Dating Changes When You Realise This — disenchantment of early-2010s PUAs"
    phase_origin: late

  - id: external_locus_blame
    name: "External Locus / Blame Spiral"
    description: "Atribuir todo problema relacional a fatores fora de você: mulheres mudaram, apps quebraram tudo, cultura é tóxica, feminismo, hipergamia."
    symptoms:
      - "Consume conteúdo black pill / MGTOW"
      - "Diz 'desisti de mulher' como flex"
      - "Justifica falta de tentativa com teoria"
      - "Hostilidade a quem está conseguindo"
    consequence: "Você nunca melhora porque definiu o problema como insolúvel. Espiral de cinismo + isolamento + raiva."
    antidote: "internal_locus_of_control + cynicism_is_safety_blanket (reconhecer o mecanismo)"
    source_refs:
      - "Dating Changes When You Realise This — bloco completo"
    phase_origin: late

  - id: split_self
    name: "Split Self (vegan-who-eats-meat)"
    description: "Você mantém um personagem público (rico, confiante, viajado) diferente do real. Cria split interno que mina auto-estima silenciosamente."
    symptoms:
      - "Ansiedade quando alguém pode 'descobrir' a verdade sobre você"
      - "Edita seletivamente posts/conversas"
      - "Vergonha íntima crescente mesmo em 'sucesso' externo"
      - "Atração só funciona com gente que não te conhece direito"
    consequence: "Você atrai gente que ama a fantasia, não você. Quando intimidade real aparece (relacionamento longo), você foge ou sabota."
    antidote: "stop_chasing_the_surface (trabalha o substrato real) + healthy doses of vulnerability"
    source_refs:
      - "The Truth About Women — analogia 'influencer pushing vegan diet while eating meat'"
    phase_origin: late

  - id: zero_conflict_relationship
    name: "Zero-Conflict Relationship (parallel lives)"
    description: "Relacionamento que 'nunca briga' é frequentemente duas pessoas vivendo vidas separadas sob mesmo teto. Tóxico porque deatachament passa por paz."
    symptoms:
      - "Nenhuma discussão em meses"
      - "Você não sabe nada novo sobre ela em semanas"
      - "Sexo escasso ou puramente mecânico"
      - "Vocês não fazem decisões importantes juntos"
    consequence: "Eventualmente um dos dois explode/trai/some. Ou ambos definham juntos em mediocridade emocional."
    antidote: "conflict_recovery_is_health (métrica certa) + NVC (briga produtiva)"
    source_refs:
      - "The Truth About Women — 'a relationship with zero conflict is a warning sign'"
    phase_origin: late

# ============================================================
# SCRIPTS
# ============================================================
scripts:
  - id: opener_cold_approach
    situation: "Aproximação cold em bar/balada/evento social"
    variants:
      - tone: estrategico
        text: "Pessoal, preciso de uma opinião feminina super rápida — tenho 1 minuto antes de voltar pros meus amigos. Vocês acham que mentir sobre a idade no app de namoro é deal-breaker ou todo mundo faz?"
        context_notes: "Inclui grupo, time constraint, tema de relacionamento de terceiros (não-ameaçador), pergunta polêmica leve"
      - tone: direto
        text: "Não vou ficar muito tempo, mas precisei vir falar com você. Tem alguma coisa em você que me chamou atenção — não sei o quê ainda. (pausa, olha) Me convence em 3 frases por que vale a pena descobrir."
        context_notes: "Late-phase Strauss — assume vulnerabilidade calculada. Funciona melhor com mulher de 28+ que detesta game óbvio."
      - tone: comico
        text: "Oi. Olha, eu pareço o cara dos namorados, eu sei. Mas juro que sou só o cara dos finais bons. Posso te incomodar com uma pergunta esquisita?"
        context_notes: "Autoirônico, baixa defesa. Boa pra Brasil onde tom americano agressivo não cola."
    source_refs:
      - "Mystery Method opener + Strauss late phase authenticity flip"
    phase_origin: both

  - id: first_message_app
    situation: "Primeira mensagem em app de namoro depois do match"
    variants:
      - tone: estrategico
        text: "[nome dela], teste rápido: me dá 3 razões pra eu querer te conhecer que não sejam aparência nem o que você faz. Aviso: sou rigoroso."
        context_notes: "Versão Jessica Alba name-3-things. Funciona em mulher que recebe 200 matches/semana e está cansada do 'oi'."
      - tone: comico
        text: "Já bati o martelo: você é a pessoa mais interessante que apareceu hoje. Agora você tem 2 mensagens pra confirmar ou desconfirmar."
        context_notes: "Frame: você decidiu, ela precisa provar. Push-pull leve."
      - tone: direto
        text: "Oi. Não vou fazer charme de app. Você me chamou atenção. Topa um café terça ou quinta de tarde?"
        context_notes: "Late-phase: pula todo o jogo. Funciona em mulher 30+ ou em quem você JÁ tem evidência clara de interesse."
    source_refs:
      - "Jimmy Kimmel name-3-things + Strauss philosophy contra 'admin de Tinder'"
    phase_origin: both

  - id: she_went_silent_3_days
    situation: "Ela sumiu por 3 dias depois de estar engajada"
    variants:
      - tone: estrategico
        text: "(NADA. Você não manda mensagem. Espera. Se ela voltar em 5-7 dias, responde como se nada tivesse acontecido — sem cobrança.)"
        context_notes: "Mystery: 'silence is the most powerful tool'. Cobrança = confirma seu interesse alto + falta de opções."
      - tone: direto
        text: "Sumiu né. Sem stress. Quando voltar, me chama. Tô por aqui."
        context_notes: "Comunica que você notou MAS não está investido. Funciona melhor que silêncio se vocês já tinham marcado algo."
      - tone: autentico
        text: "(Manda só depois de ela voltar, se voltar:) 'Boa ouvir de você. Confesso que pensei que tinha ficado estranho do nosso último papo. Tudo bem por aí?'"
        context_notes: "Late-phase Strauss — vulnerabilidade controlada. Só usa se ela já demonstrou histórico de honestidade emocional. NÃO usa com mulher de jogo."
    source_refs:
      - "Mystery Method (silence) + Strauss late (calibrated vulnerability)"
    phase_origin: both

  - id: ela_reclama_pouca_atencao
    situation: "Parceira (já estabelecida) cobra: 'Você não me dá atenção'"
    variants:
      - tone: autentico
        text: "Parece que você está chateada. Tá precisando de mais conexão, é isso? (espera ela falar) — O que faria você se sentir mais conectada esse mês?"
        context_notes: "NVC clássico. Honra a emoção dela ANTES de defender você. Quase sempre dissolve a briga."
      - tone: direto
        text: "Você tem razão em parte. Posso fazer pergunta antes? Quando você diz 'pouca atenção', tem um momento específico que te marcou essa semana? Quero entender pra ajustar."
        context_notes: "Pede dado em vez de defender. Mostra que você tomou a sério sem assumir culpa total."
    source_refs:
      - "The Truth About Women — exemplo literal de NVC com casal"
    phase_origin: late

  - id: she_tests_you_in_set
    situation: "Em grupo, target faz pergunta-teste pra testar seu valor ('você mora aqui?' / 'o que você faz?' / 'cadê seu sotaque?')"
    variants:
      - tone: comico
        text: "Curioso esse interrogatório. Você tá tipo coletando perfil pra vender pro Tinder, é isso? (sorri, vira pra amiga dela:) Ela é sempre assim direta ou hoje é dia especial?"
        context_notes: "Vira o teste contra ela, inclui a amiga, deflect leve. Status flip clássico."
      - tone: direto
        text: "Pergunta padrão. Vou responder, mas só se você fizer o mesmo: o que você faz? (espera ela responder) — Cool. Eu faço X. Próximo tópico."
        context_notes: "Responde mas exige reciprocidade. Move pra próximo tópico = você controla pacing."
    source_refs:
      - "Mystery Method handling shit tests"
    phase_origin: early

  - id: pos_primeiro_beijo_quase
