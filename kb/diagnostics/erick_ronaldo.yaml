  - id: ela_riu_ALTO_da_pickup_line
    situation: "Você entregou pickup line cafona, ela GARGALHOU"
    signals_to_read:
      - "Volume do riso (alto = topou jogo, baixo = nervosismo social)"
      - "Ela bate em você de leve durante o riso (sinal kinesthetic positivo)"
      - "Ela responde com piada de volta"
    interpretation_options:
      - reading: "Ela topou o registro lúdico"
        confidence: alta
        next_move: |
          Continua nesse register, evite ficar 'sério'. Faz mais 1
          piada e pede número enquanto ela está rindo ('was that
          smooth? can I get your number?').
      - reading: "Riso nervoso polite"
        confidence: media
        next_move: |
          Calibra pra modo sério em 30s. Pergunta substantiva, vê
          se ela engaja. Se não, sai antes.
    source_refs:
      - "RIZZING_UP_GIRLS_WITH_YOUR_PICKUP_LINES"

