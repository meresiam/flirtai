        context_notes: "Play your side of the net em prática. Sem agressão, sem fuga, sem capitulação."
    source_refs:
      - "Rowan Andrews — Glover sobre esposa Latina e ciúme"

# =================================================
# DIAGNOSTICS
# =================================================
diagnostics:
  - id: am_i_a_nice_guy
    situation: "Auto-diagnóstico — sou um Nice Guy?"
    signals_to_read:
      - "Penso 'sou diferente dos outros caras'"
      - "Escondo necessidades, opiniões, desejos pra evitar reação negativa"
      - "Esperarei retorno por gestos não-combinados (covert contracts)"
      - "Tenho histórico de explosões depois de meses ruminando"
      - "Mulheres me dizem 'difícil de te presentear/dar pra você'"
      - "Tenho dificuldade em receber elogio/ajuda"
      - "Padrão de friendzone — desejo mulher que me vê 'como amigo'"
      - "Carreira estagnada por não 'rocar barco'"
    interpretation_options:
      - reading: "Nice Guy clássico"
        confidence: alta
        next_move: "[frameworks:nice_guy_recovery_process] — começa por techniques:joining_a_tribe"
      - reading: "Traços Nice Guy em domínio específico (só trabalho OU só relacionamento)"
        confidence: media
        next_move: "Foca recovery no domínio afetado primeiro"
      - reading: "Algumas características mas no geral diferenciado"
        confidence: baixa
        next_move: "Recovery contínua via heuristics pontuais, sem alarme"
    source_refs:
      - "NMMNG interview + 21 Report — síntese de sinais"

  - id: she_is_creating_drama
