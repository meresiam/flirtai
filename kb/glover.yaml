# =================================================
# FRAMEWORKS
# =================================================
frameworks:
  - id: nice_guy_syndrome
    name: "Nice Guy Syndrome"
    description: >
      Síndrome internalizada na infância (geralmente 3-5 anos) baseada na crença
      "há algo errado comigo, preciso virar o que os outros querem pra ser amado".
      O Nice Guy esconde necessidades, sexualidade e qualquer coisa que possa
      provocar reação negativa.
    structure:
      - "Crença-raiz — 'não sou ok como sou'"
      - "Estratégia — 'me torno o que ela quer pra ser aprovado'"
      - "Ocultação — escondo necessidades, sexualidade, raiva, opinião"
      - "Fachada de bondade — quero parecer o cara legal, generoso, sem conflito"
      - "Resentimento acumulado — dou muito, recebo pouco, viro passive-aggressive"
      - "Explosão / victim puke — ou jab cruzado ou desabafo destrutivo depois de meses ruminando"
    when_to_use:
      - "Diagnosticar usuário que diz 'fiz tudo certo pra ela' e foi friendzonado/abandonado"
      - "Detectar padrão de 'eu sou diferente dos outros caras' como red flag"
      - "Identificar usuário que esconde agenda sexual e tenta 'enganar' o desejo"
    examples:
      - "Cara que paga jantar, escuta os problemas dela por horas, faz massagem, e fica revoltado quando não rola sexo"
      - "Cara que 'tá lá pra ela' como amigo esperando virar namorado"
      - "Marido que evita conflito por 14 anos, explode num divórcio surpresa"
    source_refs:
      - "21 Report interview — 'internalized beliefs at a very young age... there's something wrong with me'"
      - "NMMNG interview Patrick — descrição clínica do nice guy"
      - "Rowan Andrews — 'three covert contracts' como engine do Nice Guy'"

  - id: covert_contracts
    name: "Covert Contracts (Contratos Velados)"
    description: >
      Acordos não-declarados que o Nice Guy faz mentalmente com o mundo,
      esperando que o outro lado cumpra sua parte sem nunca ter combinado nada.
      Engine central da frustração e do resentimento.
    structure:
      - "Contrato 1 — 'se eu for bom, serei amado e as mulheres que desejo vão querer transar comigo'"
      - "Contrato 2 — 'se eu fizer tudo certo, terei uma vida lisa, sem problemas'"
      - "Contrato 3 — 'se eu ler a mente dela e dar o que acho que ela quer, ela vai ler a minha e me dar o que acho que quero'"
    when_to_use:
      - "Usuário dizendo 'eu fiz tudo X e ela ainda assim Y'"
      - "Usuário esperando reciprocidade implícita por gestos não-combinados"
      - "Usuário dando presentes/atenção com expectativa oculta de sexo"
    examples:
      - "Lavo a louça → ela vai me dar sexo (Rowan interview — Glover relata isso da própria 2a esposa)"
      - "Pago o jantar → ela tem que aceitar segunda volta"
      - "Sou o melhor amigo dela → eventualmente ela vai me ver como homem"
    source_refs:
      - "Rowan Andrews — definição dos 3 covert contracts em detalhe"
      - "21 Report — 'we're not good at letting people give to us'"

  - id: differentiation
    name: "Differentiation (Diferenciação)"
    description: >
      Termo psicológico que Glover usa como sinônimo operacional de autenticidade.
      Três componentes — perguntar o que EU quero, seguir nisso, e manter mesmo
      sob pressão externa ou ansiedade interna.
    structure:
      - "Passo 1 — perguntar 'o que eu quero? o que é certo pra mim?'"
      - "Passo 2 — agir sobre essa resposta"
      - "Passo 3 — sustentar mesmo com flack de mãe/pai/cultura/igreja/cabeça"
    when_to_use:
      - "Quando usuário tá 'lemming' — seguindo o que esperam dele"
      - "Quando usuário muda comportamento pra agradar interlocutor"
      - "Quando há ansiedade de desagradar paralisando uma decisão"
    examples:
      - "Decidir não escutar a parceira reclamar por horas — 'me dá a versão de cara'"
      - "Triplicar o preço da proposta numa reunião porque agora ele se importa menos com 'ser bom'"
      - "Recusar texto recorrente da igreja/família sobre 'o que homem deve ser'"
    source_refs:
      - "21 Report — definição formal de differentiation"
      - "NMMNG interview — 'culture encourages fusion; adulthood é aprender a differentiate'"

  - id: setting_the_frame
    name: "Setting the Tone and Taking the Lead"
    description: >
      O homem define o frame da interação, lidera onde vai a relação, não fica
      gerenciando percepção da mulher. Mulher não consegue seguir onde o homem
      não lidera — se ele não lidera, ela toma o volante por instinto.
    structure:
      - "Tem um plano (nunca chega perguntando 'o que cê quer fazer?')"
      - "Mostra agenda — incluindo sexual — sem ocultar"
      - "Comunica o que espera dela ('me trate bem, faça meu mundo bonito')"
      - "Deixa ela seguir, não pede permissão pra cada movimento"
      - "Não tenta administrar humor/percepção dela — joga sua side of the net"
    when_to_use:
      - "Match novo no app — define rapidamente onde/quando se encontra"
      - "Primeira mensagem — propõe, não pergunta vaga"
      - "Relacionamento — quando ela testa, ele segura frame sem perseguir"
    examples:
      - "'Quinta 20h no [bar X]. Vai. Te chamo às 19h pra confirmar.'"
      - "'Já tenho a vida que quero. Se quiser ser o frosting do bolo, ótimo — mas não vou te tratar como bolo.'"
      - "Em DR — não desviar pra 'me defender'; manter ponto sem agredir"
    source_refs:
      - "Boldness palestra — 'a woman can't follow where a man doesn't lead'"
      - "Rowan Andrews — 'play your own side of the net'"
      - "NMMNG interview — 'give me the guy version' como técnica de frame"

  - id: positive_emotional_tension
    name: "Positive Emotional Tension"
    description: >
      Mulheres precisam de tensão emocional pra sentir atração e excitação.
      Nice Guy elimina toda tensão (placa, agrada, resolve) e mata atração.
      Bad Boy cria tensão NEGATIVA. Solução não é meio-termo — é gerar tensão
      POSITIVA conscientemente.
    structure:
      - "Tensão = pré-requisito biológico da atração feminina, não bug"
      - "Nice Guy cria zero tensão → tédio + busca da mulher por drama"
      - "Bad Boy cria tensão negativa (incerteza, ausência, drama) → atração com sofrimento"
      - "Positive tension = liderança, surpresa, polaridade, não-disponibilidade saudável, presença plena"
      - "Quando o homem não cria tensão, a mulher cria — geralmente patológica (briga, ciúme, ameaça)"
    when_to_use:
      - "Casamento estagnado / 'sex morreu'"
      - "Match que tá indo morno demais — só simpatia, zero spark"
      - "Quando ela tá criando drama do nada (sinal de tensão insuficiente vinda do homem)"
    examples:
      - "Glover sobre esposa — 'quando outras mulheres flertam comigo, ela fica com ciúmes E excitada — é tensão positiva'"
      - "Mudar rotina sexual — mesma técnica todo dia mata desejo, varia"
      - "Sair com amigos sem dar explicação detalhada de horário/quem"
    source_refs:
      - "NMMNG interview — Glover detalha tese central do livro que tava escrevendo"
      - "'Women need emotional tension to feel attraction and arousal toward a man'"

  - id: father_wound
    name: "Father Wound"
    description: >
      Ferida-padrão masculina ligada à figura paterna — pai ausente, crítico,
      raivoso, ou pai 'nice guy passivo que ensinou a não contrariar mãe'.
      Frequentemente combinada com mãe que ensinou o filho a 'ser diferente do pai'.
      A cura passa por reconhecer que o pai 'tava operando no pico dele' — humano falho.
    structure:
      - "Pai ausente OU pai problemático (raivoso, alcoólatra, crítico)"
      - "Mãe que verbaliza 'seja diferente do seu pai'"
      - "Filho internaliza — não pode ser homem do jeito do pai → vira Nice Guy"
      - "Adulto carrega resentimento, distância, raiva escondida"
      - "Cura = reconhecer pai como humano falho operando no pico dele + forgive"
      - "Recovery muda 'father' → 'friend'"
    when_to_use:
      - "Usuário com raiva crônica de homens / autoridade"
      - "Usuário que esconde toda parte 'masculina dura' por medo de virar o pai"
      - "Bloqueio pra agir com firmeza por medo de 'parecer com ele'"
    examples:
      - "Glover não falou com pai por 15 anos, escreveu carta agradecendo baseball, fez paz pré-morte"
      - "Amigo do entrevistador — pai batia, filho virou Nice Guy externo, morreu de overdose"
    source_refs:
      - "21 Report interview — narrativa pessoal do Glover sobre o pai"
      - "NMMNG interview — 'my mother raised me to be different from my father — she later apologized'"

  - id: tribe_and_male_initiation
    name: "Tribe and Male Initiation"
    description: >
      Homens evoluíram em tribos por 1.5 milhão de anos. Isolamento masculino é
      patologia recente. Nenhuma recovery do Nice Guy acontece sozinho — exige
      grupo de homens, men's coach, men's group. Sem iniciação masculina por
      outros homens, o cara fica preso no 'nursery' emocional.
    structure:
      - "Tribo = não-negociável pra saúde masculina"
      - "Iniciação tradicional = homens mais velhos tiravam o garoto da mãe, davam tarefa life-threatening, celebravam"
      - "Substitutos modernos — men's group, BJJ dojo, 12-step, divorce group, dating bootcamp, Mankind Project"
      - "Acontecimento paradoxal — quanto mais conectado a homens, mais atraente pras mulheres"
    when_to_use:
      - "Usuário isolado, doomscrolling, sem amigos homens próximos"
      - "Usuário tentando 'fazer tudo sozinho' (sinal Nice Guy clássico)"
      - "Recovery emperrada — falta acountability/witnessing"
    examples:
      - "Glover — 'comecei com 1.5 bom amigo, hoje tenho 25-50 caras que pegariam avião se eu chamasse'"
      - "Mankind Project, BJJ, 12-step, men's group online — todos servem como tribo"
    source_refs:
      - "Boldness palestra — tese central sobre worldwide men's movement"
      - "Rowan Andrews — discussão sobre AI/isolation/men's connection"

  - id: nice_guy_recovery_process
    name: "Nice Guy Recovery Process"
    description: >
      Processo prático de desmontagem do Nice Guy. Não é evento — é prática
      pra vida toda ('recovering nice guy'). Glover é explícito — slow learners,
      quick forgetters. Recovery feita em isolamento não funciona.
    structure:
      - "1. Find safe people — 12-step, men's group, therapist que entende"
      - "2. Reveal yourself — começar a falar o que esconde, deixar sair toxic shame"
      - "3. Make your needs a priority — listar, comunicar, parar de esperar mind-reading"
      - "4. Set boundaries — aprender a dizer não, não tolerar disrespect"
      - "5. Live authentically with differentiation — perguntar o que VOCÊ quer"
      - "6. Take risks — sair da comfort zone, falhar, levantar"
      - "7. Embrace mistakes — recovery não é perfeição, é recovery"
      - "8. Surround with people who can give to you — virar bom receiver"
    when_to_use:
      - "Usuário diagnosticado como Nice Guy querendo plano de ação"
      - "Usuário em pós-divórcio/breakup procurando reconstrução"
    examples:
      - "Glover — entrou em 12-step pra sex addicts, descobriu que não era sex addict, mas o grupo virou tribo"
      - "Joined men's group, hired coach, fez MDMA-assisted therapy 3 semanas antes da entrevista Rowan"
    source_refs:
