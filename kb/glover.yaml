    when:
      - "Cara que 'já tentou tudo' sem resultado"
      - "Padrão repetido de 'mulher não me dá bola'"
      - "Crença não-examinada sobre 'como mulher é'"
    counter_example: >
      Não é virar 'positivismo tóxico'. Algumas mulheres não vão te querer — isso
      não é crença auto-limitante, é realidade. A regra é sobre crenças GENERALIZADAS.
    source_refs:
      - "Boldness palestra — Glover lista as 3 crenças que travaram ele 40 anos"
    conflict_with: []

  - id: be_bold
    rule: "Boldness > tudo. Mulher se excita biologicamente por ousadia, como você se excita por seios."
    rationale: >
      Glover é literal — quando uma mulher vê confiança/ousadia num homem, ela
      experimenta o MESMO surge de neurochemistry que você experimentaria vendo
      seios. Não é aprendido — é wired. Boldness é o aphrodisiac universal.
    when:
      - "Toda situação onde a tentação é jogar safe"
      - "Decisão de aproximar, propor, expressar desejo"
    counter_example: >
      Boldness ≠ agressividade ≠ desrespeito. É ocupar o próprio espaço sem
      pedir permissão pra existir.
    source_refs:
      - "Boldness palestra — analogia neurochemistry seios/boldness"
    conflict_with: []

  - id: tribe_first_woman_second
    rule: "Conecta com homens primeiro. Mulher vem depois — e paradoxalmente, vem mais fácil."
    rationale: >
      Cara conectado a tribo masculina forte é magnético. Cara isolado que busca
      conexão na mulher cria neediness insuportável. Mulher quer encaixar numa
      vida cheia, não preencher o vazio do cara.
    when:
      - "Cara solitário tentando 'arrumar namorada pra ter alguém'"
      - "Cara que terminou e quer 'pular pra próxima' como cura"
    counter_example: >
      Tribo masculina ≠ desculpa pra fugir de relacionamento. É infraestrutura.
    source_refs:
      - "Rowan Andrews — tese central sobre worldwide men's movement"
      - "Boldness palestra — 'we're looking for a tribe'"
    conflict_with: []

  - id: be_consistent
    rule: "Faça o que você diz que vai fazer. Sempre."
    rationale: >
      Nice Guy é pego mentindo pequenas coisas — disse que ia fazer e não fez,
      'deixou de fora' detalhes. Mulher detecta. Confiança nasce de consistência
      micro, não de gestos grandes.
    when:
      - "Toda promessa, mesmo pequena"
      - "Quando você diz 'te ligo em 1h' — liga"
    counter_example: >
      Consistência ≠ rigidez sem contexto. Comunicar mudança de plano é integridade —
      sumir é Nice Guy.
    source_refs:
      - "Rowan Andrews — Glover lista promessas que faz à mulher na pre-relationship talk"
    conflict_with: []

  - id: tell_the_whole_truth
    rule: "Diga toda a verdade — não esconda 'pra não preocupar ela'."
    rationale: >
      Forma mais comum de Nice Guy patologia em casamento — esconder coisas que
      'podem upset her'. Toda vez que ela descobre depois, destrói confiança
      mais do que a coisa em si destruiria.
    when:
      - "Tentação de omitir gasto, encontro, opinião pra evitar conflito"
      - "Quando você se pega editando a versão dos fatos"
    counter_example: >
      Não é dump emocional bruto. É comunicar — 'tem isso aqui, precisamos falar'.
      Conteúdo + processo.
    source_refs:
      - "NMMNG interview — exemplo direto, esposa fica triggered descobrindo o que ele omitiu"
    conflict_with: []

# =================================================
# TECHNIQUES
# =================================================
techniques:
  - id: pre_relationship_declaration
    name: "Pre-Relationship Declaration"
    description: >
      Em vez de deixar relacionamento se formar por inércia, declare na hora
      que parece estar virando algo — exatamente o que você é, o que oferece,
      o que espera. Reframe completo do dating moderno.
    script_examples:
      - "'Se a gente continuar se vendo, aqui vai o que você pode esperar de mim — vou ser consciente, vou prestar atenção em mim, em você, em nós. Vou setar o tom e liderar. Vou aparecer com um plano. Nunca vou perguntar 'o que você quer fazer hoje?'. Vou ser honesto — tudo que eu te disser vai ser verdade. Vou ser transparente — você vai saber o que eu penso, sinto, quero, espero de você e o que tá me incomodando.'"
      - "'O que eu espero de você? Já tenho a vida coberta. Só me trate bem e faça meu mundo bonito.'"
    when:
      - "Date 3-5 quando dá pra ver que tá engatando"
      - "Quando ela pergunta 'o que a gente é?'"
    risk: >
      Pode soar arrogante / 'coach' se entregue com tom errado. Tem que vir de
      lugar genuíno de autoconhecimento, não de script decorado.
    mastery_signal: >
      A mulher reage com 'nenhum homem me falou isso antes' + curiosidade real,
      não sarcasmo. Ela começa a se perguntar como pode ser 'o frosting'.
    source_refs:
      - "Rowan Andrews — Glover relata literalmente esse script"
    conflict_with: []

  - id: pre_sex_talk
    name: "Pre-Sex Talk"
    description: >
      Antes de roupas saírem, conversa de 3 minutos sobre proteção, STI,
      preferências, e — crucialmente — sobre tirar o peso de performance.
      Reframe sex de 'transação que pode dar errado' pra 'exploração compartilhada'.
    script_examples:
      - "'Parece que as roupas vão sair. Vamos conversar um minuto — proteção, o que cada um curte, o que tá fora.'"
      - "'Às vezes com parceira nova eu não consigo manter ereção. E aí? Que tal a gente só ficar pelado, explorar os corpos um do outro, ver onde vai dar — sem pressão de performance?'"
    when:
      - "Primeira vez com nova parceira"
      - "Sexo após período longo sem"
      - "Parceira visivelmente ansiosa com sexo"
    risk: >
      Cara sem conexão genuína pode entregar como técnica fria e matar o
      momento. Tem que vir de presença, não de cálculo.
    mastery_signal: >
      Ela visivelmente relaxa, expressão de alívio. Sexo flui melhor — sem
      performance pressure, ereção vem naturalmente, ela permite mais.
    source_refs:
      - "Rowan Andrews — Glover detalha essa técnica como descoberta no pós-divórcio"
    conflict_with: []

  - id: ask_for_guy_version
    name: "Ask For the Guy Version"
    description: >
      Quando ela começa a desabafar problema ruminante, em vez de virar terapeuta,
      liderar — pedir versão condensada, direta. Não recusa de escuta — redirecionamento
      pra dinâmica masculina-feminina, não materna-filhote.
    script_examples:
      - "'Você quer que eu seja seu cara, né? Então vem cá — me dá a versão de cara. Não quero a versão de menina, quero a versão de cara.'"
      - "'Resume pra mim em 2 frases o que aconteceu e o que você quer fazer.'"
    when:
      - "Ruminação de problema sem fim claro"
      - "Quando você se pega tendo que escutar a 5a versão da mesma fofoca"
    risk: >
      Pode soar desprezivo se entregue sem afeto. Faz com toque (mão no rosto,
      olho-no-olho) — assertividade afetuosa.
    mastery_signal: >
      Ela ri, relaxa, e condensa de fato. Ou ela percebe que tava ruminando e
      muda de assunto sozinha.
    source_refs:
      - "Boldness palestra — script direto Glover usa"
    conflict_with: []

  - id: revealing_self_in_safe_container
    name: "Revealing Self in a Safe Container"
    description: >
      Técnica central da recovery — escolher contexto seguro (men's group, terapeuta,
      coach) pra começar a verbalizar o que sempre escondeu. Toxic shame perde
      poder quando dita em voz alta pra alguém que não reage com julgamento.
    script_examples:
      - "Compartilhar em men's group — 'tem isso de mim que eu sempre escondi — [insere]'"
      - "Glover relata cara compartilhando aos 50 que tinha roubado um car stereo aos 15 — grupo respondeu 'irmão, todo mundo fez merda em adolescente' — toxic shame morreu na hora"
    when:
      - "Início da recovery do Nice Guy"
      - "Quando há vergonha persistente sobre algo específico do passado"
    risk: >
      Container errado (parceira como terapeuta, amigo blue-pill, internet
      pública) pode REFORÇAR a vergonha. Container importa mais que conteúdo.
    mastery_signal: >
      Sensação de alívio físico após compartilhar. Padrão de pensamento sobre
      a coisa muda — não é mais 'a prova que sou ruim', é 'coisa que aconteceu'.
    source_refs:
      - "NMMNG interview — case study car stereo, 12-step group"
      - "21 Report — Glover relata sua própria entrada em 12-step"
    conflict_with: []

  - id: father_reconciliation_letter
    name: "Father Reconciliation"
    description: >
      Processo deliberado de fazer paz com pai (vivo ou morto) — listar o que
      ele DEU, escrever/dizer o reconhecimento, fazer luto pelo que ele NÃO
      conseguiu dar. Reframe 'pai-vilão' → 'humano falho operando no pico dele'.
    script_examples:
      - "Carta/email — 'Pai, quero te agradecer por X, Y, Z. Essas coisas abençoaram minha vida.'"
      - "Glover escreveu sobre baseball — começou reconciliação que durou anos antes do pai morrer"
    when:
      - "Father wound ativo bloqueando recovery"
      - "Raiva crônica de figura de autoridade"
      - "Antes que o pai morra (Glover enfatiza)"
    risk: >
      Se pai ainda é abusivo ATIVO, reconciliação é prematura — primeiro
      proteção, depois processo. Não é forçar relação ruim a continuar.
    mastery_signal: >
      Aceitação 'isso é tudo que ele consegue dar' sem amargura. Capacidade
      de receber o que ele oferece sem cobrar o que ele não tem.
    source_refs:
      - "21 Report — Glover narra processo completo com seu pai"
    conflict_with: []

  - id: joining_a_tribe
    name: "Joining a Tribe"
    description: >
      Ação operacional — entrar em grupo masculino regular dentro de 30 dias.
      Não escolher 'o perfeito' — escolher um e ENTRAR. Iterar depois. BJJ,
      12-step, Mankind Project, men's group online, divorce group — qualquer
      coisa com presença masculina regular.
    script_examples:
      - "Procurar 'men's group [cidade]' OU 'Mankind Project [cidade]'"
      - "BJJ academy mais próxima — primeiro treino esta semana"
      - "12-step program relevante (AA, SAA, etc) — uma reunião esta semana"
    when:
      - "Isolamento masculino crônico"
      - "Após qualquer ruptura grande (divórcio, demissão, luto)"
      - "Início da recovery"
    risk: >
      Procurar 'o grupo perfeito' = paralisia. Algumas tribos vão ser ruins —
      sai e entra em outra. Não desistir do conceito por causa de uma má experiência.
    mastery_signal: >
      Cara consegue ligar pra 3+ homens às 3 da manhã com confiança que
      atenderiam. Tem rotina regular (semanal/quinzenal) com homens.
    source_refs:
      - "Rowan Andrews — 'de 1.5 amigo a 25-50 caras que pegariam avião'"
    conflict_with: []

  - id: positive_tension_via_polarity
    name: "Creating Positive Tension via Polarity"
    description: >
      Em vez de tentar nivelar (Nice Guy) ou criar drama (Bad Boy), criar
      polaridade masculina-feminina ativa — liderança, surpresa, presença
      plena, não-disponibilidade saudável, manter próprios projetos/tribo/missão.
    script_examples:
      - "Sair com amigos sem dar relatório minucioso"
      - "Mudar plano espontaneamente — 'pega a bolsa, vamos sair'"
      - "Não responder mensagem na hora, sem ansiedade de explicar"
      - "Demonstrar desejo direto (não via massagem-sneaky) — 'te quero agora'"
    when:
      - "Relacionamento que virou amizade morna"
      - "Match no app onde a conversa tá morrendo de simpatia"
      - "Casamento onde sexo desapareceu"
    risk: >
      Sem genuinidade, vira manipulação calculada — exatamente o que Glover
      condena em pickup. Polaridade tem que vir de vida REAL, não de jogo.
    mastery_signal: >
      Ela demonstra excitação espontânea sem você ter que 'trabalhar pra isso'.
      Iniciativa sexual dela aumenta. Drama negativo diminui.
    source_refs:
      - "NMMNG interview — desenvolvimento da tese de positive emotional tension"
    conflict_with: [strauss_early]

# =================================================
# ANTI-PATTERNS
# =================================================
anti_patterns:
  - id: covert_contract_giving
    name: "Covert Contract Giving"
    description: >
      Dar com expectativa oculta de retorno específico, sem nunca ter combinado.
      Engine do resentimento crônico do Nice Guy.
    symptoms:
      - "Pensamento 'fiz X, agora ela TEM que fazer Y'"
      - "Resentimento crescendo depois de favores que ninguém pediu"
      - "Lista mental de 'tudo que eu fiz por ela'"
      - "Sensação de injustiça constante na relação"
    consequence: >
      Ressentimento → passive-aggressive → explosão ou ghosting interno. Mulher
      sente a manipulação e se afasta. Cara culpa ela.
    antidote: "[heuristics:tell_the_whole_truth, techniques:pre_relationship_declaration] — declare antes o que oferece e o que espera, ou desista do oferecimento"
    source_refs:
      - "Rowan Andrews — definição clínica dos 3 covert contracts"
    conflict_with: [greene, strauss_early]

  - id: nice_guy_seduction
    name: "Nice Guy Seduction"
    description: >
      Tentar seduzir escondendo agenda sexual — virar amigo, escutar problemas,
      esperar 'ela perceber sozinha que merece sexo'. Friendzone autoinfligida.
    symptoms:
      - "Postar-se como 'amigo dela' enquanto deseja ela"
      - "Massagem como pretexto pra avançar"
      - "Escutar problemas dela por horas esperando turn-on"
      - "'Eu sou diferente dos outros caras' como pitch"
    consequence: >
      Friendzone permanente. Ela respeita você muito pra te ver como homem.
      Ressentimento explode anos depois.
    antidote: "[heuristics:dont_hide_your_agenda, heuristics:be_bold] — torna desejo legível desde o início, sem agressividade"
    source_refs:
      - "NMMNG interview — Glover descreve sua própria 'nice guy seduction' na faculdade"
    conflict_with: [strauss_early]

  - id: managing_her_emotions
    name: "Managing Her Emotions"
    description: >
      Tentar controlar humor, opinião, percepção dela — 'jogar o lado dela da rede'.
      Esgota o homem, atrofia ela, mata polaridade.
    symptoms:
      - "Pânico quando ela tá brava"
      - "Reescrever o que diz pra não 'provocar reação'"
      - "Sentir-se responsável pelo humor dela"
      - "Investigar humor antes de qualquer pedido"
    consequence: >
      Ela aprende impotência emocional (não desenvolve regulação própria). Ele
      vira gestor emocional 24/7. Polaridade morre. Sexo morre.
    antidote: "[heuristics:play_your_side_of_the_net, heuristics:be_equally_okay]"
    source_refs:
      - "Rowan Andrews — caso do cliente passando weekend gerenciando 2 mulheres"
    conflict_with: []

  - id: hiding_truth_to_avoid_conflict
    name: "Hiding Truth to Avoid Conflict"
    description: >
      Esconder gastos, opiniões, planos, conversas — pra evitar reação dela.
      Cada omissão descoberta destrói mais confiança do que a verdade original
      teria destruído.
    symptoms:
      - "Editar mentalmente o que conta"
      - "Pegar 'caminho mais longo' pra não dizer o que vai aborrecer"
      - "Esconder pequenas coisas — almoço, gasto, conversa"
    consequence: >
      Casamento de mentira. Quando ela descobre (sempre descobre), reação é
      desproporcional — não pela coisa, pela mentira.
    antidote: "[heuristics:tell_the_whole_truth, frameworks:differentiation]"
    source_refs:
      - "NMMNG interview — esposa de Glover triggered ao descobrir o que ele omitia"
    conflict_with: [greene]

  - id: needless_and_wantless_persona
    name: "Needless and Wantless Persona"
    description: >
      Performar ser homem 'sem necessidades' enquanto internamente é totalmente
      needy. Repelente. Mulher detecta a mangueira emocional escondida e foge.
    symptoms:
      - "'Não preciso de nada' como mantra"
      - "Desconforto em receber presentes/elogios"
      - "Bad receiver — dificuldade dizer 'sim, obrigado'"
      - "Frustração crescendo porque ninguém 'adivinha' o que precisa"
    consequence: >
      Mulher sente que 'algo tá errado' sem saber o quê. Repulsa inexplicável.
      Cara fica mais needy ainda porque nunca recebe.
    antidote: "[frameworks:nice_guy_recovery_process — make needs a priority, become a good receiver]"
    source_refs:
      - "Rowan Andrews — 'I'm still working on being a good receiver after 35 years'"
    conflict_with: []

  - id: passive_aggression_and_victim_puke
    name: "Passive Aggression and Victim Puke"
    description: >
      Padrões de saída do resentimento acumulado — jab passivo (sarcasmo,
      indireta, sabotar combinado) OU explosão tardia ('victim puke') vomitando
      meses de ruminação de uma vez.
    symptoms:
      - "Concordar verbalmente e não fazer"
      - "Indireta cortante seguida de 'tava brincando'"
      - "Explosão sobre algo que aconteceu há 6 meses sem nunca ter sido falado"
      - "Tratamento silencioso prolongado"
    consequence: >
      Ela vive insegura — 'pareço bem mas nunca sei quando vem'. Confiança em
      ruínas. Ex de Glover citada — 'preferia um asshole, pelo menos sei que vai me tratar mal sempre'.
    antidote: "[heuristics:tell_the_whole_truth] em tempo real + [frameworks:nice_guy_recovery_process]"
    source_refs:
      - "21 Report — narrativa da ex-esposa de Glover"
    conflict_with: []

  - id: trying_to_fix_her
    name: "Trying to Fix Her"
    description: >
      Sentir responsabilidade por consertar problemas/feridas dela. Vira pai-terapeuta
      em vez de homem. Mata desejo dela (filha não deseja pai).
    symptoms:
      - "Soluções não-pedidas pra problemas dela"
      - "Carregar parceira 'broken' pensando que vai 'curar com amor'"
      - "Sentir orgulho de 'ser tudo pra ela'"
    consequence: >
      Ela infantiliza, não evolui. Atração some. Cara esgota. Termina em
      crise — ela vai querer 'crescer' e ele vira figura paterna a ser deixada.
    antidote: "[heuristics:play_your_side_of_the_net]"
    source_refs:
      - "NMMNG interview — Glover sobre próprios padrões de problem-solver na esposa atual"
    conflict_with: []

  - id: nice_guy_at_work
    name: "Nice Guy at Work (Committee of Mediocrity)"
    description: >
      Mesma dinâmica do Nice Guy em relacionamento, projetada em carreira —
      não rocar o barco, não pedir aumento, ajudar todo mundo enquanto seus
      projetos atrasam, evitar visibilidade. Curso do próprio Glover —
      'Nice Guys Don't Finish Last, They Rot in Middle Management'.
    symptoms:
      - "Outros menos competentes promovidos na sua frente"
      - "Trabalho de outros caindo na sua mesa"
      - "'Committee of mediocrity' na cabeça — 'não te destaca, não arrisca'"
      - "Imposter syndrome bloqueando aceitação de oportunidades"
    consequence: >
      Carreira estagnada em middle management. Frustração financeira crônica.
      Ressentimento contra empresa/colegas que 'roubaram seu lugar'.
    antidote: "[heuristics:be_bold, frameworks:differentiation] aplicados a carreira"
    source_refs:
      - "Rowan Andrews — Glover narra curso e padrão"
    conflict_with: []

  - id: isolation_as_strategy
    name: "Isolation as Strategy"
    description: >
      Tentar resolver vida sozinho — recovery solo, problemas relacionais sem
      mentoria, autodesenvolvimento via consumo passivo de conteúdo. Patologia
      contemporânea masculina mais perigosa segundo Glover.
    symptoms:
      - "Zero amigos homens próximos"
      - "Consumir podcast/livro sem aplicar nem testar com outros"
      - "'Não preciso de terapia/grupo, eu resolvo'"
      - "Vícios em conteúdo online (porn, doom, vídeos) como substituto de conexão"
    consequence: >
      Recovery não acontece. Padrões Nice Guy se reforçam. Saúde mental degrada.
      Glover cita estatísticas — depressão, suicídio, isolamento masculino subindo.
    antidote: "[techniques:joining_a_tribe, frameworks:tribe_and_male_initiation]"
    source_refs:
      - "Rowan Andrews — tese sobre AI/isolamento/conexão masculina"
      - "Boldness palestra — 'we're looking for a tribe'"
    conflict_with: []

  - id: chasing_validation_through_sex
    name: "Chasing Validation Through Sex"
    description: >
      Usar sex (especialmente conquista) como prova de valor pessoal. Variante
      moderna do Nice Guy — usar técnicas de pickup pra preencher buraco de
      auto-aprovação.
    symptoms:
      - "Contar parceiras como score"
      - "Crash emocional após rejeição"
      - "Sexo vazio pós-conquista"
      - "Body count como medida de masculinidade"
    consequence: >
      Vícios variados (porn, conquistas, validação). Incapacidade de presença
      em sexo real. Misoginia latente como defesa.
    antidote: "[frameworks:nice_guy_recovery_process] + reframe sex como personal growth machine, não validação"
    source_refs:
      - "NMMNG interview — Glover sobre sex como personal growth, não performance"
    conflict_with: [strauss_early]

# =================================================
# SCRIPTS
# =================================================
scripts:
  - id: bowing_out_after_red_flag
    situation: "Date 2-3 mostrando red flag clara (drama, manipulação, valores incompatíveis)"
    variants:
      - tone: autentico
        text: "Olha, gostei de te conhecer, mas tô percebendo que a gente quer coisas diferentes. Vou parar por aqui — sem mágoa, te desejo o melhor."
        context_notes: "Direto, sem ghosting, sem explicação longa. Modelo 'good ender'."
      - tone: direto
        text: "Não vai rolar continuar. Cuida."
        context_notes: "Versão mais curta — quando contexto exige cortar limpo (relação curta, sinais ruins claros)"
    source_refs:
      - "Boldness palestra — princípio do 'good ender'"

  - id: declining_to_be_emotional_dump
    situation: "Parceira começa ruminação longa sobre mesmo problema pela 5a vez"
    variants:
      - tone: autentico
        text: "Vem cá. [pega no rosto, olho-no-olho] Eu te amo e tô aqui. Me dá a versão de cara — em 2 frases o que aconteceu e o que cê quer fazer. Eu não consigo te ajudar com 30 minutos de ruminação."
        context_notes: "Toque + frame + liderança. Não é frieza, é redirecionamento masculino."
    source_refs:
      - "Boldness palestra + Rowan Andrews — combinação de táticas"

  - id: pre_relationship_terms
    situation: "Date 4-5, claramente engatando, hora de definir frame"
    variants:
