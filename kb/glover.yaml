case_studies:
  - id: glover_own_2nd_marriage
    title: "Glover's 2nd Marriage — 14 anos, sem sexo, virou catalisador"
    narrative: >
      Glover casou-se com mulher 'gorgeous' (descrição própria). Na lua-de-mel
      ela disse 'que bom que agora a gente não precisa fingir gostar de sexo'.
      14 anos de marriage com sexo escasso, ele em padrão Nice Guy clássico —
      tentando agradar, escondendo necessidades, evitando conflito. Ela
      eventualmente disse 'todo mundo te acha um cara legal, mas você é
      passive-aggressive. Vai buscar ajuda ou eu vou embora'. Ele se diagnosticou
      como sex addict (errado), entrou em 12-step de sex addicts, descobriu que
      não era — mas o grupo virou primeira tribo masculina dele. Daí saiu NMMNG.
    lessons:
      - "Casamento ruim como 'big stick upside the head' — gratidão tardia pelo catalisador"
      - "Diagnóstico próprio pode estar errado mas a busca por ajuda abre caminho"
      - "Não dá pra fingir 'gostar' de algo (Nice Guy treina máscara, esposa cansou)"
      - "Tribo masculina entra acidentalmente — escolha do contexto importa mais que do diagnóstico"
    source_refs:
      - "21 Report + NMMNG interview + Rowan Andrews — Glover relata múltiplas vezes"

  - id: glover_dating_in_late_40s
    title: "Glover Late 40s — Dating Pós-Divórcio com Novo Sistema Operacional"
    narrative: >
      Pós 2o divórcio, Glover (final dos 40s, careca, grisalho, baixa T,
      falência em curso, não 'specimen') se viu 'spoiled by choice'. Mulheres
      vindo até ele, propondo, ficando nuas em primeiros encontros. A mudança?
      Tinha matado as 3 crenças auto-limitantes ('mulheres não gostam de sexo,
      mulheres acham homem-que-quer-sexo um perv, mulheres não me desejam'),
      tava bold ('foda-se, vou viver como quero'), e walking through open doors
      (não filtrava antes — entrava e via). Aprendeu pre-sex talk + pre-relationship
      declaration. Mulheres respondiam: 'nunca tive sexo assim'.
    lessons:
      - "Crenças auto-limitantes destravadas valem mais que aparência/idade/dinheiro"
      - "Boldness é universalmente atraente (Glover comprovou no próprio corpo aos 47)"
      - "Walk through open doors > filtrar antecipadamente"
      - "Pre-sex talk + pre-relationship declaration funcionam — mulheres recebem com alívio"
      - "Inversão paradoxal — quanto MENOS needy, mais elas desejam"
    source_refs:
      - "Boldness palestra + Rowan Andrews — narrativa detalhada"

  - id: car_stereo_shame
    title: "The Car Stereo Shame — Como Toxic Shame Se Desfaz em Container Seguro"
    narrative: >
      Em workshop, Glover perguntou ao grupo qual era a 'vergonha mais profunda
      — coisa que se descobrissem te rejeitariam'. Um homem adulto, negro,
      grandalhão, Nice Guy clássico, compartilhou que aos 15 anos roubou um
      som de carro. Carregou isso a vida toda como 'prova de que sou ruim'.
      O grupo respondeu 'irmão, todo mundo fez merda em adolescente — isso é
      normal'. Outros começaram a compartilhar próprias merdas adolescentes.
      Toxic shame morreu na hora. O cara teve experiência liberadora.
    lessons:
      - "Toxic shame só sobrevive em isolamento — morre quando exposta a container seguro"
      - "Vergonhas 'únicas' geralmente são experiências universais"
      - "Container importa — grupo masculino seguro > parceira > internet pública"
      - "Verbalizar > processar mentalmente"
    source_refs:
      - "NMMNG interview com Patrick Bet-David"

  - id: clients_weekend_managing_two_women
    title: "O Cliente Que Gastou Weekend Inteiro Gerenciando Duas Mulheres"
    narrative: >
      Cliente de Glover em arranjo ENM (ethically non-monogamous) levou duas
      parceiras pra weekend de celebração de venda da empresa dele. Em vez de
      curtir o próprio sucesso, passou os dias inteiros gerenciando emoções
      das duas (gatilhos de irmã mais velha/mais nova) — não cuidou de si.
      Glover trabalhou com ele 'e se você só jogasse o SEU lado da rede?
      Deixasse elas processarem o trigger sozinhas, sentirem hurt/disappointed,
      e encontrarem o caminho de volta?'
    lessons:
      - "Tentar gerenciar emoções dos outros = forma sofisticada de Nice Guy"
      - "Permitir que pessoas sintam desconforto é amoroso, não cruel"
      - "Quando você joga só seu lado, elas desenvolvem capacidade de jogar o delas"
      - "Tribo conta mesmo em arranjos não-tradicionais — princípio é o mesmo"
    source_refs:
      - "Rowan Andrews"

  - id: glover_father_reconciliation
    title: "Glover e o Pai — Reconciliação pelo Baseball"
    narrative: >
      Mãe de Glover criou ele 'pra ser diferente do pai' (depois se desculpou).
      Pai era moody, crítico, com mood disorder. Glover não falou com pai por
      15 anos. Em determinado momento (lendo artigo sobre baseball no jornal),
      lembrou que pai ensinou ele baseball — escreveu carta agradecendo isso
      especificamente. Começaram a tomar café juntos 1-2x por ano. Glover
      chegou à conclusão 'meu pai é humano falho operando no pico dele — isso
      é tudo que vou conseguir dele, e tá ok'. Pai teve AVC, ficou em hospice
      2 semanas — Glover lá todo dia, beijo na bochecha, 'obrigado pai'.
    lessons:
      - "Reconciliação não exige pai 'consertar' o passado — exige aceitar o que ele consegue dar"
      - "Específico (baseball) > genérico (sentimentos vagos)"
      - "Forgive father = forgive yourself = permitir ser homem falho também"
      - "Better late than never — fazer antes que o pai morra é regalo pra você"
    source_refs:
      - "21 Report — narrativa completa"

