        text: "Pai, escrevo só pra te dizer obrigado por [coisa específica que ele DEU — esporte, ofício, presença em algum momento]. Isso me marcou e abençoou minha vida. Tô grato. Beijo."
        context_notes: "Curto. Específico. Sem cobrança. Sem expectativa de resposta. Abre porta sem forçar."
