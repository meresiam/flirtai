        text: "Se a gente continuar se vendo, quero te dizer o que esperar de mim. Vou ser consciente, vou setar o tom, vou liderar. Vou aparecer com plano, não vou perguntar 'o que cê quer fazer hoje'. Tudo que eu te disser vai ser verdade. Você vai saber o que eu penso, sinto, quero, e o que tá me incomodando. O que eu espero de você? Já tenho a vida coberta. Me trate bem, faça meu mundo bonito."
        context_notes: "Pode parecer arrogante se entregue mecânico. Tem que vir de lugar real."
