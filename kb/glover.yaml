heuristics:
  - id: dont_hide_your_agenda
    rule: "Não esconda sua agenda sexual — ela percebe e despreza."
    rationale: >
      A 'nice guy seduction' (massagem, escutar problemas, sneaking-up via toque)
      é detectada pela mulher e a repele. Honestidade da intenção (sem agressividade)
      é mais atrativa que ocultação 'cavalheirosa'.
    when:
      - "Primeiras interações com mulher que você deseja"
      - "Quando se pega 'esperando o momento certo' pra mostrar interesse"
    counter_example: >
      Honestidade ≠ assédio. Não é dizer 'quero transar' no minuto 1 — é não
      DISFARÇAR o desejo de quem você é. A diferença é sutil mas crítica.
    source_refs:
      - "NMMNG interview — 'hide my sexual agenda' como erro central"
      - "Boldness palestra — 'go live this stuff with no attachment to outcome'"
    conflict_with: [strauss_early]

  - id: be_good_ender_over_good_picker
    rule: "Aprenda a sair antes de aprender a escolher — ser bom 'ender' cobre múltiplos pecados de ser mau 'picker'."
    rationale: >
      Você vai picar mulheres erradas — isso é matemático. O que separa vida boa
      de vida ruim é a velocidade de cortar perdas. Glover diz que aprender a
      'end' é talvez a chave nº1 de homens bem-sucedidos em qualquer área.
    when:
      - "Date 2 ou 3 mostrando red flags claras"
      - "Relacionamento de meses dizendo 'isso não está funcionando'"
      - "Match no app que tá só dando trabalho"
    counter_example: >
      Não é ghosting. É comunicar claramente que tá indo embora e ir embora.
      Ender ≠ desaparecer.
    source_refs:
      - "Boldness palestra — 'being a good ender can cover a multitude of sins'"
    conflict_with: []

  - id: walk_through_open_doors
    rule: "Quando a porta abrir — entra. Não fica analisando se ela é hot suficiente."
    rationale: >
      Um dos maiores fracassos masculinos é NÃO entrar nas portas que abrem —
      sinais de interesse, propostas, oportunidades. Filtra DEPOIS da entrada,
      não antes. Filtrar antes é covardia disfarçada de critério.
    when:
      - "Mulher demonstrando interesse claro (olhar mantido, aproximação, proposta)"
      - "Dúvida 'será que ela é minha tipo?' bloqueando ação"
    counter_example: >
      Se ela tá visivelmente bêbada/incapacitada ou se há contexto óbvio (chefe,
      esposa de amigo), porta NÃO está aberta — não é covardia, é integridade.
    source_refs:
      - "Boldness palestra — 'walk through open doors'"
    conflict_with: []

  - id: play_your_side_of_the_net
    rule: "Jogue só o seu lado da rede. Não tente jogar o lado dela."
    rationale: >
      Tentar gerenciar emoções, percepções, humor dela é regressão Nice Guy.
      Cada um responsável pelo próprio lado. Quando você para de fazer o trabalho
      emocional dela, ela aprende a fazer — e o relacionamento para de drenar.
    when:
      - "Ela tá triggered e você sente impulso de 'fixar' o que ela tá sentindo"
      - "DR onde você fica tentando provar que não fez o que ela acha que fez"
      - "Tendência de carregar o humor dela pra você"
    counter_example: >
      Indiferença gélida ≠ jogar seu lado. Você pode segurar ela, olhar nos
      olhos, dizer que ama — e ainda assim não TENTAR resolver o que é dela.
    source_refs:
      - "Rowan Andrews — 'play your side of the net' (pickleball metaphor)"
    conflict_with: []

  - id: be_equally_okay
    rule: "Esteja igualmente ok se ela tá feliz OU infeliz, se o relacionamento dá certo OU não."
    rationale: >
      O Nice Guy é REFÉM do humor dela e do destino da relação. Equanimidade
      (não indiferença) sobre esses dois eixos é o que neutraliza o impulso de
      pleasing. Paradoxalmente — quanto mais okay com 'pode acabar', melhor fica.
    when:
      - "Briga onde você sente pânico de 'perder ela'"
      - "Decisão sobre romper algo que claramente não tá funcionando"
    counter_example: >
      Equanimidade ≠ frieza performada. É trabalho interno, não pose. Fingir
      indiferença pra manipular é covert contract novo.
    source_refs:
      - "NMMNG interview — 'be equally okay with whether she's happy or unhappy'"
    conflict_with: []

  - id: dont_listen_to_problems_endlessly
    rule: "Não escute a versão menina dos problemas dela — peça a versão de cara."
    rationale: >
      Tempo gasto escutando ela falar problemas é INVERSAMENTE proporcional à
      probabilidade de transar com ela. Não é frieza — é não-padrão Nice Guy
      'mãe terapeuta'. Liderar a conversa é amoroso, não desprezo.
    when:
      - "Ela tá ruminando problema sem fim claro"
      - "Você se pega usando 'escuta empática' como técnica de approval"
    counter_example: >
      Em crises reais (luto, demissão pesada) — escuta sim, com presença. A regra
      é sobre a ruminação cotidiana de problemas sem fim, não momentos de fato.
    source_refs:
      - "Boldness palestra — 'rule of thumb' direto do Glover"
      - "Anedota — terapeuta mulher disse 'you don't have to listen'"
    conflict_with: []

  - id: live_authentic_life_dont_chase_woman
    rule: "Construa um bolo de vida grande — e convide ela pra ser a cobertura, não o bolo."
    rationale: >
      Mulher detecta neediness biologicamente. Cara cuja vida gira em torno dela
      é repulsivo. Cara que tem vida cheia (trabalho, amigos, missão, hobbies,
      tribo) é magnético — sobra dele, não falta.
    when:
      - "Cara organizando agenda em volta da disponibilidade dela"
      - "Cara que quer mensagem o dia inteiro"
      - "Cara projetando 'a minha vida começa quando ela aparece'"
    counter_example: >
      Não é evitar prioridade emocional pra ela. Casamento exige investimento.
      A regra é sobre o FUNDAMENTO da vida não depender dela.
    source_refs:
      - "Rowan Andrews — 'come be the icing on my great cake, not the cake'"
    conflict_with: []

  - id: surprise_dont_repeat
    rule: "Não repita o que funcionou da última vez sexualmente — varie."
    rationale: >
      Mulher se entedia rápido com mesmo script. Mesma técnica = morte do desejo.
      Comparação Glover — 'ela usa a mesma roupa pro trabalho um mês?'. Nice Guy
      acha que 'achou a fórmula' e a repete até matar atração.
    when:
      - "Relacionamento longo onde sexo virou rotina"
      - "Após sexo bom — impulso de 'fazer igualzinho amanhã'"
    counter_example: >
      Variar ≠ truques aleatórios. É presença, leitura do momento, não-piloto-automático.
    source_refs:
      - "NMMNG interview — metáfora dance leads 'be thinking 2-3 moves ahead'"
    conflict_with: []

  - id: challenge_self_limiting_beliefs
    rule: "Caça e desmonta crenças auto-limitantes sobre mulheres antes de qualquer outra coisa."
    rationale: >
      Glover viveu décadas com 3 crenças travando ele — 'mulheres não gostam de
      sexo', 'mulheres acham homem que quer sexo um perv', 'mulheres não me
      desejam'. Sem matar essas crenças, técnica nenhuma funciona — você emite
