# Postgres 16 + Apache AGE + pgvector p/ o RAG FlirtAI.
# Porta 5433 (host) -> 5432 (container) p/ NAO colidir com o Postgres do app.
services:
  flirtai-kb-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: flirtai-kb-db:pg16-age-pgvector
    container_name: flirtai-kb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flirtai
      POSTGRES_PASSWORD: flirtai_dev_pass
      POSTGRES_DB: flirtai_kb
    ports:
      - "5433:5432"
    volumes:
      - flirtai-kb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flirtai -d flirtai_kb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  flirtai-kb-pgdata:
