## Particularidades técnicas
- TikTok requer curl_cffi instalado (`pip install curl_cffi`) pra impersonação
  passar; já está OK no env atual
- Áudios curtos = Whisper roda RÁPIDO
- Pode ter clips só com música/legenda (sem fala) — Whisper devolve vazio,
  filtrar depois

## Particularidades de extração
- Marcar cada cantada como `script_record`:
  - situation: visual_trigger | audio_trigger | contextual | omegle | festa
  - tone: comico (sempre — esse é o mind)
  - setup: contexto + observação
  - punchline: a cantada em si
  - reaction: como a gata reage (riso, fora, beijo, ignora)
- NÃO buscar framework formal — esse mind É script puro
- Cross-referenciar com Krausche/Vilaverde (que também usam cantadas mas
  com framework por trás)
