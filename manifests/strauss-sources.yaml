## Plano de coleta

```
Fase 1.1 — Scrape neilstrauss.com (artigos, FAQ, manifesto)
  → corpus/strauss/raw/site/

Fase 1.2 — Download Tier 2 + 3 + 4 (yt-dlp para vídeos, download direto para podcasts)
  → corpus/strauss/raw/audio/<episode>.mp3
  → ~10-12 episódios @ avg 1h = ~12h áudio

Fase 1.3 — Whisper large-v3
  → corpus/strauss/transcripts/<episode>.md
  → ~150-200K tokens

Fase 1.4 — Marcar metadata: cada transcript recebe tag {phase: early|late}
  para distinguir o Strauss-PUA do Strauss-autêntico
  → corpus/strauss/processed/full-corpus.md
  → corpus/strauss/processed/by-phase/{early.md, late.md, evolution.md}
```

## Volume estimado final
- ~180K-220K tokens

## Particularidade da extração
- O `cognitive-analyst` deve marcar cada framework/heurística/técnica com:
  `phase_origin: [early, late, both]`
  → para o agente do FlirtAI saber se é técnica de "modo caça" ou "modo conexão"
