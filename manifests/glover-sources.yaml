## Frameworks-alvo da extração
1. **Nice Guy Syndrome** — sintomas, diagnóstico, etiologia
2. **Covert Contracts** — "se eu fizer X, ela vai fazer Y" sem combinar
3. **Boldness** — pedir, expressar, ocupar espaço
4. **Setting the frame** — não administrar percepção dela
5. **Integrity** — alinhamento entre o que sente, pensa, diz, faz
