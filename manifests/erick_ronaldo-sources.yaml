```

## Volume estimado final
- ~400K tokens — alto volume mas semântica mais repetitiva (mesma estrutura
  de abordagem em loop)
- Útil pra extrair PADRÕES (não framework) — qual cantada repete, qual reage
  bem, qual frame entra primeiro

## Particularidades técnicas
- yt-dlp via canal ID (mais confiável)
- IDIOMA MISTO — vídeos em PT, EN, ES dependendo do país
  - Default sugerido: rodar Whisper com `--language auto` (mlx-whisper
    suporta detecção)
  - Se sair ruim, separar por título (EN vs PT) e rodar batches
- Áudios de campo em geral — Whisper vai ter dificuldade em ambientes
  ruidosos (rua, balada)

## Particularidades de extração
- Foco em PATTERNS, não THEORY:
  - Catalogar tipos de abordagem (compliment opener, question opener,
    challenge opener, situational opener)
  - Catalogar reações comuns (resistance, engagement, dismissal,
    counter-question)
  - Identificar o "tempo" típico (quantos turns até pedir número/insta)
- Não esperar framework formal — é cara que faz, não cara que explica
