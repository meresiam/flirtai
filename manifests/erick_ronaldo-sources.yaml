Fase 1.2 — Whisper (LANGUAGE DETECTION! talvez en, não pt)
  → corpus/erick_ronaldo/transcripts/<video>.txt
  → estimativa ~400K tokens (en + pt misturado)

Fase 1.3 — Consolidação
