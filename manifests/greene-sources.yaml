## Plano de coleta

```
Fase 1.1 — Scrape blog próprio (powerseductionandwar.com)
  → script python + BeautifulSoup → markdown raw → corpus/greene/raw/blog/
  → estimativa: 50-100 artigos longos do próprio Greene

Fase 1.2 — Download podcasts/YouTube (yt-dlp + ffmpeg para áudio)
  → corpus/greene/raw/audio/<episode>.mp3
  → Tier 1 + Tier 2 = ~15-20 episódios @ avg 1h30 = ~25h áudio

Fase 1.3 — Transcrição Whisper (large-v3, idioma en)
  → corpus/greene/transcripts/<episode>.md
  → estimativa: 25h áudio = ~250-300K tokens texto

Fase 1.4 — Consolidação
  → corpus/greene/processed/full-corpus.md
  → corpus/greene/processed/by-topic/{seduction,power,human-nature,mastery}.md
```

## Volume estimado final
- ~250K-350K tokens (mix blog próprio + transcrições)
- Suficiente pra extração rigorosa via MMOS cognitive-analyst

## Quem vai escapar (sem livros)
- Detalhes de cada um dos 24 manobras (livro explora cada uma em capítulo dedicado)
- Exemplos históricos densos (Cleópatra, Casanova, etc. — biografias do livro)
- Mitigação: complementar com summaries detalhados públicos (Blinkist tipo, reviews acadêmicos)
